# The Freedesktop runtime the Flatpak runs on, org.freedesktop.Platform, and
# the SDK it is built against, org.freedesktop.Sdk (docs/details/VENDORS.md),
# pinned: the branch names the runtime in the application's metadata, and each
# is fetched at exactly the commit below for its architecture
# (scripts/build/freedesktop_sdk.sh), so a build months from now compiles
# against the same files. The client links the SDK; `flatpak build-init`
# reads the runtime as well. Read by bash (`.`) and by make (`include`): plain
# NAME=value lines only.
#
# A bump is the branch and the four commits, which `flatpak remote-info
# flathub runtime/org.freedesktop.<Sdk|Platform>/<arch>/<branch>` prints.
FREEDESKTOP_BRANCH=26.08
FREEDESKTOP_SDK_x86_64=a1b744b072d9f55d061e35382547ae80dad8d92abecc1da7dc1818de2daabfd3
