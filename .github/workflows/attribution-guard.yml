name: attribution-guard

# Thin caller. All logic lives in dannyheskett/.github, shared by every repo.
# Check name in this repo is "guard / guard".
#
# This repo used to carry a verbatim fork of the guard. It drifted: the shared
# copy fixed a bug where a pushed TAG stayed in the "other refs" set, so
# `rev-list --not $others` cancelled out the pushed commit and a tag pointing at
# a commit reachable from no branch was never scanned at all. The fork never
# received that fix. Calling the shared workflow is what stops that happening
# again.
on:
  push:
  pull_request:
  # Lets release/deploy workflows gate on the guard via `uses:`.
  workflow_call:

permissions:
  contents: write

jobs:
  guard:
    uses: dannyheskett/.github/.github/workflows/attribution-guard.yml@v1
    permissions:
      contents: write
