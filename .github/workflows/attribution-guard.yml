# Rejects any push that introduces a commit referencing the banned pattern in its message or
# author/committer lines. GitHub cannot refuse a push before it lands on non-Enterprise
# plans, so this detects: a feature branch's violation fails its pull request (the check
# `guard`, posted by pr-policy), which then cannot merge, and a push to staging fails its
# ci run. staging and main cannot be auto-remediated (see the note on that step) and must
# be corrected by hand. Only NEW commits are scanned (range-limited), so pre-existing
# history does not trip the guard.
name: attribution-guard

# The scan is scripts/release/attribution_scan.sh, one copy, run by this workflow, by
# pr-policy and by ci, so no copy of it can drift from another.

on:
  # main, which moves only by a release or a promotion, and from the release
  # workflows by `uses:`. The scan itself (scripts/release/attribution_scan.sh)
  # also runs as a step where an event already has a job, so it takes no runner
  # of its own: pr-policy on a pull request, posting the required check `guard`,
  # and ci on a push to staging. Tags come from the release workflows alone.
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: attribution-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan new commits
        id: scan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: scripts/release/attribution_scan.sh

      # The default branch is remediated by a HUMAN, not by this step.
      #
      # main takes no update but a release: a ruleset refuses every push, force or not,
      # except from the release deploy key, so the force-reset this step used to attempt
      # (PATCH .../git/refs/heads/main with force=true) is refused. It never worked, while
      # the header comment promised the branch was reset "within seconds".
      #
      # What actually protects main is upstream of it. This job is a REQUIRED status check
      # on pull requests into staging, so a violating commit cannot merge; and no
      # release-candidate is built from a staging commit this guard did not pass on. If one
      # reaches main anyway (an admin override on the ruleset) it STAYS there until removed
      # by hand -- that is the real behaviour, and it is the documented one.
      #
      # Non-default branches and tags are a different matter: nothing protects those, so
      # deleting them still works and is still done here.
      - name: Remediate violating push (non-default refs only)
        if: failure() && steps.scan.outputs.violation == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          case "$REF" in
            refs/heads/*)
              branch="${REF#refs/heads/}"
              # staging is protected like the default branch: a release
              # candidate is cut from it, and deleting it would lose its place.
              if [ "$branch" = "$DEFAULT" ] || [ "$branch" = staging ]; then
                echo "::warning::$branch is protected and cannot be reset automatically. \
          The offending commit is still on $branch and must be removed by hand \
          (git rebase -i / git reset, then a force push by an admin with protection \
          temporarily relaxed)."
              else
                echo "Deleting branch $branch"
                gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
              fi
              ;;
            refs/tags/*)
              echo "Deleting tag ${REF#refs/tags/}"
              gh api -X DELETE "repos/$REPO/git/refs/tags/${REF#refs/tags/}"
              ;;
          esac
