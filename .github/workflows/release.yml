# Publish a release of the daemon (ARCH-20).
#
# A release is a RELEASE-CANDIDATE given a number. release-candidate.yml runs
# the full suite on a staging commit, builds everything a release ships from
# it, stores that by its build id, the short commit, and publishes it in this
# repository as release-N-rcK; this workflow takes one release-candidate by
# its tag, fetches what the release-candidate stored,
# verifies the signed manifest, appends the Release N snapshot to main (the
# candidate's tree with the documentation promoted since applied on top;
# scripts/release/main_next.sh; fast-forward only), tags release-N on the
# candidate's commit, packages the same binaries under N and publishes. No
# compiler runs here and no test: what was built and verified for the
# release-candidate is what ships, and a release takes minutes. The one check
# after publishing is the release's verification of what it published
# (scripts/release/smoke.sh). Five channels come out of one run,
# all carrying the same number:
#
#   apt      Debian/Ubuntu, GPG-signed repository in object storage
#   dnf/yum  RHEL family, GPG-signed repository in object storage
#   tarball  everyone else, and the offline case -- attached to the GitHub release
#   image    the build's image, copied to :N and :latest in the build
#            repository (IMAGE_REPO_BUILD) and, when set, IMAGE_REPO_EXTRA;
#            and to :rc in the build repository alone, which a
#            release-candidate moved and which never trails :latest
#   windows  the client, not the daemon: an installer attached to the GitHub
#            release (signed when Artifact Signing is configured), and an
#            MSIX for the Store
#
# ONE BINARY PER ARCHITECTURE feeds the .deb, the .rpm, the tarball and the
# image, so all four ship a byte-identical artifact: the one the build's
# manifest names. NOTHING IN THIS WORKFLOW USES DOCKER (skopeo copies, buildah
# built); the Windows installer and MSIX are packaged, and signed when
# configured, on Linux (packaging/build-windows.sh, scripts/release/
# sign_windows.sh).
#
# Three jobs, each its steps in sequence on one runner, all in the `release`
# environment -- GitHub bills every job rounded up to a whole minute plus its
# set-up, so a job is added only where the run must be able to stop or
# resume:
#   prepare    the run is on a release-candidate; the release-candidate
#              resolved; the credentials checked; its stored build fetched
#              and verified; the number checked, then reserved as the
#              release-N tag. Every check runs before the number is
#              reserved, so a release that cannot go ahead refuses with
#              nothing changed: there is no dry run.
#   deploy     the packages and the Windows installers under N, main moved,
#              the repositories, the release and the images published, and
#              what was published verified (the smoke).
#   finish     the shipped issues closed and sent for the release notes, the
#              release-candidates of N removed, and everything copied to the
#              public repository; each part's failure only reported.
# and `unreserve`, only when something failed before anything was published:
# it returns the number.
#
# Everything happens in this repository: the release-N tag is pushed and main
# is moved with the deploy key (RELEASE_SSH_KEY, in the `release` environment),
# which the main and release-* tag rulesets let through, and the GitHub release
# is made with the job's own token. The shipped issues -- those of the
# candidate's commits and of the documentation it carries onto main -- are
# closed on openchime/openchime, the OC tracker, with PUBLIC_TOKEN, and sent to
# the control plane for the release notes (at CONTROL_PLANE_URL, signed in
# with the job's OIDC token). Last, main, staging, the tag and the release are
# copied to the repository the PUBLIC_REPO variable names, a convenience
# nothing here depends on.
name: release

# Dispatched on the release-candidate's tag, which is the release-candidate
# released:
#
#   gh workflow run release.yml --ref release-1-rc1
#
# so the copy of this workflow that runs is the one in the commit it releases,
# not a branch's.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# Every deployment-specific value is a repository variable or secret.
env:
  # Every bash step, and every script it runs, retries what fails in a call to
  # GitHub's network and gives up on a dead connection (.github/net-retry.bash).
  BASH_ENV: ${{ github.workspace }}/.github/net-retry.bash
  # The build's image is in the build repository; a release copies it to :N
  # and :latest there and, when the variable is set, in the second
  # repository. The registry takes basic auth: the IMAGE_REGISTRY_USER
  # variable, and each repository's token as the password; the login's
  # registry is the build repository's first path segment.
  BUILD_IMAGE: ${{ vars.IMAGE_REPO_BUILD }}
  EXTRA_IMAGE: ${{ vars.IMAGE_REPO_EXTRA }}
  IMAGE_REGISTRY_USER: ${{ vars.IMAGE_REGISTRY_USER }}
  DIST_S3_REGION: ${{ vars.DIST_S3_REGION || 'auto' }}
  # Object storage that speaks the S3 API; rclone is configured from these and
  # the keys, which are mapped into the steps that write its configuration.
  # Named for the role rather than the provider. Nothing outside this
  # workflow knows where the bytes live -- DIST_BASE_URL is served from the
  # bucket outside it -- so moving to another S3 endpoint is a change to
  # these values and nothing else. That indirection is the reason the public
  # URL can be permanent while the storage behind it is not. Every release is
  # published to both buckets: the primary and the mirror, through which the
  # repository is verified (DIST_VERIFY_URL), which also holds the stored
  # builds. Endpoint and buckets are variables, not secrets: neither is
  # confidential, and a masked bucket name turns every rclone log line into
  # asterisks.
  DIST_S3_ENDPOINT:   ${{ vars.DIST_S3_ENDPOINT }}
  DIST_BUCKET:        ${{ vars.DIST_BUCKET }}
  DIST_MIRROR_BUCKET: ${{ vars.DIST_MIRROR_BUCKET }}
  # The published base. Baked into every operator's sources.list, so it is
  # permanent in a way nothing else here is (ARCH-20). The repository is
  # installed from DIST_VERIFY_URL, which serves the same packages.
  DIST_BASE_URL: ${{ vars.DIST_BASE_URL }}
  DIST_VERIFY_URL: ${{ vars.DIST_VERIFY_URL }}

jobs:
  # Everything a release must be before anything changes, then the number
  # reserved: the last step, so a run that fails here has changed nothing.
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    # About 2 minutes.
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write          # the tag that reserves the number
    outputs:
      sha: ${{ steps.rc.outputs.sha }}
      number: ${{ steps.n.outputs.number }}
      build_id: ${{ steps.id.outputs.build_id }}
    steps:
      # Dispatched on a release-candidate tag only, and only in the repository
      # the RELEASE_REPO variable names; copies of it release nothing.
      - name: Refuse any other ref or repository
        env:
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
        run: |
          [ -n "$RELEASE_REPO" ] && [ "$REPO" = "$RELEASE_REPO" ] || {
            echo "::error::releases are made only in the repository the RELEASE_REPO variable names"; exit 1; }
          [[ "$REF" =~ ^refs/tags/release-[0-9]+-rc[0-9]+$ ]] || {
            echo "::error::release is dispatched on a release-candidate tag only (this run is on $REF). Use: gh workflow run release.yml --ref release-N-rcK"; exit 1; }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release-candidate, the tag this run is on, resolved to the commit it
      # names and the number it was built for. Refused unless the tag has a
      # published prerelease here: a release-candidate is the tag AND its files,
      # and a tag without them was never finished. Every later job takes the
      # commit from here; checkouts name it, not the tag, which the release
      # removes once it has published.
      - id: rc
        name: Resolve the release-candidate
        env:
          RC: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RC" =~ ^release-([0-9]+)-rc[0-9]+$ ]] || {
            echo "::error::'${RC}' is not a release-candidate tag (release-N-rcK)"; exit 1; }
          N="${BASH_REMATCH[1]}"
          git fetch --quiet --no-tags origin "+refs/tags/${RC}:refs/tags/${RC}" || {
            echo "::error::${RC} is not a tag in ${GITHUB_REPOSITORY}"; exit 1; }
          sha=$(git rev-parse "${RC}^{commit}")
          pre=$(gh release view "$RC" -R "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease 2>/dev/null) || {
            echo "::error::${RC} has no release in ${GITHUB_REPOSITORY}; its files were never published"; exit 1; }
          [ "$pre" = "true" ] || {
            echo "::error::the release ${RC} is not a prerelease"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "number=$N" >> "$GITHUB_OUTPUT"
          echo "${RC} is ${sha} (build ${sha:0:7}), for release-${N}"
          echo "### Releasing \`${RC}\` (\`${sha}\`) as release-${N}" >> "$GITHUB_STEP_SUMMARY"

      # Assert the credentials EXIST before anything else runs: every
      # credential is checked here, in seconds, before a number is reserved,
      # since a run that cannot publish should not burn a number.
      - name: Required credentials
        env:
          # Mapped in rather than read inline: a secret cannot be tested in an
          # `if:`, and mapping makes the required set one readable list.
          DIST_S3_ACCESS_KEY: ${{ secrets.DIST_S3_ACCESS_KEY }}
          DIST_S3_SECRET_KEY: ${{ secrets.DIST_S3_SECRET_KEY }}
          DIST_S3_MIRROR_ACCESS_KEY: ${{ secrets.DIST_S3_MIRROR_ACCESS_KEY }}
          DIST_S3_MIRROR_SECRET_KEY: ${{ secrets.DIST_S3_MIRROR_SECRET_KEY }}
          REPO_SIGNING_KEY:   ${{ secrets.REPO_SIGNING_KEY }}
          IMAGE_REPO_BUILD:   ${{ vars.IMAGE_REPO_BUILD }}
          IMAGE_REGISTRY_TOKEN_BUILD: ${{ secrets.IMAGE_REGISTRY_TOKEN_BUILD }}
          IMAGE_REGISTRY_TOKEN_EXTRA: ${{ secrets.IMAGE_REGISTRY_TOKEN_EXTRA }}
          TS_ENDPOINT:        ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT:         ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TS_PROFILE:         ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          AZ_TENANT:          ${{ secrets.AZURE_TENANT_ID }}
          AZ_CLIENT:          ${{ secrets.AZURE_CLIENT_ID }}
          AZ_SECRET:          ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -u
          missing=""
          for v in DIST_S3_ACCESS_KEY DIST_S3_SECRET_KEY DIST_S3_ENDPOINT \
                   DIST_BUCKET DIST_S3_MIRROR_ACCESS_KEY DIST_S3_MIRROR_SECRET_KEY \
                   DIST_MIRROR_BUCKET REPO_SIGNING_KEY DIST_BASE_URL DIST_VERIFY_URL \
                   IMAGE_REGISTRY_USER IMAGE_REPO_BUILD IMAGE_REGISTRY_TOKEN_BUILD; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || missing="$missing $v"
          done
          # The second image repository is optional; set, it needs its token.
          if [ -n "${EXTRA_IMAGE:-}" ] && [ -z "${IMAGE_REGISTRY_TOKEN_EXTRA:-}" ]; then
            missing="$missing IMAGE_REGISTRY_TOKEN_EXTRA"
          fi

          # Authenticode signing is OPTIONAL by design: without it
          # the release ships an unsigned installer and says so. But the six
          # values -- the three naming the signing profile and the three Azure
          # values proving the caller may use it -- are all-or-nothing, since
          # `SIGN` requires all six, so a PARTIAL set is the dangerous state: it
          # reads as configured and silently ships unsigned. Named separately
          # for that reason.
          # The ones missing are named by their secret names, never values:
          # a count says something is wrong, a name says what to set.
          ts_set=0
          ts_missing=""
          for v in TS_ENDPOINT:TRUSTED_SIGNING_ENDPOINT TS_ACCOUNT:TRUSTED_SIGNING_ACCOUNT \
                   TS_PROFILE:TRUSTED_SIGNING_PROFILE AZ_TENANT:AZURE_TENANT_ID \
                   AZ_CLIENT:AZURE_CLIENT_ID AZ_SECRET:AZURE_CLIENT_SECRET; do
            eval "val=\${${v%%:*}:-}"
            if [ -n "$val" ]; then ts_set=$((ts_set + 1)); else ts_missing="$ts_missing ${v#*:}"; fi
          done
          ts_missing="${ts_missing# }"

          {
            echo "### Release credentials"
            echo
            if [ -n "$missing" ]; then
              echo "**Missing (required):**"
              for m in $missing; do echo "- \`$m\`"; done
            else
              echo "All required credentials are present."
            fi
            echo
            case "$ts_set" in
              6) echo "Authenticode signing: configured." ;;
              0) echo "Authenticode signing: not configured — the installer ships unsigned, as designed." ;;
              *) echo "Authenticode signing: **PARTIALLY configured ($ts_set of 6; missing: $ts_missing)** — signing will be skipped and the installer will ship unsigned. Set all six or none." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ts_set" != 0 ] && [ "$ts_set" != 6 ]; then
            echo "::warning::Authenticode signing is partially configured ($ts_set of 6; missing: $ts_missing); the installer will ship unsigned."
          fi

          if [ -z "$missing" ]; then
            echo "all required release credentials present"
            exit 0
          fi
          echo "::error::missing release credentials:$missing"
          exit 1

      # The release closes the OC issues it shipped on openchime/openchime with
      # PUBLIC_TOKEN. A token that cannot is found out here, not as a warning
      # after the packages are live: an empty update of an issue changes nothing
      # and adds nothing to its timeline, but is refused without Issues write.
      - name: Public tracker
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_TOKEN }}
        run: |
          set -uo pipefail
          r=openchime/openchime
          if [ -n "$GH_TOKEN" ] && n=$(gh api "repos/${r}/issues?state=all&per_page=1" --jq '.[0].number' 2>&1) \
             && out=$(echo '{}' | gh api -X PATCH "repos/${r}/issues/${n}" --input - --jq .number 2>&1); then
            echo "PUBLIC_TOKEN can write issues on openchime/openchime"
            exit 0
          fi
          msg="PUBLIC_TOKEN cannot write issues on openchime/openchime: ${out:-${n:-not set}}"
          echo "::error::${msg}"
          exit 1

      # The repository is verified at DIST_VERIFY_URL, which is served from the
      # bucket outside this workflow. Nothing in this repository can make that
      # true -- so this REPORTS and never fails: the release is publishable
      # without it, only unreachable at the public URL, and one HEAD request
      # says so at the start rather than in the smoke.
      - name: Probe the published base URL
        run: |
          set -u
          if curl -fsI --max-time 20 "$DIST_VERIFY_URL/openchime-archive-keyring.gpg" >/dev/null 2>&1; then
            echo "verification URL serves: $DIST_VERIFY_URL"
            echo "Verification URL (\`$DIST_VERIFY_URL\`): serving." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$DIST_VERIFY_URL does not serve the archive keyring -- \
          the repositories will publish, and the smoke at the end of deploy will fail. \
          The release itself still completes."
            {
              echo
              echo "**Verification URL (\`$DIST_VERIFY_URL\`): NOT serving.**"
              echo
              echo "The repositories will publish and the release will complete;"
              echo "the smoke at the end of \`deploy\` will fail. The URL is served"
              echo "outside this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The release-candidate's build, fetched from the mirror bucket and
      # verified: the manifest's signature, every file's sha256, the commit it
      # records being the release-candidate's, the build id the binary itself
      # reports, and the image the manifest names being in the registry with the
      # digest it recorded. A release-candidate whose build is gone (pruned, or
      # never stored) is refused here, before any number is reserved. The image
      # is read from the build repository, where the build pushed it, with
      # IMAGE_REGISTRY_TOKEN_BUILD from the `release` environment.
      - name: Install tooling
        timeout-minutes: 5
        run: scripts/build/apt.sh rclone gnupg skopeo
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::REPO_SIGNING_KEY is not set; the candidate cannot be verified"; exit 1; }
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Configure rclone for the mirror bucket
        env:
          DIST_S3_MIRROR_ACCESS_KEY: ${{ secrets.DIST_S3_MIRROR_ACCESS_KEY }}
          DIST_S3_MIRROR_SECRET_KEY: ${{ secrets.DIST_S3_MIRROR_SECRET_KEY }}
        run: |
          set -euo pipefail
          for v in DIST_S3_ENDPOINT DIST_S3_MIRROR_ACCESS_KEY DIST_S3_MIRROR_SECRET_KEY DIST_MIRROR_BUCKET; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [dist-mirror]
          type = s3
          provider = Other
          access_key_id = ${DIST_S3_MIRROR_ACCESS_KEY}
          secret_access_key = ${DIST_S3_MIRROR_SECRET_KEY}
          endpoint = ${DIST_S3_ENDPOINT}
          region = ${DIST_S3_REGION}
          EOF
      # The build, verified as release-candidate.yml verified it before it
      # tagged it (scripts/release/verify_candidate.sh): the manifest's
      # signature and every file, the commit, the build id the daemon reports
      # and the image's digest.
      - id: id
        name: Fetch and verify the candidate
        env:
          SHA: ${{ steps.rc.outputs.sha }}
          IMAGE_REGISTRY_TOKEN_BUILD: ${{ secrets.IMAGE_REGISTRY_TOKEN_BUILD }}
        run: |
          set -euo pipefail
          id="${SHA:0:7}"
          scripts/release/verify_candidate.sh "$id" "$SHA" candidate
          echo "build_id=$id" >> "$GITHUB_OUTPUT"
      # The verified trees and binaries go on to deploy as one artifact, its
      # platforms in candidate/<platform>/; the manifest has done its work by
      # now and is not carried on. Kept one day: a failed release is finished
      # with Re-run failed jobs only while it lasts, since deploy downloads
      # it, and a re-run a day or more after the run fails there.
      - uses: actions/upload-artifact@v7
        with:
          name: candidate
          path: |
            candidate/linux-amd64
            candidate/linux-arm64
            candidate/windows-x64
          retention-days: 1
          if-no-files-found: error

      # The number is a label on the release-candidate's build id, and it is the
      # number the release-candidate was built for: release-N-rcK becomes
      # release-N and nothing else. Checked against this repository's tags, and
      # reserved last, before anything is packaged, so that a failure can never
      # duplicate a number: one before the apt index is written returns it
      # (`unreserve`), one after spends it. A release-candidate for a number
      # that has since been released is refused; make a new one. So is one that
      # would go back -- that does not descend from the last release's candidate
      # and the newest release-N -- and one the documentation promoted to main
      # does not apply on (scripts/release/main_next.sh), asked here before the
      # number is reserved, and again when main moves.
      #
      # Tags are pushed with the deploy key: a tag ruleset lets only the deploy
      # key create, move or delete a release-* tag.
      - name: Push with the deploy key
        env:
          KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::error::RELEASE_SSH_KEY is not set in the release environment"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/release_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
      - id: n
        name: Check the release number
        env:
          N: ${{ steps.rc.outputs.number }}
          SHA: ${{ steps.rc.outputs.sha }}
          BUILD_ID: ${{ steps.id.outputs.build_id }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          if git ls-remote --exit-code --tags origin "refs/tags/release-${N}" >/dev/null; then
            echo "::error::release-${N} already exists; this release-candidate's number is taken. Make a new release-candidate: gh workflow run release-candidate.yml --ref staging"
            exit 1
          fi
          next=$(scripts/release/version.sh next)
          [ "$next" = "$N" ] || {
            echo "::error::the release-candidate is for release-${N}, but the next release is ${next}"; exit 1; }
          # main takes the Release snapshot of the candidate: refused here,
          # before a number is reserved, when the candidate would go back or the
          # documentation promoted to main does not apply on it.
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          rc=0; scripts/release/main_next.sh release "$SHA" "$N" >/dev/null || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::main cannot take ${SHA:0:7} (above). Make a release-candidate of a newer staging commit"
            exit 1
          fi
          echo "number=$N" >> "$GITHUB_OUTPUT"
          echo "this release is $N (previous: $(scripts/release/version.sh current)), build ${BUILD_ID}"

      # Reserved now, as a tag, so a failure later never duplicates a number
      # (scripts/release/version.sh derives the next number from tags, and two
      # .debs sharing a version is the one thing apt cannot recover from);
      # `unreserve` returns it if nothing was published. The tag
      # goes on the release-candidate's commit, pushed with the deploy key: a
      # plain push, which is refused if release-N appeared in the meantime.
      - name: Reserve the release number
        env:
          N: ${{ steps.n.outputs.number }}
          SHA: ${{ steps.rc.outputs.sha }}
        run: |
          set -euo pipefail
          git tag -f "release-${N}" "$SHA"
          git push origin "refs/tags/release-${N}"
          echo "reserved release-${N} on ${SHA:0:7}"

  # The release, made: the candidate's tree packaged under N for each
  # architecture, the Windows installers built (and signed when configured),
  # main moved, then the repositories, the GitHub release and the images
  # published, and what was published verified. main moves before anything is
  # published, as it always has: a main that refuses the snapshot then
  # leaves nothing published, and `unreserve` returns the number.
  deploy:
    name: deploy
    needs: prepare
    runs-on: ubuntu-24.04
    # About 10 minutes.
    timeout-minutes: 20
    # The tag is pushed with the deploy key and the GitHub release made with
    # the job's token; the images are copied with the registry tokens of the
    # `release` environment.
    environment: release
    permissions:
      contents: write
    outputs:
      # Set the moment the apt index is in the bucket. From then on the number is
      # SPENT whether or not the rest of the job succeeds, and unreserve must not
      # hand it back -- see the note on that job.
      published: ${{ steps.apt.outputs.published }}
      # Set once everything is published; `finish` runs on it, whether or not
      # the smoke after it passes.
      released: ${{ steps.released.outputs.released }}
    env:
      VERSION: ${{ needs.prepare.outputs.number }}
      BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      OC_BUILD_ID: ${{ needs.prepare.outputs.build_id }}   # for the tarball's README
      SHA: ${{ needs.prepare.outputs.sha }}
      SIGN: ${{ secrets.TRUSTED_SIGNING_ENDPOINT != '' && secrets.TRUSTED_SIGNING_ACCOUNT != '' && secrets.TRUSTED_SIGNING_PROFILE != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: candidate
          path: candidate
      - name: Install the packaging and repository tooling
        timeout-minutes: 20
        run: |
          # `rpm` is not optional and not implied: createrepo-c pulls librpm's
          # shared libraries but not the rpm binary, and an Ubuntu runner has
          # neither rpm nor rpmsign preinstalled; the rpm packages and the rpm
          # repository step's `rpmsign --addsign` need it. nsis for the Windows
          # installer; skopeo to copy the images; podman for the smoke.
          scripts/build/apt.sh rpm nsis apt-utils createrepo-c rclone gnupg skopeo podman

      # --- The packages ---------------------------------------------------------------
      # The candidate's tree, packaged under the release number: the .deb, the
      # .rpm and the tarball from the one binary, by the scripts the
      # release-candidate's full suite checked them with (under a placeholder
      # version). Seconds, not the hour a build took. Built in pkg/<platform>/
      # beside the tree, and the packages alone taken into dist/<platform>/,
      # which is what the publishing steps below read.
      - name: Package amd64 and arm64
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            work="pkg/linux-${arch}"
            mkdir -p "$work" tree "dist/linux-${arch}"
            tar xzf "candidate/linux-${arch}/openchimed-build-${BUILD_ID}-linux-${arch}.tar.gz" -C tree
            cp -r "tree/openchimed-build-${BUILD_ID}-linux-${arch}/." "$work/"
            ls "$work"
            packaging/build-rpm.sh     "$VERSION" "$arch" "$work/openchimed" "$work" >/dev/null
            packaging/build-deb.sh     "$VERSION" "$arch" "$work/openchimed" "$work"
            packaging/build-tarball.sh "$VERSION" "$arch" "$work/openchimed" "$work"
            # Each package is named for ITS architecture: the publishing steps
            # pool both architectures' files under one prefix, and two named
            # alike would collide there.
            cp "$work"/*.deb "$work"/*.rpm "$work"/*.tar.gz "$work"/*.sha256 "dist/linux-${arch}/"
          done

      # --- The Windows installers ---------------------------------------------------
      # The Windows client, from the candidate's binaries: signed here, since only
      # a real release signs and the installer embeds the signed files, then
      # wrapped in the installer and the MSIX under the release number. On
      # Linux, like everything else: the binaries were cross-compiled there,
      # the installer is NSIS (makensis), the MSIX is makemsix, and signing is
      # jsign against Azure Trusted Signing (packaging/build-windows.sh,
      # scripts/release/sign_windows.sh). No Windows machine is in the release.
      - name: Take the candidate's binaries
        run: |
          set -euo pipefail
          mkdir -p build
          cp candidate/windows-x64/openchime.exe candidate/windows-x64/openchime-tui.exe candidate/windows-x64/openchime.debug build/
          ls -la build
      # makemsix is built from pinned source on first use (scripts/build/
      # makemsix.sh); kept by that script's hash, so a release restores it.
      - name: Restore makemsix
        uses: actions/cache@v6
        with:
          path: third_party/makemsix-*
          key: makemsix-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/makemsix.sh') }}

      # The installer embeds the binaries, so they are signed first.
      - name: Sign the binaries
        if: env.SIGN == 'true'
        env: &signing
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: scripts/release/sign_windows.sh build/openchime.exe build/openchime-tui.exe

      # The installer and the MSIX under the release number. The MSIX is left
      # unsigned on purpose: a Store submission is re-signed by Microsoft, and
      # signing it here with our own certificate would be discarded. A
      # sideloadable .msix is a different artifact and would need one.
      - name: Build the installer and the MSIX
        run: packaging/build-windows.sh "$VERSION" build dist/windows-x64

      - name: Sign the installer
        if: env.SIGN == 'true'
        env: *signing
        run: scripts/release/sign_windows.sh "dist/windows-x64/openchime-${VERSION}-windows-x64-setup.exe"

      - name: Note the missing signature
        if: env.SIGN != 'true'
        # Which of the six are set, as the preflight sees them: "unset" is only
        # true when none is, and a partial set is named, not miscounted.
        env:
          TS_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT:  ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TS_PROFILE:  ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          AZ_TENANT:   ${{ secrets.AZURE_TENANT_ID }}
          AZ_CLIENT:   ${{ secrets.AZURE_CLIENT_ID }}
          AZ_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          ts_set=0
          ts_missing=""
          for v in TS_ENDPOINT:TRUSTED_SIGNING_ENDPOINT TS_ACCOUNT:TRUSTED_SIGNING_ACCOUNT \
                   TS_PROFILE:TRUSTED_SIGNING_PROFILE AZ_TENANT:AZURE_TENANT_ID \
                   AZ_CLIENT:AZURE_CLIENT_ID AZ_SECRET:AZURE_CLIENT_SECRET; do
            eval "val=\${${v%%:*}:-}"
            if [ -n "$val" ]; then ts_set=$((ts_set + 1)); else ts_missing="$ts_missing ${v#*:}"; fi
          done
          ts_missing="${ts_missing# }"
          if [ "$ts_set" = 0 ]; then
            echo "::warning::Artifact Signing credentials are not set; the Windows installer and binaries in this release are UNSIGNED. Users will see a SmartScreen warning."
          else
            echo "::warning::Artifact Signing credentials are partially set (missing: $ts_missing); the Windows installer and binaries in this release are UNSIGNED. Users will see a SmartScreen warning."
          fi
          echo "### Windows artifacts are unsigned" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ts_set" = 0 ]; then
            echo "TRUSTED_SIGNING_ENDPOINT / _ACCOUNT / _PROFILE and AZURE_TENANT_ID / _CLIENT_ID / _CLIENT_SECRET are unset, so signing was skipped. Set all six to turn it back on; nothing else needs changing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Artifact Signing is partially set ($ts_set of 6; missing: $ts_missing), so signing was skipped. Set the missing ones to turn it back on; nothing else needs changing." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The GUI's DWARF, split out by the Makefile and referenced by a
      # .gnu_debuglink in the shipped .exe, published beside the installer.
      - name: Stage the GUI debug symbols beside the installer
        run: cp build/openchime.debug dist/windows-x64/openchime.debug

      # The installer, the MSIX and the symbols, kept one day as the
      # `windows-x64` artifact: the MSIX is not a release asset (below), and
      # this is where Partner Center's copy is taken from.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/windows-x64/*
          retention-days: 1
          if-no-files-found: error

      # --- main --------------------------------------------------------------------
      # main takes the release here, once the number is reserved and everything is
      # packaged, before anything is published: one commit, the Release N
      # snapshot (scripts/release/main_next.sh) -- the candidate's tree with the
      # documentation promoted since applied on top, its parent main as it is --
      # pushed with the repository's deploy key (RELEASE_SSH_KEY, in the `release`
      # environment), which main's ruleset lets through. A plain push, so main only
      # fast-forwards; a main that moved since refuses it, and a re-run builds the
      # snapshot again on the new main. release-N stays on the candidate. A
      # refusal publishes nothing (unreserve returns the number). A main whose last
      # release already is this candidate is left as it is.
      - name: Move main to the release
        env:
          N: ${{ needs.prepare.outputs.number }}
          KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::error::RELEASE_SSH_KEY is not set in the release environment"; exit 1; }
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          git fetch --tags --force --quiet
          old=$(git rev-parse origin/main)
          rc=0; new=$(scripts/release/main_next.sh release "$SHA" "$N" "$old") || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::main (${old:0:7}) cannot take ${SHA:0:7} (above); nothing is published"
            exit 1
          fi
          if [ "$new" = "$old" ]; then
            echo "main's last release already is ${SHA:0:7}"
            exit 0
          fi
          echo "main becomes ${new:0:7}:"
          git log -1 --format='%B' "$new"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/release_key -o IdentitiesOnly=yes" \
            git push "git@github.com:${GITHUB_REPOSITORY}.git" "${new}:refs/heads/main"
          echo "main moved from ${old:0:7} to ${new:0:7}"

      # --- Publish --------------------------------------------------------------------
      # Tags are pushed with the deploy key: a tag ruleset lets only the deploy
      # key create, move or delete a release-* tag.
      - name: Push with the deploy key
        env:
          KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::error::RELEASE_SSH_KEY is not set in the release environment"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/release_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Check the registry credentials
        env:
          BUILD_TOKEN: ${{ secrets.IMAGE_REGISTRY_TOKEN_BUILD }}
          EXTRA_TOKEN: ${{ secrets.IMAGE_REGISTRY_TOKEN_EXTRA }}
        run: |
          set -euo pipefail
          for v in BUILD_IMAGE IMAGE_REGISTRY_USER; do
            [ -n "${!v}" ] || { echo "::error::the image variables are not set ($v)"; exit 1; }
          done
          [ -n "$BUILD_TOKEN" ] || { echo "::error::IMAGE_REGISTRY_TOKEN_BUILD is not set in the release environment"; exit 1; }
          [ -z "$EXTRA_IMAGE" ] || [ -n "$EXTRA_TOKEN" ] || { echo "::error::IMAGE_REPO_EXTRA is set and IMAGE_REGISTRY_TOKEN_EXTRA is not, in the release environment"; exit 1; }

      # Hold the number BEFORE anything is written, not at the tagging step.
      #
      # `prepare` reserves the tag and `unreserve` deletes it when a run fails
      # having published nothing. Re-running only the failed jobs then skips
      # `prepare` -- it succeeded -- so this job can arrive with a number whose
      # tag is gone, and must learn so before apt and dnf are written.
      #
      # It is asked here, where every answer is still harmless. The
      # tag on this commit: held. The tag absent and the number still exactly
      # the next one: nobody took it, so reserve it again. Anything else -- the
      # tag on another commit, or a later release already tagged -- is a number
      # this run no longer owns, and it stops with nothing published.
      - name: Hold the release number
        run: |
          set -euo pipefail
          git tag -d "release-${VERSION}" >/dev/null 2>&1 || true
          git fetch --force --quiet origin 'refs/tags/release-*:refs/tags/release-*'
          if at=$(git rev-parse -q --verify "refs/tags/release-${VERSION}^{commit}"); then
            [ "$at" = "$SHA" ] || {
              echo "::error::release-${VERSION} is on ${at}, not this commit; refusing to publish"
              exit 1
            }
            echo "release-${VERSION} is held"
            exit 0
          fi
          next=$(scripts/release/version.sh next)
          [ "$next" = "$VERSION" ] || {
            echo "::error::release-${VERSION} is not reserved and the next number is ${next}; refusing to publish"
            exit 1
          }
          git tag -f "release-${VERSION}" "$SHA"
          git push origin "refs/tags/release-${VERSION}"
          echo "reserved release-${VERSION} again"

      # dist/ holds one directory per platform, the packages of each and the
      # Windows installer and symbols, and nothing else: no unpackaged
      # compiler output is within reach of the globs below.
      - name: Show what will be published
        run: find dist -type f | sort

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::REPO_SIGNING_KEY is not set"; exit 1; }
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')" >> "$GITHUB_ENV"

      - name: Configure rclone for object storage
        env:
          DIST_S3_ACCESS_KEY: ${{ secrets.DIST_S3_ACCESS_KEY }}
          DIST_S3_SECRET_KEY: ${{ secrets.DIST_S3_SECRET_KEY }}
          DIST_S3_MIRROR_ACCESS_KEY: ${{ secrets.DIST_S3_MIRROR_ACCESS_KEY }}
          DIST_S3_MIRROR_SECRET_KEY: ${{ secrets.DIST_S3_MIRROR_SECRET_KEY }}
        run: |
          set -euo pipefail
          for v in DIST_S3_ACCESS_KEY DIST_S3_SECRET_KEY DIST_S3_ENDPOINT DIST_BUCKET \
                   DIST_S3_MIRROR_ACCESS_KEY DIST_S3_MIRROR_SECRET_KEY DIST_MIRROR_BUCKET; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          mkdir -p ~/.config/rclone
          # provider = Other: the generic S3 path. region is required by the
          # S3 signature (DIST_S3_REGION, `auto` when unset).
          cat > ~/.config/rclone/rclone.conf <<EOF
          [dist]
          type = s3
          provider = Other
          access_key_id = ${DIST_S3_ACCESS_KEY}
          secret_access_key = ${DIST_S3_SECRET_KEY}
          endpoint = ${DIST_S3_ENDPOINT}
          region = ${DIST_S3_REGION}

          [dist-mirror]
          type = s3
          provider = Other
          access_key_id = ${DIST_S3_MIRROR_ACCESS_KEY}
          secret_access_key = ${DIST_S3_MIRROR_SECRET_KEY}
          endpoint = ${DIST_S3_ENDPOINT}
          region = ${DIST_S3_REGION}
          EOF

      # Both repositories are extended by this release's packages, and every
      # earlier release stays in the index: an index built from the new
      # packages alone would silently drop every previous release the moment
      # it was published. scripts/release/repo_update.sh fetches only the
      # indexes, never the pool, and refuses unless the old index names exactly
      # what the pool lists (the header of that script).
      #
      # Both are prepared, checked and signed before either is written, and
      # the mirror's pool is reconciled to the primary's first, so a
      # refusal anywhere here stops the release with nothing published.
      - name: Prepare the apt and rpm repositories
        id: prepare
        run: |
          set -euo pipefail
          # The tag guard's second witness: PRIOR releases -- this one's tag
          # is excluded, because `prepare` reserved it before anything was
          # built; counted, a first release would read as an index that would
          # delist history. `|| true` inside the braces: a FIRST release leaves
          # grep with no match, and pipefail with set -e would end the step.
          # release-N only: the release-candidates' release-N-rcK tags fetched
          # beside them name no package in the pool.
          PRIOR=$( { git tag -l 'release-*' | grep -E '^release-[0-9]+$' | grep -vx "release-${VERSION}" || true; } | wc -l )
          export PRIOR
          scripts/release/repo_update.sh prepare apt repo/apt \
            "dist:${DIST_BUCKET}/apt" "dist-mirror:${DIST_MIRROR_BUCKET}/apt" dist/linux-*/*.deb
          scripts/release/repo_update.sh prepare rpm repo/rpm \
            "dist:${DIST_BUCKET}/rpm" "dist-mirror:${DIST_MIRROR_BUCKET}/rpm" dist/linux-*/*.rpm
          # What each index lists once published, for the smoke's check.
          echo "apt=$(cat repo/apt/expect)" >> "$GITHUB_OUTPUT"
          echo "rpm=$(cat repo/rpm/expect)" >> "$GITHUB_OUTPUT"
          echo "apt $(cat repo/apt/mode): $(cat repo/apt/expect); rpm $(cat repo/rpm/mode): $(cat repo/rpm/expect)"

      # Packages first, the index after, its signed top last; `rclone copy`,
      # never sync, so nothing in the bucket is ever deleted.
      - name: Publish the apt repository
        id: apt
        run: |
          set -euo pipefail
          scripts/release/repo_update.sh upload apt repo/apt "dist:${DIST_BUCKET}/apt"
          # Past this line the number is spent: an apt client can see release N.
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Publish the rpm repository
        run: scripts/release/repo_update.sh upload rpm repo/rpm "dist:${DIST_BUCKET}/rpm"

      - name: Publish the public key and repo definitions
        run: |
          set -euo pipefail
          mkdir -p repo/meta
          gpg --export --armor "$GPG_KEY_ID" > repo/meta/openchime-archive-keyring.asc
          gpg --export "$GPG_KEY_ID"         > repo/meta/openchime-archive-keyring.gpg
          cat > repo/meta/openchime.repo <<EOF
          [openchime]
          name=OpenChime
          baseurl=${DIST_BASE_URL}/rpm
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=${DIST_BASE_URL}/openchime-archive-keyring.asc
          EOF
          rclone copy repo/meta "dist:${DIST_BUCKET}/" --fast-list

      # The same indexes and packages; prepare already made the mirror's pool
      # the primary's, so the index names nothing this bucket lacks.
      - name: Publish the same repositories to the mirror bucket
        run: |
          set -euo pipefail
          scripts/release/repo_update.sh upload apt repo/apt "dist-mirror:${DIST_MIRROR_BUCKET}/apt"
          scripts/release/repo_update.sh upload rpm repo/rpm "dist-mirror:${DIST_MIRROR_BUCKET}/rpm"
          rclone copy repo/meta "dist-mirror:${DIST_MIRROR_BUCKET}/" --fast-list

      - name: Tag the release and attach the tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag already exists: `prepare` reserved it before anything was
          # built, and the hold above kept it. Assert
          # rather than create, so a mismatch is loud instead of silently
          # tagging a second commit with the same number.
          git ls-remote --exit-code --tags origin "refs/tags/release-${VERSION}" >/dev/null || {
            echo "::error::release-${VERSION} was not reserved; refusing to publish"
            exit 1
          }
          # The .msix is deliberately NOT attached. It is unsigned, because the
          # Store re-signs on submission, so a downloaded copy will not install
          # -- it is a build artifact for Partner Center, not a release asset.
          #
          # openchime.debug IS attached. The Makefile splits the GUI's DWARF into
          # it and records a .gnu_debuglink in the shipped .exe, so without this
          # the link points at a file that exists nowhere downloadable and
          # scripts/release/crash_resolve.sh reports "built without -g?" for every released
          # build. Build artifacts expire; a crash report does not.
          # The note tells the truth about the installer's signing status, because
          # the person who meets SmartScreen is the one who needs to know.
          notes="Release ${VERSION} is build \`${BUILD_ID}\` (${SHA}), which is what \`openchimed --version\` and the Windows clients report. The daemon installs via apt and dnf (see README); the tarballs below are the offline install. The Windows client installer is attached."
          if [ "$SIGN" != true ]; then
            unsigned="**The Windows installer in this release is not code-signed.** Windows SmartScreen will warn that the publisher is unrecognised; the download is still the artifact this workflow built, and its checksum is in the release assets."
            notes="${notes}"$'\n\n'"${unsigned}"
          fi
          files=(dist/linux-*/*.tar.gz dist/linux-*/*.sha256 dist/windows-x64/*-setup.exe dist/windows-x64/openchime.debug)
          # A re-run finds the release an earlier attempt made, perhaps with only
          # some of its files: it is completed in place, never created twice.
          if gh release view "release-${VERSION}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "release-${VERSION}" -R "$GITHUB_REPOSITORY" --title "release-${VERSION}" --notes "$notes"
            gh release upload "release-${VERSION}" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            echo "release-${VERSION} existed; its notes and files are now this build's"
          else
            gh release create "release-${VERSION}" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "release-${VERSION}" --notes "$notes" "${files[@]}"
          fi

      # The build's image becomes the release's: `skopeo copy` copies the
      # manifest list :build-<id> from the build repository, where the build
      # pushed it, to :N, registry to registry, without pulling or rebuilding,
      # first in the build repository and then in the second one, when
      # IMAGE_REPO_EXTRA names one. --preserve-digests keeps every manifest
      # digest exactly, and --all
      # copies the whole manifest list, not just the host architecture. In each
      # repository each copy proves the build's digest from skopeo's own report
      # (scripts/release/copy_image.sh), and :latest is copied from the build by
      # digest only after :N is, so :latest never names an unverified image.
      # Then :rc, in the build repository alone: release-candidate.yml moves it
      # to each newest candidate, and the release moves it on to itself, so
      # what follows :rc never runs older than :latest.
      # Nothing reads back a tag just written: a registry does not always serve
      # a tag the moment its push finishes. Basic auth: IMAGE_REGISTRY_USER and
      # each one's token.
      - name: Tag the image as the release and move :latest
        env:
          BUILD_CREDS: ${{ vars.IMAGE_REGISTRY_USER }}:${{ secrets.IMAGE_REGISTRY_TOKEN_BUILD }}
          EXTRA_CREDS: ${{ vars.IMAGE_REGISTRY_USER }}:${{ secrets.IMAGE_REGISTRY_TOKEN_EXTRA }}
        run: |
          set -euo pipefail
          src="docker://${BUILD_IMAGE}:build-${BUILD_ID}"
          want=$(skopeo inspect --raw --creds "$BUILD_CREDS" "$src" | sha256sum | cut -d' ' -f1)
          release_image() {   # <image> <creds>
            local image="$1" creds="$2"
            scripts/release/copy_image.sh "$BUILD_CREDS" "${BUILD_IMAGE}@sha256:${want}" "$creds" "${image}:${VERSION}" >/dev/null
            scripts/release/copy_image.sh "$BUILD_CREDS" "${BUILD_IMAGE}@sha256:${want}" "$creds" "${image}:latest" >/dev/null
            echo "${image}: ${VERSION} and latest -> build-${BUILD_ID} (sha256:${want})"
          }
          release_image "$BUILD_IMAGE" "$BUILD_CREDS"
          if [ -n "$EXTRA_IMAGE" ]; then release_image "$EXTRA_IMAGE" "$EXTRA_CREDS"; fi
          scripts/release/copy_image.sh "$BUILD_CREDS" "${BUILD_IMAGE}@sha256:${want}" "$BUILD_CREDS" "${BUILD_IMAGE}:rc" >/dev/null
          echo "${BUILD_IMAGE}: rc -> build-${BUILD_ID} (sha256:${want})"

      - id: released
        name: Released
        run: echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Released \`${VERSION}\` (build \`${BUILD_ID}\`)"
            echo
            echo "| Channel | Where |"
            echo "|---|---|"
            echo "| apt | \`${DIST_BASE_URL}/apt stable main\` |"
            echo "| dnf | \`${DIST_BASE_URL}/rpm\` |"
            echo "| image | \`${BUILD_IMAGE}:${VERSION}\`${EXTRA_IMAGE:+, \`${EXTRA_IMAGE}:${VERSION}\`} |"
            echo "| tarball | attached to \`release-${VERSION}\` |"
            echo "| windows | installer attached to \`release-${VERSION}\`; \`.msix\` in the \`windows-x64\` artifact |"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- The smoke ------------------------------------------------------------------
      # Last, and only once everything is published: by now apt and dnf are
      # live, so a failure here reports and never truncates the release --
      # `finish` runs on `released`, whatever the smoke says. A red run saying
      # "released, and the public URL does not serve it" is true, actionable,
      # and leaves nothing to repair by hand. The release's verification of
      # what it published (scripts/release/smoke.sh, every check in
      # scripts/release/smoke/): the apt repository installs it, the dnf
      # repository installs it on rockylinux:9 (the oldest RHEL the glibc 2.34
      # floor exists to support), each index lists this release once more, and
      # the released image pulls and runs. Every check runs even when one
      # fails.
      - name: scripts/release/smoke.sh
        env:
          APT_EXPECT: ${{ steps.prepare.outputs.apt }}
          RPM_EXPECT: ${{ steps.prepare.outputs.rpm }}
          DIST_S3_ACCESS_KEY: ${{ secrets.DIST_S3_ACCESS_KEY }}
          DIST_S3_SECRET_KEY: ${{ secrets.DIST_S3_SECRET_KEY }}
          DIST_S3_MIRROR_ACCESS_KEY: ${{ secrets.DIST_S3_MIRROR_ACCESS_KEY }}
          DIST_S3_MIRROR_SECRET_KEY: ${{ secrets.DIST_S3_MIRROR_SECRET_KEY }}
          IMAGE_REGISTRY_TOKEN: ${{ secrets.IMAGE_REGISTRY_TOKEN_BUILD }}
        run: scripts/release/smoke.sh

  # After the release is out: each part reports a failure and never undoes the
  # release, and each runs whether or not the one before it succeeded.
  finish:
    name: finish
    needs: [prepare, deploy]
    # On everything having been published, whatever the smoke said.
    if: ${{ always() && needs.deploy.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    # About 5 minutes.
    timeout-minutes: 10
    # PUBLIC_TOKEN for the issues, the deploy keys for the tags and the copy.
    environment: release
    permissions:
      contents: write
      id-token: write          # the notes sign in to the control plane with it
    env:
      N: ${{ needs.prepare.outputs.number }}
      SHA: ${{ needs.prepare.outputs.sha }}
      BUILD_ID: ${{ needs.prepare.outputs.build_id }}
      PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      # Close the issues this release shipped. Here, not on merge: a merge lands on
      # staging, and merged is not shipped. The squash also carries no body, so a
      # `Closes` line never reaches main -- the commit SUBJECT names the issue instead
      # (pr-policy enforces it on the title the squash commits), and scripts/release/close_shipped_issues.sh reads the
      # subjects between the previous release-N and this one. It never fails: by now
      # the packages are live, and a failed close must not brand a good release failed.
      # An OC issue is on openchime/openchime, closed with PUBLIC_TOKEN (issues
      # write there).
      - name: Close the shipped issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_TOKEN }}
        run: |
          git fetch --tags --force --quiet || true
          [ -n "$GH_TOKEN" ] || { echo "::warning::PUBLIC_TOKEN is not set in the release environment; closed nothing"; exit 0; }
          scripts/release/close_shipped_issues.sh "release-${N}"

      # Send the control plane what this release shipped, for its release notes:
      # the issues just closed, each as filed (scripts/release/send_notes.sh).
      # It signs in with the job's GitHub OIDC token, so no secret is shared, at the
      # address the CONTROL_PLANE_URL repository variable names. Like the close it
      # never fails: by now the packages are live.
      - name: Send the release notes
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_TOKEN }}
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
        run: |
          git fetch --tags --force --quiet || true
          [ -n "$GH_TOKEN" ] || { echo "::warning::PUBLIC_TOKEN is not set in the release environment; the release's notes were not sent"; exit 0; }
          scripts/release/send_notes.sh "$N" "$BUILD_ID"

      # The release-candidates for this number, done with: once release-N is
      # published, every release-N-rcK prerelease and its tag is deleted, the one
      # released included -- release-N carries the same files on the same commit.
      # A tag with no release left (a publish that stopped half way) is deleted on
      # its own. Never fails the release: by now it has shipped, and a
      # release-candidate left behind is only clutter. Tags are pushed with the
      # deploy key: a tag ruleset lets only the deploy key create, move or
      # delete a release-* tag.
      - id: rc-key
        name: Push with the deploy key
        if: ${{ !cancelled() }}
        env:
          KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::error::RELEASE_SSH_KEY is not set in the release environment"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/release_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
      - name: Remove the release-candidates
        if: ${{ !cancelled() && steps.rc-key.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tags=$(git ls-remote --tags --refs origin "release-${N}-rc*" \
                 | sed 's|.*refs/tags/||' | grep -E "^release-${N}-rc[0-9]+$" || true)
          [ -n "$tags" ] || { echo "no release-candidates for release-${N}"; exit 0; }
          # The release with the job's token, the tag with the deploy key: the
          # tag ruleset lets only the deploy key delete a release-* tag.
          for t in $tags; do
            gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes || echo "${t} had no release"
            if git push origin ":refs/tags/${t}"; then
              echo "removed ${t}"
            else
              echo "::warning::could not remove the tag ${t}"
            fi
          done
          exit 0

      # --- The copy to the public repository ------------------------------------------
      # The release, copied to the public repository (the PUBLIC_REPO variable;
      # skipped when it is unset): main here to its main (its
      # Release N snapshot, as a fast-forward), the commit to its staging, the
      # release-N tag, and a release with the same files, title and
      # notes as release-N here; then its release-candidates of N are deleted
      # there too. A copy and nothing more: nothing reads it back, so a failure is
      # a warning, never a failed run (continue-on-error on each step, each
      # step only after the one before it succeeded). It reads nothing from
      # that repository but whether a ref, the tag or a release is already
      # there, so a re-run completes it. Pushes are plain, never forced: a main
      # there that is not an ancestor of main here is reported, not overwritten. Pushes use
      # PUBLIC_DEPLOY_KEY, a write deploy key there; releases are
      # made and deleted with PUBLIC_TOKEN (contents and issues write there; the
      # issues for the close above). Both are in the `release` environment.
      # Last of all.
      - id: pub-key
        name: Set up the public deploy key
        if: ${{ !cancelled() && env.PUBLIC_REPO != '' }}
        continue-on-error: true
        env:
          KEY: ${{ secrets.PUBLIC_DEPLOY_KEY }}
          TOKEN: ${{ secrets.PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::warning::PUBLIC_DEPLOY_KEY is not set in the release environment; nothing copied to ${PUBLIC_REPO}"; exit 1; }
          [ -n "$TOKEN" ] || { echo "::warning::PUBLIC_TOKEN is not set in the release environment; nothing copied to ${PUBLIC_REPO}"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/public_key
          chmod 600 ~/.ssh/public_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/public_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      # staging there already holds this commit, or a later one, when the
      # release-candidates after it were copied: a refused push is then only
      # reported, once ls-remote shows staging there contains the commit.
      - id: pub-push
        name: Push the commit to staging, and the tag, there
        if: ${{ !cancelled() && steps.pub-key.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          remote="git@github.com:${PUBLIC_REPO}.git"
          if ! git push "$remote" "${SHA}:refs/heads/staging"; then
            there=$(git ls-remote "$remote" refs/heads/staging | cut -f1)
            if [ -n "$there" ] && git merge-base --is-ancestor "$SHA" "$there" 2>/dev/null; then
              echo "staging on ${PUBLIC_REPO} already contains ${SHA:0:7}"
            else
              echo "::warning::could not push ${SHA:0:7} to staging on ${PUBLIC_REPO}"; exit 1
            fi
          fi
          if git ls-remote --exit-code --tags "$remote" "refs/tags/release-${N}" >/dev/null; then
            echo "release-${N} is already there"
          else
            git fetch --force --quiet origin "refs/tags/release-${N}:refs/tags/release-${N}"
            git push "$remote" "refs/tags/release-${N}" || {
              echo "::warning::could not push release-${N} to ${PUBLIC_REPO}"; exit 1; }
          fi
          echo "${PUBLIC_REPO}: staging has ${SHA:0:7}, release-${N} is ${SHA:0:7}"

      - id: pub-release
        name: Copy the release
        if: ${{ !cancelled() && steps.pub-push.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          # The files, title and notes of release-N here, exactly.
          gh release download "release-${N}" -R "$GITHUB_REPOSITORY" -D files
          gh release view "release-${N}" -R "$GITHUB_REPOSITORY" --json name --jq .name > title.txt
          gh release view "release-${N}" -R "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          ls -l files
          # One an earlier attempt left part way is completed in place: every
          # file is uploaded again, replacing what is there.
          if GH_TOKEN="$PUBLIC_TOKEN" gh release view "release-${N}" -R "$PUBLIC_REPO" >/dev/null 2>&1; then
            GH_TOKEN="$PUBLIC_TOKEN" gh release upload "release-${N}" -R "$PUBLIC_REPO" --clobber files/* || {
              echo "::warning::could not complete release-${N} on ${PUBLIC_REPO}"; exit 1; }
            echo "release-${N} was on ${PUBLIC_REPO}; its files are now complete"
            exit 0
          fi
          GH_TOKEN="$PUBLIC_TOKEN" gh release create "release-${N}" -R "$PUBLIC_REPO" --verify-tag \
            --title "$(cat title.txt)" --notes-file notes.md files/* || {
            echo "::warning::could not publish release-${N} on ${PUBLIC_REPO}"; exit 1; }
          echo "release-${N} published on ${PUBLIC_REPO}"

      - id: pub-rcs
        name: Remove the release-candidates there
        if: ${{ !cancelled() && steps.pub-release.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_TOKEN }}
        run: |
          set -uo pipefail
          tags=$(git ls-remote --tags --refs "git@github.com:${PUBLIC_REPO}.git" "release-${N}-rc*" \
                 | sed 's|.*refs/tags/||' | grep -E "^release-${N}-rc[0-9]+$" || true)
          [ -n "$tags" ] || { echo "no release-candidates for release-${N} on ${PUBLIC_REPO}"; exit 0; }
          bad=0
          for t in $tags; do
            if gh release delete "$t" -R "$PUBLIC_REPO" --cleanup-tag --yes; then
              echo "removed ${t} on ${PUBLIC_REPO}"
            elif git push "git@github.com:${PUBLIC_REPO}.git" ":refs/tags/${t}"; then
              echo "removed the tag ${t} on ${PUBLIC_REPO} (it had no release)"
            else
              echo "::warning::could not remove ${t} on ${PUBLIC_REPO}"; bad=1
            fi
          done
          exit "$bad"

      # Last: main there becomes main here, exactly, as a fast-forward (created
      # if there is none), so a copy that failed before catches up. A main
      # there that is not an ancestor of main here is never overwritten; it is
      # reported as an error, to put right by hand, after everything else here
      # has been copied; it runs even when a step of the copy before it failed.
      - id: pub-main
        name: Copy main
        if: ${{ !cancelled() && env.PUBLIC_REPO != '' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          remote="git@github.com:${PUBLIC_REPO}.git"
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          now=$(git rev-parse origin/main)
          there=$(git ls-remote "$remote" refs/heads/main | cut -f1)
          if [ "$there" = "$now" ]; then echo "${PUBLIC_REPO}: main already is ${now:0:7}"; exit 0; fi
          if [ -n "$there" ]; then
            git fetch --quiet "$remote" "+refs/heads/main:refs/remotes/public/main"
            git merge-base --is-ancestor "$there" "$now" || {
              echo "::error::main on ${PUBLIC_REPO} (${there:0:7}) is not an ancestor of main here (${now:0:7}); not copied. Put it right by hand"; exit 1; }
          fi
          git push "$remote" "${now}:refs/heads/main" || {
            echo "::warning::could not move main on ${PUBLIC_REPO} to ${now:0:7}"; exit 1; }
          echo "${PUBLIC_REPO}: main is ${now:0:7}"

      - name: Report a failed copy
        if: ${{ !cancelled() && (steps.pub-key.outcome == 'failure' || steps.pub-push.outcome == 'failure' || steps.pub-release.outcome == 'failure' || steps.pub-rcs.outcome == 'failure' || steps.pub-main.outcome == 'failure') }}
        run: echo "::warning::the copy to ${PUBLIC_REPO} did not complete; release-${N} is published here regardless. Re-run this job to finish it."

  # Only when something failed and nothing was published: once the apt index
  # is written the number is spent, and deleting its tag would leave a live
  # release no tag names. Skipped, and so never billed, on a run that
  # succeeded or failed in `prepare`, before the number was reserved (the
  # reservation is prepare's last step). A deploy that timed out or was
  # cancelled counts as a failure here, as it always did.
  unreserve:
    name: unreserve
    needs: [prepare, deploy]
    if: ${{ (failure() || cancelled()) && needs.prepare.result == 'success' && needs.deploy.outputs.published != 'true' }}
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 5
    permissions:
      contents: write          # deletes the tag
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      # Tags are pushed with the deploy key: a tag ruleset lets only the deploy
      # key create, move or delete a release-* tag.
      - name: Push with the deploy key
        env:
          KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::error::RELEASE_SSH_KEY is not set in the release environment"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/release_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
      - env:
          N: ${{ needs.prepare.outputs.number }}
        run: |
          set -euo pipefail
          git push origin ":refs/tags/release-${N}" || true
          echo "::warning::release ${N} did not publish; the number has been returned"
