name: test-all

# The full suite's code tests (docs/TESTING.md), in two jobs on two machines at
# once: `make build-all` and `make test-all` with PART=plain and PART=threads.
# Called by release-candidate.yml, once per release-candidate, on the staging
# tip it is cutting, before it builds anything a release ships; nothing else
# runs it. Each job runs the targets a person could read and run the same way;
# every test is a script in scripts/test/. Every vendored library and toolchain
# is fetched pinned, or built from the committed sources, by the script that
# builds it (mk/toolchains.mk) and cached by that script's hash. One runner
# image everywhere, ubuntu-24.04, the same one the release builds on.
#
# The end-to-end test (scripts/test/full/e2e.sh) and the web client's checks
# run the daemon in development mode, so these jobs live here and not in a
# release-path workflow, which scripts/test/fast/release_lint.sh keeps free of
# it. The rest of the full suite -- the checks on the packages, the images and
# the Windows installers -- runs in release-candidate.yml on the artifacts it
# builds.

on:
  # Called, never triggered: the release-candidate gates on these exact jobs.
  workflow_call:

# No concurrency group of its own: a called workflow's group would be evaluated
# with the caller's workflow and ref, so two release-candidate runs of
# different commits would cancel each other's tests. The caller groups its runs.

# Least privilege: the jobs read the tree and nothing else. A workflow calling
# this one must grant at least that much, or GitHub refuses to start the call.
permissions:
  contents: read

env:
  # Every bash step, and every script it runs, retries what fails in a call to
  # GitHub's network and gives up on a dead connection (.github/net-retry.bash).
  BASH_ENV: ${{ github.workspace }}/.github/net-retry.bash

jobs:
  plain:
    name: full suite (plain)
    runs-on: ubuntu-24.04
    timeout-minutes: 120   # a cold cache builds the vendored libraries: ~44 min
    steps:
      # Every CPU the runner has, for every make below and the makes they
      # start (the Makefile is safe under -j; locally nothing changes).
      - name: Use every CPU for make
        run: echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Install build deps
        timeout-minutes: 20
        run: |
          # scripts/build/apt.sh: the mirror rewritten, each apt-get bounded
          # and retried, so a stall fails the step instead of holding the job.
          # bzip2 for the vendored mbedTLS tarball that `make` builds via
          # scripts/build/mbedtls.sh; nasm for libvpx's assembly
          # (scripts/build/libvpx.sh); xz-utils for the toolchain tarballs. gdb
          # so that a test binary that crashes prints every thread's stack
          # (tests/main.c). cmake, curl, git and python3 are on the image.
          # libclang-rt-18-dev for libFuzzer and the sanitizer runtimes of the
          # image's clang 18, which the fuzzing harnesses build with
          # (scripts/test/full/fuzz.sh). ffmpeg only for ffprobe, which the
          # media suite runs over a recorded file as an independent validator
          # -- nothing links it; without it the check is a SKIP, a failure here.
          scripts/build/apt.sh bzip2 nasm gdb xz-utils libclang-rt-18-dev ffmpeg
      # The toolchains make fetches pinned (mk/toolchains.mk): zig for the
      # release-compiler pass, Emscripten for the web client the daemon embeds.
      # Keyed by the scripts, which pin the versions and the checksums.
      - name: Restore the toolchains
        uses: actions/cache@v6
        with:
          path: |
            third_party/zig-0.17.1
            third_party/emsdk-6.0.13
          key: toolchains-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/zig.sh', 'scripts/build/emsdk.sh') }}
      # Read-aloud's engine and model (ARCH-111): ONNX Runtime built minimal and
      # static from source (about 20 minutes), the converted voice model, and
      # voice input's recognizer files (ARCH-112). All are pure functions of the
      # files in the key, so a hit skips the build and a change to any of them
      # rebuilds. The timeout allows for a miss.
      - name: Restore the speech engine and models
        uses: actions/cache@v6
        with:
          path: |
            third_party/onnxruntime-1.30.0
            build/kitten
            build/moonshine
          key: tts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/onnxruntime.sh', 'daemon/ort.ops.config', 'scripts/build/kitten.sh', 'scripts/build/tts_convert.c', 'scripts/build/moonshine.sh') }}
      # The vendored native libraries: each script builds only what is missing,
      # so a hit skips the download and the build. Keyed by the scripts, which pin
      # the versions and checksums, and by the compiler that builds them.
      - name: Restore the vendored libraries
        uses: actions/cache@v6
        with:
          path: |
            third_party/mbedtls-3.6.2
            third_party/libvpx-1.17.0
            third_party/opus-1.6.1
            third_party/speexdsp-1.2.1
            third_party/llamacpp-0.5.0
          key: vendor-${{ runner.os }}-24.04-${{ runner.arch }}-gcc-${{ hashFiles('scripts/build/mbedtls.sh', 'scripts/build/libvpx.sh', 'scripts/build/opus.sh', 'scripts/build/speexdsp.sh', 'scripts/build/llamacpp.sh') }}
      # The web client's libraries (docs/WEB.md): the release daemon carries the
      # client (WEB=1), so this job builds it too. Built once by their scripts
      # and cached, keyed by the scripts and the pinned Emscripten.
      - name: Restore the wasm libraries
        uses: actions/cache@v6
        with:
          path: |
            build/wasm/mbedtls
            build/wasm/sdl3
            build/wasm/libvpx
            build/wasm/opus
            build/wasm/speexdsp
          key: wasm-emsdk6.0.13-${{ hashFiles('scripts/build/mbedtls_wasm.sh', 'scripts/build/sdl3_wasm.sh', 'scripts/build/media_wasm.sh', 'scripts/build/libvpx.sh', 'scripts/build/opus.sh', 'scripts/build/speexdsp.sh') }}
      # The full suite but the sanitizer's half (mk/full.mk, PART=plain): the
      # daemon with every feature and the web client in it, the Linux TUI, the
      # e2e client and the fuzzing harnesses; then the source checks,
      # actionlint, every suite plainly with its timing verdicts judged, the
      # static-link check, the end-to-end run, the release's compiler, the
      # speech round trip, the web client in a headless Chrome and the GUI
      # smoke on the web, and the fuzzing pass. The runner's own Chrome,
      # driven by playwright-core at the version package.json pins.
      - name: Install the browser driver
        run: npm install --no-audit --no-fund
      - name: make build-all PART=plain
        timeout-minutes: 60
        run: make build-all PART=plain
      - name: make test-all PART=plain
        timeout-minutes: 45
        env:
          CHROME: /usr/bin/google-chrome
        run: make test-all PART=plain

  threads:
    name: full suite (thread sanitizer)
    # The daemon is threads -- the event loop, its I/O threads, the writer, the
    # readers and the auth pool, the worker pools -- and so are the client, its
    # call engine and its recorder. PART=threads runs the suites whose code
    # runs threads (marked THREADS in tests/main.c) under ThreadSanitizer, and
    # a data race between our threads fails it (tests/tsan.supp). The plain
    # job runs the same suites as written.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Every CPU the runner has, for every make below and the makes they
      # start (the Makefile is safe under -j; locally nothing changes).
      - name: Use every CPU for make
        run: echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Install build deps
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # ffmpeg only for ffprobe, which the media suite runs over a recorded
          # file as an independent validator -- nothing links it. gdb so that a
          # crash prints every thread's stack (tests/main.c).
          scripts/build/apt.sh bzip2 nasm ffmpeg gdb
      # The vendored native libraries: each script builds only what is missing,
      # so a hit skips the download and the build. Keyed by the scripts, which pin
      # the versions and checksums, and by the compiler that builds them.
      - name: Restore the vendored libraries
        uses: actions/cache@v6
        with:
          path: |
            third_party/mbedtls-3.6.2
            third_party/libvpx-1.17.0
            third_party/opus-1.6.1
            third_party/speexdsp-1.2.1
          key: vendor-${{ runner.os }}-24.04-${{ runner.arch }}-gcc-${{ hashFiles('scripts/build/mbedtls.sh', 'scripts/build/libvpx.sh', 'scripts/build/opus.sh', 'scripts/build/speexdsp.sh') }}
      # The test binary needs no Emscripten: the web client's page is embedded
      # from source and its loader only into a daemon built with WEB=1.
      - name: make build-all PART=threads
        run: make build-all PART=threads
      - name: make test-all PART=threads
        run: make test-all PART=threads
