name: test-all

# The release-candidate's gate and the full suite's code tests
# (docs/details/TESTING.md), in one job on one machine: the gate first, then `make
# build-all` and `make test-all` with PART=plain, then with PART=threads, then
# with PART=linux-client for each architecture: the Linux client's .deb, .rpm
# and Flatpak, which build on Ubuntu 24.04 (ARCH-20) and so here, and reach
# `stage` as an artifact, as the web client does.
# Called by release-candidate.yml, once per release-candidate, on the staging
# tip it is cutting, before it builds anything a release ships; nothing else
# runs it. One job, because GitHub bills each job rounded up to a whole minute
# plus its set-up, and the parts share every tool and every cache: each is
# installed and restored once. The job runs the targets a person could read
# and run the same way; every test is a script in scripts/test/. Every
# vendored library and toolchain is fetched pinned, or built from the
# committed sources, by the script that builds it (mk/toolchains.mk) and
# cached by that script's hash, one cache per library. One runner image
# everywhere, ubuntu-24.04, the same one the release builds on.
#
# The end-to-end test (scripts/test/full/e2e.sh) runs the daemon in
# development mode, so this job lives here and not in a
# release-path workflow, which scripts/test/fast/release_lint.sh keeps free of
# it. The rest of the full suite -- the checks on the daemon's packages, the
# images and the Windows installers -- runs in release-candidate.yml on the artifacts it
# builds.

on:
  # Called, never triggered: the release-candidate gates on this exact job.
  workflow_call:
    outputs:
      build_id:
        description: The build id, the short commit
        value: ${{ jobs.test.outputs.build_id }}
      run_number:
        description: The run number the Windows file version carries
        value: ${{ jobs.test.outputs.run_number }}

# No concurrency group of its own: a called workflow's group would be evaluated
# with the caller's workflow and ref, so two release-candidate runs of
# different commits would cancel each other's tests. The caller groups its runs.

# Least privilege: the job reads the tree and nothing else. A workflow calling
# this one must grant at least that much, or GitHub refuses to start the call.
permissions:
  contents: read

env:
  # Every bash step, and every script it runs, retries what fails in a call to
  # GitHub's network and gives up on a dead connection (.github/net-retry.bash).
  BASH_ENV: ${{ github.workspace }}/.github/net-retry.bash

jobs:
  test:
    name: full suite
    runs-on: ubuntu-24.04
    # With both of the runner's CPUs compiling, a warm run took about 35
    # minutes and a cold cache, which builds the vendored libraries first,
    # longer. One file at a time, on one CPU, is allowed twice that, and the
    # Linux client's two architectures an hour more: each builds the client
    # twice, and a cold cache fetches the Freedesktop SDK first.
    timeout-minutes: 220
    outputs:
      build_id: ${{ steps.id.outputs.build_id }}
      run_number: ${{ steps.id.outputs.run_number }}
    steps:
      # --- The gate: seconds, before anything is built ----------------------
      # A release-candidate is staging's tip and nothing else: dispatched on
      # another ref, the SHA below would be a feature branch. And it is made
      # only in the repository the RELEASE_REPO variable names; a copy of this
      # repository without it makes none. A called workflow sees its caller's
      # ref, commit, run number and variables.
      - name: Refuse any other ref or repository
        timeout-minutes: 5
        env:
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
        run: |
          [ -n "$RELEASE_REPO" ] && [ "$REPO" = "$RELEASE_REPO" ] || {
            echo "::error::release-candidates are made only in the repository the RELEASE_REPO variable names"; exit 1; }
          [ "$REF" = "refs/heads/staging" ] || {
            echo "::error::a release-candidate is made from staging only (this run is on $REF). Use: gh workflow run release-candidate.yml --ref staging"; exit 1; }
      # The build id, and the run number the Windows file version carries (the
      # one numeric, growing field Windows compares). The run number is this
      # workflow's plus RUN_NUMBER_OFFSET, a repository variable (0 when
      # unset): run numbers count from 1 again when the workflow that builds is
      # renamed or moved, and the file version must keep growing past every
      # build already shipped.
      - id: id
        name: build id
        env:
          OFFSET: ${{ vars.RUN_NUMBER_OFFSET }}
        run: |
          set -euo pipefail
          offset="${OFFSET:-0}"
          grep -qE '^[0-9]+$' <<<"$offset" || {
            echo "::error::RUN_NUMBER_OFFSET is '${offset}', not a whole number"; exit 1; }
          run=$(( GITHUB_RUN_NUMBER + offset ))
          echo "build_id=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "run_number=${run}" >> "$GITHUB_OUTPUT"
          echo "build ${GITHUB_SHA:0:7} (${GITHUB_SHA}), run ${run} (${GITHUB_RUN_NUMBER} + ${offset})"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The commit: still staging's tip, not already released or a
      # release-candidate, and one main can take as its next release
      # (scripts/release/main_next.sh: it descends from the last release's
      # candidate and the newest release-N, and the documentation promoted to
      # main applies on it). Asked again by publish, inside the `release`
      # group, before the number is taken.
      - name: The commit is staging's tip, and main can take it
        timeout-minutes: 5
        run: |
          set -euo pipefail
          git fetch --quiet --tags --force origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/staging:refs/remotes/origin/staging"
          tip=$(git rev-parse origin/staging)
          [ "$tip" = "$GITHUB_SHA" ] || {
            echo "::error::${GITHUB_SHA:0:7} is not staging's tip (${tip:0:7}); dispatch again: gh workflow run release-candidate.yml --ref staging"; exit 1; }
          released=$(git tag --points-at "$GITHUB_SHA" | grep -E '^release-[0-9]+$' || true)
          [ -z "$released" ] || { echo "::error::${GITHUB_SHA:0:7} is already ${released}"; exit 1; }
          rcs=$(git tag --points-at "$GITHUB_SHA" | grep -E '^release-[0-9]+-rc[0-9]+$' || true)
          [ -z "$rcs" ] || { echo "::error::${GITHUB_SHA:0:7} is already $(echo $rcs)"; exit 1; }
          rc=0; scripts/release/main_next.sh release "$GITHUB_SHA" "$(scripts/release/version.sh next)" >/dev/null || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::main cannot take ${GITHUB_SHA:0:7} as its next release (above)"; exit 1; }
          # main holds snapshots, not staging's commits: what a release of this
          # commit brings starts at the last release's candidate
          # (scripts/release/main_next.sh base).
          base=$(scripts/release/main_next.sh base "$GITHUB_SHA")
          echo "MAIN=${base}" >> "$GITHUB_ENV"
          echo "${base:0:7}..${GITHUB_SHA:0:7}:"
          git log --format='  %h %s' "${base}..${GITHUB_SHA}"
      # The attribution scan refuses: a commit naming the banned pattern must
      # not be built, stored or released, and is removed from staging by hand
      # (CONTRIBUTING.md). Scanned as a push of <last release>..tip, since the
      # script judges only a push's or a pull request's commits.
      - name: Attribution scan
        env:
          EVENT: push
          AFTER: ${{ github.sha }}
          REF: ${{ github.ref }}
          BASE_REF: ""
        run: BEFORE="$MAIN" scripts/policy/attribution_scan.sh
      # The commit policy warns and never refuses: a squash's subject or body is
      # fixed only by rewriting staging, and a release-candidate refused for it
      # would refuse every later one too, since <last release>..tip still holds it.
      - name: Commit policy (warns)
        run: |
          set -uo pipefail
          if ! BEFORE="$MAIN" scripts/policy/commit_policy.sh 2>&1 | sed -u 's/^::error::/::warning::/'; then
            echo "::warning::the commits since the last release do not all meet the commit policy; reported, not enforced"
          fi

      # --- The tools and the caches, once for both parts ---------------------
      # No MAKEFLAGS: every build compiles one file at a time here as anywhere
      # (docs/details/TESTING.md, "One build at a time"), so the timeouts below are twice
      # what they were when the runner's two CPUs both compiled.
      - name: Install build deps
        timeout-minutes: 20
        run: |
          # scripts/build/apt.sh: the mirror rewritten, each apt-get bounded
          # and retried, so a stall fails the step instead of holding the job.
          # nasm for libvpx's assembly (scripts/build/libvpx.sh); xz-utils for
          # the toolchain tarballs. gdb
          # so that a test binary that crashes prints every thread's stack
          # (tests/main.c). cmake, curl, git and python3 are on the image.
          # libclang-rt-18-dev for libFuzzer and the sanitizer runtimes of the
          # image's clang 18, which the fuzzing harnesses build with
          # (scripts/test/full/fuzz.sh). ffmpeg only for ffprobe, which the
          # media suite runs over a recorded file as an independent validator
          # -- nothing links it; without it the check is a SKIP, a failure here.
          # The Linux GUI and its two test programs (mk/linux.mk, mk/tests.mk)
          # compile against system development packages: FreeType, HarfBuzz
          # and fontconfig for text, GLib's GIO for D-Bus, libsecret and
          # libpipewire. sdltext's test measures DejaVu Sans
          # (fonts-dejavu-core), and the GUI's runs on a session bus of its own
          # (dbus-run-session, in dbus), where its stream group starts a
          # PipeWire and a WirePlumber of its own (pipewire, wireplumber) to
          # capture a video source it publishes. SDL3 for Linux
          # (scripts/build/sdl3_linux.sh) is built with CMake and needs the
          # headers of both its video backends: X11 with the extensions it
          # uses, Wayland with xkbcommon, EGL and libdecor, and OpenGL.
          # The Linux client's packages (PART=linux-client, mk/full.mk) are
          # compiled as the release compiles, with gcc 12, and for arm64 with
          # Ubuntu's gcc 12 cross compiler (gcc-12-aarch64-linux-gnu,
          # g++-12-aarch64-linux-gnu, libc6-dev-arm64-cross: amd64 packages
          # that target arm64). No arm64 package comes from apt: the arm64
          # libraries are the pinned sysroots' (restored below). flatpak and
          # ostree fetch the Freedesktop SDK and assemble the Flatpak;
          # desktop-file-utils and appstream validate the desktop entry and
          # the metainfo; rpm builds and reads the .rpm. The source checks
          # PART=plain runs publish a release into a local apt, rpm and
          # Flatpak repository (scripts/test/fast/repo_update.sh,
          # flatpak_repo.sh): apt-utils for apt-ftparchive, rpm for rpmsign,
          # createrepo-c for the rpm index, and rclone, which comes pinned.
          # apt: nasm, gdb, libclang-rt-18-dev, ffmpeg, the -dev packages, the DejaVu fonts, pipewire, wireplumber, the arm64 cross compiler, flatpak, ostree, desktop-file-utils, appstream, rpm and createrepo-c are not on the runner image; dbus, cmake, gcc-12, g++-12 and apt-utils are named in case it lacks them
          scripts/build/apt.sh bzip2 nasm gdb xz-utils libclang-rt-18-dev ffmpeg \
            libfreetype-dev libharfbuzz-dev libfontconfig-dev libglib2.0-dev libsecret-1-dev libpipewire-0.3-dev \
            fonts-dejavu-core dbus pipewire wireplumber cmake \
            libx11-dev libxext-dev libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl-dev libgl-dev libdecor-0-dev \
            gcc-12 g++-12 gcc-12-aarch64-linux-gnu g++-12-aarch64-linux-gnu libc6-dev-arm64-cross \
            flatpak ostree desktop-file-utils appstream rpm createrepo-c apt-utils
          scripts/build/rclone.sh
      # Restored here and saved, each only when it missed, as soon as
      # `make build-all PART=plain` has built it: a cache saved at the end of
      # the job would be lost to any later failure, the sanitizer's included.
      #
      # The toolchain make fetches pinned (mk/toolchains.mk): Emscripten for
      # the web client the daemon embeds. Keyed by the script, which pins the
      # version and the checksum.
      - id: c-toolchains
        name: Restore the toolchains
        uses: actions/cache/restore@v6
        with:
          path: &toolchains-path |
            third_party/emsdk-6.0.13
          key: &toolchains-key toolchains-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/emsdk.sh') }}
      # The vendored native libraries, one cache each: each script builds only
      # what is missing, so a hit skips the download and the build. Each is
      # keyed by its version, its own script, which pins the version and the
      # checksum, and the compiler that builds it (the runner's gcc), so a
      # change to one script rebuilds that library alone. The host's mbedTLS
      # is the same build release-candidate.yml's `stage` restores for the
      # arm64 build's host daemon, under the same key.
      - id: c-mbedtls
        name: Restore mbedTLS
        uses: actions/cache/restore@v6
        with:
          path: &mbedtls-path third_party/mbedtls-3.6.7
          key: &mbedtls-key mbedtls-3.6.7-${{ runner.os }}-24.04-${{ runner.arch }}-gcc-${{ hashFiles('scripts/build/mbedtls.sh') }}
      - id: c-libvpx
        name: Restore libvpx
        uses: actions/cache/restore@v6
        with:
          path: &libvpx-path third_party/libvpx-1.17.0
          key: &libvpx-key libvpx-1.17.0-${{ runner.os }}-24.04-${{ runner.arch }}-gcc-${{ hashFiles('scripts/build/libvpx.sh') }}
      - id: c-opus
        name: Restore opus
        uses: actions/cache/restore@v6
        with:
          path: &opus-path third_party/opus-1.6.1
          key: &opus-key opus-1.6.1-${{ runner.os }}-24.04-${{ runner.arch }}-gcc-${{ hashFiles('scripts/build/opus.sh') }}
      - id: c-speexdsp
        name: Restore speexdsp
        uses: actions/cache/restore@v6
        with:
          path: &speexdsp-path third_party/speexdsp-1.2.1
          key: &speexdsp-key speexdsp-1.2.1-${{ runner.os }}-24.04-${{ runner.arch }}-gcc-${{ hashFiles('scripts/build/speexdsp.sh') }}
      # SDL3 for the Linux GUI, built natively from the committed tree
      # (scripts/build/sdl3_linux.sh), keyed as the native libraries are. Only
      # what the build installs is kept, the library and its headers, not
      # CMake's build tree beside them.
      - id: c-linux-sdl3
        name: Restore SDL3 for Linux
        uses: actions/cache/restore@v6
        with:
          path: &linux-sdl3-path |
            third_party/sdl3-3.4.14/lib
            third_party/sdl3-3.4.14/include
          key: &linux-sdl3-key linux-sdl3-3.4.14-${{ runner.os }}-24.04-${{ runner.arch }}-gcc-${{ hashFiles('scripts/build/sdl3_linux.sh') }}
      # The web client's libraries (docs/details/WEB.md): the release daemon carries the
      # client (WEB=1), so this job builds it too. One cache each, keyed by the
      # pinned Emscripten, the script that builds it for wasm and the native
      # script that pins its version; the same keys as release-candidate.yml's
      # `stage`, which builds the same libraries. scripts/build/media_wasm.sh
      # builds whichever of libvpx, opus and speexdsp is missing, alone.
      - id: c-wasm-mbedtls
        name: Restore mbedTLS for wasm
        uses: actions/cache/restore@v6
        with:
          path: &wasm-mbedtls-path build/wasm/mbedtls
          key: &wasm-mbedtls-key wasm-mbedtls-3.6.7-emsdk6.0.13-${{ hashFiles('scripts/build/mbedtls_wasm.sh', 'scripts/build/mbedtls.sh') }}
      - id: c-wasm-sdl3
        name: Restore SDL3 for wasm
        uses: actions/cache/restore@v6
        with:
          path: &wasm-sdl3-path build/wasm/sdl3
          key: &wasm-sdl3-key wasm-sdl3-3.4.14-emsdk6.0.13-${{ hashFiles('scripts/build/sdl3_wasm.sh') }}
      - id: c-wasm-libvpx
        name: Restore libvpx for wasm
        uses: actions/cache/restore@v6
        with:
          path: &wasm-libvpx-path build/wasm/libvpx
          key: &wasm-libvpx-key wasm-libvpx-1.17.0-emsdk6.0.13-${{ hashFiles('scripts/build/media_wasm.sh', 'scripts/build/libvpx.sh') }}
      - id: c-wasm-opus
        name: Restore opus for wasm
        uses: actions/cache/restore@v6
        with:
          path: &wasm-opus-path build/wasm/opus
          key: &wasm-opus-key wasm-opus-1.6.1-emsdk6.0.13-${{ hashFiles('scripts/build/media_wasm.sh', 'scripts/build/opus.sh') }}
      - id: c-wasm-speexdsp
        name: Restore speexdsp for wasm
        uses: actions/cache/restore@v6
        with:
          path: &wasm-speexdsp-path build/wasm/speexdsp
          key: &wasm-speexdsp-key wasm-speexdsp-1.2.1-emsdk6.0.13-${{ hashFiles('scripts/build/media_wasm.sh', 'scripts/build/speexdsp.sh') }}

      # --- PART=plain -----------------------------------------------------------
      # The full suite but the sanitizer's half (mk/full.mk, PART=plain): the
      # daemon with every feature and the web client in it, the Linux TUI and
      # GUI, the e2e client, the fuzzing harnesses, and sdltext's and the
      # Linux GUI's test programs; then the source checks, actionlint, the
      # suites that start no thread and media, plainly with their timing
      # verdicts judged, the static-link check, the end-to-end run, the speech
      # round trip, sdltext on FreeType, the Linux GUI's test program on a
      # session bus of its own, the web client's header dependencies, and the
      # fuzzing pass.
      # Built under the release's build id, so the web client built here is the
      # one stage packages (WEB_PREBUILT, mk/web.mk): it is built once.
      - name: make build-all PART=plain
        timeout-minutes: 120
        env:
          OC_BUILD_ID: ${{ steps.id.outputs.build_id }}
        run: make build-all PART=plain
      - name: Keep the web client for stage
        run: printf '%s\n' "${{ steps.id.outputs.build_id }}" > build/web/.build_id
      - uses: actions/upload-artifact@v7
        with:
          name: web-client
          path: build/web
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Save the toolchains
        if: steps.c-toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *toolchains-path
          key: *toolchains-key
      - name: Save mbedTLS
        if: steps.c-mbedtls.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *mbedtls-path
          key: *mbedtls-key
      - name: Save libvpx
        if: steps.c-libvpx.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *libvpx-path
          key: *libvpx-key
      - name: Save opus
        if: steps.c-opus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *opus-path
          key: *opus-key
      - name: Save speexdsp
        if: steps.c-speexdsp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *speexdsp-path
          key: *speexdsp-key
      - name: Save SDL3 for Linux
        if: steps.c-linux-sdl3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *linux-sdl3-path
          key: *linux-sdl3-key
      - name: Save mbedTLS for wasm
        if: steps.c-wasm-mbedtls.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *wasm-mbedtls-path
          key: *wasm-mbedtls-key
      - name: Save SDL3 for wasm
        if: steps.c-wasm-sdl3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *wasm-sdl3-path
          key: *wasm-sdl3-key
      - name: Save libvpx for wasm
        if: steps.c-wasm-libvpx.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *wasm-libvpx-path
          key: *wasm-libvpx-key
      - name: Save opus for wasm
        if: steps.c-wasm-opus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *wasm-opus-path
          key: *wasm-opus-key
      - name: Save speexdsp for wasm
        if: steps.c-wasm-speexdsp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *wasm-speexdsp-path
          key: *wasm-speexdsp-key
      - name: make test-all PART=plain
        timeout-minutes: 90
        run: make test-all PART=plain

      # --- PART=threads ---------------------------------------------------------
      # The daemon is threads -- the event loop, its I/O threads, the writer, the
      # readers and the auth pool, the worker pools -- and so are the client, its
      # call engine and its recorder. PART=threads runs the suites whose code
      # runs threads (marked THREADS or TIMED in tests/main.c) under
      # ThreadSanitizer, their one run in the full suite, and a data race
      # between our threads fails it (tests/tsan.supp). The test binary needs
      # no Emscripten, and links the vendored libraries the plain part built.
      - name: make build-all PART=threads
        timeout-minutes: 40
        run: make build-all PART=threads
      - name: make test-all PART=threads
        timeout-minutes: 60
        run: make test-all PART=threads

      # --- PART=linux-client ----------------------------------------------------
      # The Linux client's .deb, .rpm and Flatpak for each architecture
      # (mk/full.mk, PART=linux-client), built here rather than in `stage`:
      # they need Ubuntu 24.04's libraries, the client's floor (ARCH-20), and
      # this is the job on Ubuntu 24.04. arm64 is cross-compiled on this x86
      # runner with no emulation, against pinned sysroots, never against
      # arm64 packages installed on the machine; its binaries are read, not
      # run. Wrapped under the number a release of this build takes, as
      # `stage` wraps the daemon's packages, and under the build id, so the
      # client says the same build as the daemon; `stage` refuses them under
      # any other number.
      - id: number
        name: The release number
        timeout-minutes: 3
        run: |
          set -euo pipefail
          n=$(scripts/release/version.sh next)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "the Linux client is wrapped for release-${n}"
      # The pinned build inputs the part fetches, one cache each, keyed by the
      # file that pins them and the script that lays them out: the Freedesktop
      # SDK and runtime in the tree's own Flatpak installation, with the
      # sysroot over each architecture's SDK (scripts/build/freedesktop_sdk.sh;
      # one cache, since each sysroot is hard links into that installation,
      # which one archive keeps as links), and the Ubuntu 24.04 arm64 sysroot
      # with the packages it is unpacked from
      # (scripts/build/sysroot_ubuntu_arm64.sh). Restored here, where the part
      # starts, and saved once the arm64 build, the last to need them, has
      # run.
      - id: c-freedesktop
        name: Restore the Freedesktop SDK
        uses: actions/cache/restore@v6
        with:
          path: &freedesktop-path |
            third_party/flatpak-freedesktop-26.08
            third_party/freedesktop-sdk-26.08-x86_64
            third_party/freedesktop-sdk-26.08-aarch64
          key: &freedesktop-key freedesktop-sdk-26.08-${{ runner.os }}-${{ hashFiles('packaging/linux-client/freedesktop-runtime.conf', 'scripts/build/freedesktop_sdk.sh') }}
      - id: c-sysroot-arm64
        name: Restore the Ubuntu arm64 sysroot
        uses: actions/cache/restore@v6
        with:
          path: &sysroot-arm64-path |
            third_party/sysroot-ubuntu-24.04-arm64
            third_party/sysroot-ubuntu-24.04-arm64.debs
          key: &sysroot-arm64-key sysroot-ubuntu-24.04-arm64-${{ hashFiles('scripts/build/sysroot_ubuntu_arm64.list', 'scripts/build/sysroot_ubuntu_arm64.sh') }}
      # The vendored libraries the arm64 client links, cross-built with Ubuntu's
      # gcc 12 into third_party/<name>-aarch64 (mk/toolchains.mk), one cache
      # each, keyed as the native libraries are, by the version, the script
      # and the compiler; the .deb's build and the Flatpak's share them. And
      # SDL3 for each sysroot the part builds against
      # (third_party/sdl3-<version>-<sysroot>, scripts/build/sdl3_linux.sh),
      # keyed besides by the files that pin that sysroot, so a new sysroot
      # rebuilds the SDL3 over it; only the library and its headers are kept,
      # as for the native SDL3. Each is saved once the build that makes it has
      # run: the Flatpak's x86_64 SDL3 after the amd64 build, the rest after
      # the arm64 build.
      - id: c-mbedtls-arm64
        name: Restore mbedTLS for arm64
        uses: actions/cache/restore@v6
        with:
          path: &mbedtls-arm64-path third_party/mbedtls-3.6.7-aarch64
          key: &mbedtls-arm64-key mbedtls-3.6.7-arm64-${{ runner.os }}-24.04-gcc12-${{ hashFiles('scripts/build/mbedtls.sh') }}
      - id: c-libvpx-arm64
        name: Restore libvpx for arm64
        uses: actions/cache/restore@v6
        with:
          path: &libvpx-arm64-path third_party/libvpx-1.17.0-aarch64
          key: &libvpx-arm64-key libvpx-1.17.0-arm64-${{ runner.os }}-24.04-gcc12-${{ hashFiles('scripts/build/libvpx.sh') }}
      - id: c-opus-arm64
        name: Restore opus for arm64
        uses: actions/cache/restore@v6
        with:
          path: &opus-arm64-path third_party/opus-1.6.1-aarch64
          key: &opus-arm64-key opus-1.6.1-arm64-${{ runner.os }}-24.04-gcc12-${{ hashFiles('scripts/build/opus.sh') }}
      - id: c-speexdsp-arm64
        name: Restore speexdsp for arm64
        uses: actions/cache/restore@v6
        with:
          path: &speexdsp-arm64-path third_party/speexdsp-1.2.1-aarch64
          key: &speexdsp-arm64-key speexdsp-1.2.1-arm64-${{ runner.os }}-24.04-gcc12-${{ hashFiles('scripts/build/speexdsp.sh') }}
      - id: c-libjpeg-arm64
        name: Restore libjpeg-turbo for arm64
        uses: actions/cache/restore@v6
        with:
          path: &libjpeg-arm64-path third_party/libjpeg-turbo-3.2.1-aarch64
          key: &libjpeg-arm64-key libjpeg-turbo-3.2.1-arm64-${{ runner.os }}-24.04-gcc12-${{ hashFiles('scripts/build/libjpeg-turbo.sh') }}
      - id: c-libspng-arm64
        name: Restore libspng for arm64
        uses: actions/cache/restore@v6
        with:
          path: &libspng-arm64-path third_party/libspng-0.7.4-aarch64
          key: &libspng-arm64-key libspng-0.7.4-arm64-${{ runner.os }}-24.04-gcc12-${{ hashFiles('scripts/build/libspng.sh') }}
      - id: c-libwebp-arm64
        name: Restore libwebp for arm64
        uses: actions/cache/restore@v6
        with:
          path: &libwebp-arm64-path third_party/libwebp-1.6.0-aarch64
          key: &libwebp-arm64-key libwebp-1.6.0-arm64-${{ runner.os }}-24.04-gcc12-${{ hashFiles('scripts/build/libwebp.sh') }}
      - id: c-sdl3-ubuntu-arm64
        name: Restore SDL3 for the Ubuntu arm64 sysroot
        uses: actions/cache/restore@v6
        with:
          path: &sdl3-ubuntu-arm64-path |
            third_party/sdl3-3.4.14-sysroot-ubuntu-24.04-arm64/lib
            third_party/sdl3-3.4.14-sysroot-ubuntu-24.04-arm64/include
          key: &sdl3-ubuntu-arm64-key linux-sdl3-3.4.14-sysroot-ubuntu-24.04-arm64-${{ runner.os }}-24.04-gcc12-${{ hashFiles('scripts/build/sdl3_linux.sh', 'scripts/build/sysroot_ubuntu_arm64.list', 'scripts/build/sysroot_ubuntu_arm64.sh') }}
      - id: c-sdl3-freedesktop-x86_64
        name: Restore SDL3 for the Freedesktop SDK (x86_64)
        uses: actions/cache/restore@v6
        with:
          path: &sdl3-freedesktop-x86_64-path |
            third_party/sdl3-3.4.14-freedesktop-sdk-26.08-x86_64/lib
            third_party/sdl3-3.4.14-freedesktop-sdk-26.08-x86_64/include
          key: &sdl3-freedesktop-x86_64-key linux-sdl3-3.4.14-freedesktop-sdk-26.08-x86_64-${{ runner.os }}-24.04-gcc12-${{ hashFiles('scripts/build/sdl3_linux.sh', 'packaging/linux-client/freedesktop-runtime.conf', 'scripts/build/freedesktop_sdk.sh') }}
      - id: c-sdl3-freedesktop-aarch64
        name: Restore SDL3 for the Freedesktop SDK (aarch64)
        uses: actions/cache/restore@v6
        with:
          path: &sdl3-freedesktop-aarch64-path |
            third_party/sdl3-3.4.14-freedesktop-sdk-26.08-aarch64/lib
            third_party/sdl3-3.4.14-freedesktop-sdk-26.08-aarch64/include
          key: &sdl3-freedesktop-aarch64-key linux-sdl3-3.4.14-freedesktop-sdk-26.08-aarch64-${{ runner.os }}-24.04-gcc12-${{ hashFiles('scripts/build/sdl3_linux.sh', 'packaging/linux-client/freedesktop-runtime.conf', 'scripts/build/freedesktop_sdk.sh') }}
      - name: make build-all PART=linux-client (amd64)
        timeout-minutes: 45
        env:
          OC_BUILD_ID: ${{ steps.id.outputs.build_id }}
          VERSION: ${{ steps.number.outputs.n }}
        run: make build-all PART=linux-client ARCH=x86_64 DIST=dist/linux-amd64 PKG_VERSION="$VERSION"
      - name: Save SDL3 for the Freedesktop SDK (x86_64)
        if: steps.c-sdl3-freedesktop-x86_64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *sdl3-freedesktop-x86_64-path
          key: *sdl3-freedesktop-x86_64-key
      - name: make test-all PART=linux-client (amd64)
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.number.outputs.n }}
        run: make test-all PART=linux-client ARCH=x86_64 DIST=dist/linux-amd64 PKG_VERSION="$VERSION"
      - name: make build-all PART=linux-client (arm64)
        timeout-minutes: 45
        env:
          OC_BUILD_ID: ${{ steps.id.outputs.build_id }}
          VERSION: ${{ steps.number.outputs.n }}
        run: make build-all PART=linux-client ARCH=aarch64 DIST=dist/linux-arm64 PKG_VERSION="$VERSION"
      - name: Save the Freedesktop SDK
        if: steps.c-freedesktop.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *freedesktop-path
          key: *freedesktop-key
      - name: Save the Ubuntu arm64 sysroot
        if: steps.c-sysroot-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *sysroot-arm64-path
          key: *sysroot-arm64-key
      - name: Save mbedTLS for arm64
        if: steps.c-mbedtls-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *mbedtls-arm64-path
          key: *mbedtls-arm64-key
      - name: Save libvpx for arm64
        if: steps.c-libvpx-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *libvpx-arm64-path
          key: *libvpx-arm64-key
      - name: Save opus for arm64
        if: steps.c-opus-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *opus-arm64-path
          key: *opus-arm64-key
      - name: Save speexdsp for arm64
        if: steps.c-speexdsp-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *speexdsp-arm64-path
          key: *speexdsp-arm64-key
      - name: Save libjpeg-turbo for arm64
        if: steps.c-libjpeg-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *libjpeg-arm64-path
          key: *libjpeg-arm64-key
      - name: Save libspng for arm64
        if: steps.c-libspng-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *libspng-arm64-path
          key: *libspng-arm64-key
      - name: Save libwebp for arm64
        if: steps.c-libwebp-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *libwebp-arm64-path
          key: *libwebp-arm64-key
      - name: Save SDL3 for the Ubuntu arm64 sysroot
        if: steps.c-sdl3-ubuntu-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *sdl3-ubuntu-arm64-path
          key: *sdl3-ubuntu-arm64-key
      - name: Save SDL3 for the Freedesktop SDK (aarch64)
        if: steps.c-sdl3-freedesktop-aarch64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *sdl3-freedesktop-aarch64-path
          key: *sdl3-freedesktop-aarch64-key
      - name: make test-all PART=linux-client (arm64)
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.number.outputs.n }}
        run: make test-all PART=linux-client ARCH=aarch64 DIST=dist/linux-arm64 PKG_VERSION="$VERSION"
      # The client's packages, built and checked, for `stage` to store with
      # the build and sign into its manifest: the .deb, the .rpm and the
      # Flatpak bundle of each architecture, under linux-amd64/ and
      # linux-arm64/, and not the scratch repository the bundles were
      # exported from.
      - name: Keep the Linux client for stage
        run: ls -l dist/linux-*/openchime_*.deb dist/linux-*/openchime-*.rpm dist/linux-*/*.flatpak
      - uses: actions/upload-artifact@v7
        with:
          name: linux-client
          path: |
            dist/linux-*/openchime_*.deb
            dist/linux-*/openchime-*.rpm
            dist/linux-*/*.flatpak
          retention-days: 1
          if-no-files-found: error
