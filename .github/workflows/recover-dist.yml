# TEMPORARY. Delete this file once it has run successfully.
#
# Seeds the apt and rpm pools in object storage with release 1's packages, which
# are missing: the bucket has no apt prefix at all and everything under
# https://openchime.io/dist/ returns 404, while the release-1 tag and GitHub
# release both exist. Release 2 could not publish because the pool guard --
# correctly -- refused to write an index built from an empty pool while a prior
# release tag existed, which would have delisted release 1 for everyone on apt.
#
# The packages themselves were never lost: they are still Actions artifacts on
# the run that published release 1, which do not expire until 2026-11-09.
#
# This workflow ONLY uploads. It never deletes and never writes an index. After
# it runs, re-dispatch release.yml: publish regenerates both indexes from the
# full pool, so the result carries release 1 and release 2 together. The rpm
# signing step globs the whole pool, so the seeded packages get signed then.
name: recover-dist

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run id that published release 1'
        type: string
        default: '31494210607'
      confirm:
        description: 'Type RECOVER to proceed'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  recover:
    name: seed the pools from release 1
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DIST_S3_ACCESS_KEY: ${{ secrets.DIST_S3_ACCESS_KEY }}
      DIST_S3_SECRET_KEY: ${{ secrets.DIST_S3_SECRET_KEY }}
      DIST_S3_ENDPOINT: ${{ vars.DIST_S3_ENDPOINT }}
      DIST_BUCKET: ${{ vars.DIST_BUCKET }}
    steps:
      - name: Check the confirmation
        run: |
          set -euo pipefail
          [ "${{ inputs.confirm }}" = "RECOVER" ] || {
            echo "::error::confirm must be RECOVER"; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: rel1/linux-amd64
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: linux-arm64
          path: rel1/linux-arm64
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show what was recovered
        run: |
          set -euo pipefail
          find rel1 -type f | sort
          # Refuse to run against a source that does not carry what we need,
          # rather than uploading a partial pool.
          [ "$(find rel1 -name '*.deb' | wc -l)" -eq 2 ] || { echo "::error::expected 2 .deb"; exit 1; }
          [ "$(find rel1 -name '*.rpm' | wc -l)" -eq 2 ] || { echo "::error::expected 2 .rpm"; exit 1; }

      - name: Install rclone
        run: |
          set -euo pipefail
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rclone

      # Identical to the release's own rclone block, so this writes to exactly
      # the same place by exactly the same route.
      - name: Configure rclone for object storage
        run: |
          set -euo pipefail
          for v in DIST_S3_ACCESS_KEY DIST_S3_SECRET_KEY DIST_S3_ENDPOINT DIST_BUCKET; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [dist]
          type = s3
          provider = Other
          access_key_id = ${DIST_S3_ACCESS_KEY}
          secret_access_key = ${DIST_S3_SECRET_KEY}
          endpoint = ${DIST_S3_ENDPOINT}
          region = auto
          EOF

      - name: State of the bucket before
        run: rclone lsjson "dist:${DIST_BUCKET}" --recursive 2>/dev/null | head -c 2000 || echo "(empty or absent)"

      - name: Seed the pools
        run: |
          set -euo pipefail
          mkdir -p stage/apt/pool/main/o/openchimed stage/rpm
          cp rel1/linux-*/*.deb stage/apt/pool/main/o/openchimed/
          cp rel1/linux-*/*.rpm stage/rpm/
          # copy, never sync: sync would delete anything already there.
          rclone copy stage/apt "dist:${DIST_BUCKET}/apt" --fast-list -v
          rclone copy stage/rpm "dist:${DIST_BUCKET}/rpm" --fast-list -v

      - name: Verify
        run: |
          set -euo pipefail
          echo "--- apt pool ---"
          rclone ls "dist:${DIST_BUCKET}/apt/pool/main/o/openchimed"
          echo "--- rpm ---"
          rclone ls "dist:${DIST_BUCKET}/rpm"
          debs=$(rclone ls "dist:${DIST_BUCKET}/apt/pool/main/o/openchimed" | grep -c '\.deb$')
          rpms=$(rclone ls "dist:${DIST_BUCKET}/rpm" | grep -c '\.rpm$')
          echo "pool now holds ${debs} .deb and ${rpms} .rpm"
          [ "$debs" -ge 2 ] && [ "$rpms" -ge 2 ] || { echo "::error::pool did not take"; exit 1; }
          echo "Now re-dispatch release.yml; the guard will pass and the index will carry both releases."
