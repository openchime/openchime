# Commit policy for pushes to staging and main.
#
# pr-policy checks the pull request TITLE, which is what a squash commits.
# This checks the commits themselves, after the squash. Both are needed: the
# title check cannot see a Co-authored-by trailer, because GitHub adds it
# during the merge — and that trailer defeats an otherwise-empty squash body.
name: commit-policy

on:
  # main only: on a push to staging the same check is a step of ci
  # (scripts/release/commit_policy.sh), which has a job there already.
  push:
    branches: [main]

concurrency:
  group: commit-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: commit policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the commits this push introduced
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/release/commit_policy.sh
