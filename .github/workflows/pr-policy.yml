# Pull request policy, and the only thing that runs on a pull request: policy,
# not tests. The fast suite ran locally before the push (.githooks/pre-push),
# and the full suite runs once per release-candidate (docs/TESTING.md). The
# title becomes the commit subject once merged (squash-only merges, repo
# setting), so the title is checked here, beside the attribution scan and the
# tree's issue references, each by its one rule in scripts/policy/. The body
# must be empty; the description lives in the issue, not the PR.
name: pr-policy

on:
  pull_request:
    # 'edited' matters: the title is a checked artifact and the default type
    # list does not include it.
    types: [opened, synchronize, reopened, edited]
    # staging only: nothing takes a pull request into main.
    branches: [staging]

# No concurrency group: every run is seconds of work and stands alone, so each
# event's run is left to finish. A shared group cannot keep them all, whether it
# cancels or not: GitHub holds at most one run pending per group and cancels it
# when another is queued, and a cancelled run leaves a cancelled check on its
# commit beside the passing one, which keeps the pull request from merging.

env:
  # Every bash step, and every script it runs, retries what fails in a call to
  # GitHub's network and gives up on a dead connection (.github/net-retry.bash).
  BASH_ENV: ${{ github.workspace }}/.github/net-retry.bash

jobs:
  policy:
    name: pr policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A step of this job, so a banned reference fails `pr policy` itself, the
      # one required check. It used to post a check of its own, `guard`, through
      # the check-runs API, which files a check in the commit's first check
      # suite rather than its own run's: a commit's second run then had no
      # `guard` in its suite, and the pull request stayed blocked.
      - name: Attribution scan
        env:
          EVENT: pull_request
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          BEFORE: ""
          AFTER: ""
        run: scripts/policy/attribution_scan.sh
      # A pull request that changes only documentation skips the local test run
      # (.githooks/pre-push), so the tree's no-issue-numbers rule is checked
      # here over the pull request's tree, with the base branch's copy of
      # scripts/policy/refs.sh: nothing of the pull request's runs.
      - name: No issue numbers in the tree
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git worktree add -q "$RUNNER_TEMP/base" "origin/${BASE}"
          git worktree add -q "$RUNNER_TEMP/head" HEAD
          # A base from before the policy checks moved to scripts/policy/ has
          # its copy among the fast suite's old source checks.
          refs="$RUNNER_TEMP/base/scripts/policy/refs.sh"
          [ -f "$refs" ] || refs="$RUNNER_TEMP/base/scripts/test/local/refs.sh"
          cd "$RUNNER_TEMP/head" && sh "$refs"
      - name: Title and body
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, never inline: an expression is substituted as text
          # before bash parses the line, and a title is attacker-controlled.
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          NUMBER: ${{ github.event.pull_request.number }}
          # The tracker OC-N numbers, wherever this runs; the workflow token reads it.
          ISSUES_REPO: openchime/openchime
        run: |
          set -uo pipefail
          fail=0

          # The title by the one subject rule, measured as the squash will
          # commit it, with this pull request's number appended.
          scripts/policy/subject.sh "$TITLE" "$NUMBER" || fail=1

          if [ -n "${BODY//[$'\r\n\t ']/}" ]; then
            echo "::error::Pull request body must be empty. The description belongs in the issue."
            fail=1
          fi

          # The number must be an OPEN ISSUE on the tracker.
          # Issues and pull requests share one counter, so a format-only check
          # accepts a pull request number.
          P=$(printf '%s' "$TITLE" | sed -nE 's/^(OC)-[0-9]+:.*/\1/p')
          N=$(printf '%s' "$TITLE" | sed -nE 's/^OC-([0-9]+):.*/\1/p')
          REPO="$ISSUES_REPO"
          if [ -n "$N" ]; then
            if ! J=$(gh api "repos/${REPO}/issues/${N}" 2>/tmp/e); then
              grep -qF '(HTTP 404)' /tmp/e \
                && echo "::error::${P}-${N} is not an issue on ${REPO}." \
                || echo "::error::Could not check ${P}-${N}: $(head -1 /tmp/e)"
              fail=1
            elif [ "$(jq -r 'if .pull_request then "pr" else .state end' <<<"$J")" != open ]; then
              echo "::error::${P}-${N} is not an open issue on ${REPO}."
              fail=1
            fi
          fi

          [ "$fail" = 0 ] && echo "pr policy ok" || exit 1
