# TEMPORARY. Delete once it has run.
#
# The repositories were published into a bucket in the `personal` Fly
# organisation while everything else this project owns -- including the control
# plane that serves openchime.io/dist -- lives in `openchime`. This copies the
# tree into the bucket in the right organisation, once, so no release is lost
# and the apt pool guard has the history it checks for.
#
# It runs here because this is the only place both keypairs exist. Nothing is
# printed and nothing is deleted; the source is left exactly as it was.
name: migrate-dist-bucket

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      SRC_BUCKET: ${{ vars.DIST_BUCKET }}
      DST_BUCKET: openchime-dist-prod
      ENDPOINT: ${{ vars.DIST_S3_ENDPOINT }}
      SRC_KEY: ${{ secrets.DIST_S3_ACCESS_KEY }}
      SRC_SECRET: ${{ secrets.DIST_S3_SECRET_KEY }}
      DST_KEY: ${{ secrets.DIST_S3_ACCESS_KEY_NEW }}
      DST_SECRET: ${{ secrets.DIST_S3_SECRET_KEY_NEW }}
    steps:
      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Configure both remotes
        run: |
          set -euo pipefail
          for v in SRC_BUCKET DST_BUCKET ENDPOINT SRC_KEY SRC_SECRET DST_KEY DST_SECRET; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [src]
          type = s3
          provider = Other
          access_key_id = ${SRC_KEY}
          secret_access_key = ${SRC_SECRET}
          endpoint = ${ENDPOINT}
          region = auto

          [dst]
          type = s3
          provider = Other
          access_key_id = ${DST_KEY}
          secret_access_key = ${DST_SECRET}
          endpoint = ${ENDPOINT}
          region = auto
          EOF
      - name: Copy and verify
        run: |
          set -euo pipefail
          # Listed to a file: `rclone ls | head` dies of SIGPIPE under pipefail.
          rclone ls "src:${SRC_BUCKET}" > /tmp/src.txt
          echo "source objects: $(wc -l < /tmp/src.txt)"
          rclone copy "src:${SRC_BUCKET}" "dst:${DST_BUCKET}" \
            --transfers 4 --checkers 4 -v --stats 20s --stats-one-line \
            --contimeout 30s --timeout 120s --low-level-retries 3 --retries 2
          rclone check "src:${SRC_BUCKET}" "dst:${DST_BUCKET}" --one-way
          rclone ls "dst:${DST_BUCKET}" > /tmp/dst.txt
          echo "destination objects: $(wc -l < /tmp/dst.txt)"
