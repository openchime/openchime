name: ci

# Runs on every branch push (so the branch gate is real — see CONTRIBUTING.md)
# and on PRs targeting main. Four jobs:
#   - build:       native gcc build of the daemon, plus unit tests (make test),
#                  which include the headless client app-core test.
#   - integration: the deployed image end-to-end on the Docker Compose stack —
#                  health check plus the protocol vertical over TLS.
#   - core:        standalone compile check of the client app-core (ARCH-74).
#   - windows:     mingw cross-compile check of the Windows front-ends (TUI + the
#                  native Direct2D/DirectWrite GUI, ARCH-82). Build breaks only.
#
#   - gui-smoke:   scripts/gui_smoke.sh (91 behavioural assertions) on a
#                  SELF-HOSTED Windows+WSL runner. Opt-in, see below.
#
# The Win32 GUI's behaviour cannot run on GitHub's hosted runners: the daemon is
# epoll-based, so it is Linux-only, and a hosted Windows runner cannot host it (no
# Linux containers). The job below is therefore written for a self-hosted box with
# both halves — Windows for the client, WSL for the daemon — and is gated on a
# repository variable so it is SKIPPED rather than failing red until one exists
# (Settings > Variables > `GUI_SMOKE=1`). Writing it now rather than "when the
# runner exists" is deliberate: an unwritten job is one nobody will write, and the
# gap it covers already let three bugs reach the user (WIN-70, WIN-71, WIN-72).
# Until the runner is there, the smoke stays a pre-push gate run by hand — which
# docs/CLIENT.md states as a standing rule.
# Doc-only changes skip CI. See docs/TESTING.md for the full strategy.

on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'
  # Lets the release workflow gate on these exact jobs rather than re-implement
  # them. A release that ran a weaker suite than CI would be worse than no gate,
  # because it would look like one. Same arrangement the control-plane repo's
  # deploys use.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          # libsqlite3-dev for the daemon; bzip2 for the vendored mbedTLS
          # tarball that `make test` builds via scripts/build_mbedtls.sh.
          sudo apt-get install -y --no-install-recommends libsqlite3-dev bzip2
      - name: Build daemon
        run: make
      # Also a prerequisite of `make test`; named here so a duplicate opcode
      # fails as itself rather than inside the test step.
      - name: Check opcode uniqueness
        run: make check-opcodes
      - name: Run unit tests
        run: |
          if ls tests/*.c >/dev/null 2>&1; then
            make test
          else
            echo "no unit tests yet — skipping (see docs/TESTING.md §2)"
          fi

  integration:
    name: end-to-end (compose)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          # bzip2 for the vendored mbedTLS tarball that the e2e client builds.
          sudo apt-get install -y --no-install-recommends bzip2

      # The whole harness — healthz plus the protocol vertical over TLS — lives
      # in one script so it runs identically here and locally
      # (`make integration`). See docs/TESTING.md §3.
      - name: Run integration harness
        run: Scripts/test-integration.sh

      - name: Tear down
        if: always()
        run: COMPOSE_PROJECT_NAME=openchime docker compose down -v

  core:
    name: client app-core (compile check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The client app-core (ARCH-74) is frontend-agnostic C linking the shared
      # wire code; `make core` proves it compiles standalone. Its behaviour is
      # driven end-to-end by the headless test in the build job's `make test`
      # (tests/test_client_core.c). bzip2 for the vendored mbedTLS tarball.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bzip2
      - name: Compile the app-core
        run: make core

  windows:
    name: windows cross-compile (TUI + GUI)
    # 24.04, not 22.04: the older runner's mingw-w64 headers declare
    # IRawElementProviderSimple but not the fragment/text interfaces, so the UIA
    # provider (ARCH-99) compiled to its stub and CI proved nothing about the
    # code that actually ships.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # mingw-w64 for the cross-compile; bzip2 + curl for the vendored mbedTLS
      # tarball that build_mbedtls_windows.sh fetches and cross-builds.
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 bzip2 curl
      - name: Cross-build the vendored Windows mbedTLS
        run: scripts/build_mbedtls_windows.sh
      # Both Windows front-ends share the app-core + shared wire code; a clean
      # link proves the pure-C Win32 (incl. Direct2D/DirectWrite-from-C, ARCH-82)
      # builds under mingw.
      - name: Compile the Windows front-ends
        run: make windows-tui windows-gui

  gui-smoke:
    name: win32 gui smoke (self-hosted)
    # Skipped entirely unless the repository sets GUI_SMOKE=1 AND provides a
    # runner with these labels. A job that cannot run must not be red: a
    # permanently failing check is a check people learn to ignore.
    if: vars.GUI_SMOKE == '1'
    runs-on: [self-hosted, windows, wsl]
    steps:
      - uses: actions/checkout@v4
      # The runner is expected to have: mingw-w64 + gcc + libsqlite3-dev inside
      # WSL, and the WSL interop that scripts/gui_drive.sh uses to launch the
      # Windows exe (powershell.exe on PATH). gui_drive.sh's `launch` builds both
      # sides and restarts the daemon itself — the client and the daemon share a
      # wire (ARCH-61) and a mismatched pair reports only "connection lost".
      - name: Build both sides and run the smoke
        shell: bash
        run: |
          set -euo pipefail
          scripts/build_mbedtls.sh
          scripts/build_mbedtls_windows.sh
          make
          make windows-gui
          # --kill so the runner is not left holding a client between jobs.
          scripts/gui_smoke.sh --kill
      # The captures are the evidence when an assertion fails: a chrome invariant
      # is a boolean, but "why" is a picture.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-shots
          path: /mnt/c/Windows/Temp/octest/*.bmp
          if-no-files-found: ignore
