name: ci

# Runs on every branch push (so the branch gate is real — see CONTRIBUTING.md)
# and on PRs targeting main. Four jobs:
#   - build:       native gcc build of the daemon, plus unit tests (make test),
#                  which include the headless client app-core test.
#   - integration: the daemon end-to-end, run natively on the runner — health
#                  check plus the protocol vertical over TLS. This used to drive
#                  the deployed image on a Docker Compose stack; the project no
#                  longer uses Docker anywhere, in CI or locally, so the same two
#                  assertions run against the binary the job builds.
#   - core:        standalone compile check of the client app-core (ARCH-74).
#   - windows:     mingw cross-compile check of the Windows front-ends (TUI + the
#                  native Direct2D/DirectWrite GUI, ARCH-82). Build breaks only.
#
# There is deliberately no GUI smoke job. scripts/gui_smoke.sh needs a Windows host
# for the client and a Linux one for the epoll-based daemon at the same time, which
# no hosted runner provides; it was carried here for a self-hosted box gated on
# vars.GUI_SMOKE and, with that variable never set, ran zero times while the release
# inherited its skip as a pass. The script stays as the pre-push gate docs/CLIENT.md
# already makes it.
# Doc-only changes skip CI. See docs/TESTING.md for the full strategy.

on:
  push:
    # Not main: it reaches CI through release.yml's workflow_call, and running it
    # standalone as well puts two runs in the same concurrency group, so one cancels
    # the other. Same fix as openchime-saas/ci.yml.
    branches-ignore: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  # No paths-ignore here, deliberately, unlike the push trigger above. These four
  # jobs are required status checks on main, and a job that never triggers never
  # reports -- so a docs-only pull request waits forever for a check that will not
  # run. Found by opening one: the release runbook PR was unmergeable, with only
  # `guard` reporting. The suite costs a couple of minutes; an unmergeable PR costs
  # more. Same reasoning the control-plane repo records on its own trigger.
  pull_request:
    branches: [main]
  # Lets the release workflow gate on these exact jobs rather than re-implement
  # them. A release that ran a weaker suite than CI would be worse than no gate,
  # because it would look like one. Same arrangement the control-plane repo's
  # deploys use.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        run: |
          sudo apt-get update
          # libsqlite3-dev for the daemon; bzip2 for the vendored mbedTLS
          # tarball that `make test` builds via scripts/build_mbedtls.sh.
          sudo apt-get install -y --no-install-recommends libsqlite3-dev bzip2
      - name: Build daemon
        run: make
      # Also a prerequisite of `make test`; named here so a duplicate opcode
      # fails as itself rather than inside the test step.
      - name: Check opcode uniqueness
        run: make check-opcodes
      - name: Run unit tests
        run: make test

  integration:
    name: end-to-end (native daemon)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          sudo apt-get update
          # bzip2 for the vendored mbedTLS tarball that the e2e client builds.
          sudo apt-get install -y --no-install-recommends libsqlite3-dev bzip2

      - name: Build the daemon and the e2e client
        run: make && make build/e2e_client

      # These two assertions used to live in Scripts/test-integration.sh, which
      # brought up the Docker Compose stack and drove the *deployed image* as a
      # black box. The stack is gone, so they run against the binary this job
      # just built. The assertions are unchanged; what they run against is not.
      #
      # Understand what that costs: the image published to GHCR is no longer
      # exercised by any test, here or in the release. The daemon's behaviour is
      # covered, its packaging into an image is not. ARCH-48 records the trade.
      - name: Start the daemon
        env:
          # Matches what docker-compose.yml used to set, so the e2e client's
          # expectations did not have to change either.
          OPENCHIME_DB_PATH: ${{ runner.temp }}/openchime.db
          OPENCHIME_HEALTH_PORT: '8080'
          OPENCHIME_PROTO_PORT: '8443'
          OC_BOOTSTRAP_USERS: 'e2e-alice:e2e-pw:owner,e2e-bob:e2e-pw:member'
        run: |
          set -euo pipefail
          ./openchimed >"${{ runner.temp }}/daemon.log" 2>&1 &
          echo "$!" > "${{ runner.temp }}/daemon.pid"

      - name: 1/2 wait for /healthz
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "[itest] 1/2 healthz OK"; exit 0
            fi
            sleep 2
          done
          echo "::error::daemon did not become healthy"
          cat "${{ runner.temp }}/daemon.log"
          exit 1

      - name: 2/2 protocol vertical over TLS
        run: |
          set -euo pipefail
          ./build/e2e_client 127.0.0.1 8443
          echo "[itest] 2/2 protocol vertical OK"

      - name: Daemon log
        if: always()
        run: cat "${{ runner.temp }}/daemon.log" || true

      - name: Stop the daemon
        if: always()
        run: kill "$(cat "${{ runner.temp }}/daemon.pid")" 2>/dev/null || true

  core:
    name: client app-core (compile check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # The client app-core (ARCH-74) is frontend-agnostic C linking the shared
      # wire code; `make core` proves it compiles standalone. Its behaviour is
      # driven end-to-end by the headless test in the build job's `make test`
      # (tests/test_client_core.c). bzip2 for the vendored mbedTLS tarball.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bzip2
      - name: Compile the app-core
        run: make core

  windows:
    name: windows cross-compile (TUI + GUI)
    # 24.04, not 22.04: the older runner's mingw-w64 headers declare
    # IRawElementProviderSimple but not the fragment/text interfaces, so the UIA
    # provider (ARCH-99) compiled to its stub and CI proved nothing about the
    # code that actually ships.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # mingw-w64 for the cross-compile; bzip2 + curl for the vendored mbedTLS
      # tarball that build_mbedtls_windows.sh fetches and cross-builds.
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 bzip2 curl
      - name: Cross-build the vendored Windows mbedTLS
        run: scripts/build_mbedtls_windows.sh
      # Both Windows front-ends share the app-core + shared wire code; a clean
      # link proves the pure-C Win32 (incl. Direct2D/DirectWrite-from-C, ARCH-82)
      # builds under mingw.
      - name: Compile the Windows front-ends
        run: make windows-tui windows-gui
