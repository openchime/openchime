name: ci

# Runs on every pull request into staging and every push to staging -- the
# checks staging's branch protection requires before a merge -- and is called by
# promote.yml and release.yml as their gate. Three jobs, on three machines at
# once, and nothing checked twice:
#   - build:       the daemon built and started for real (health check plus the
#                  protocol vertical over TLS), static linking, every Linux
#                  translation unit through the release's clang (the second
#                  compiler), and the suites that run no threads.
#   - thread-sanitizer: the suites whose code runs threads, under
#                  ThreadSanitizer -- their one run in CI.
#   - windows:     mingw cross-compile of the Windows front-ends (TUI + the
#                  SDL3/sdltext GUI, ARCH-80/106/107). Build breaks only.
#
# Each suite runs once: the threaded ones under the sanitizer, the rest plainly
# (the Makefile's TSAN_SUITES). Every vendored library is cached by the script
# that builds it. What the release checks itself -- read-aloud and voice input
# on the stripped binary and the installed package -- is not repeated here.
#
# There is deliberately no GUI job. scripts/gui_smoke.sh needs a Windows host for
# the client and a Linux one for the epoll-based daemon at the same time, which no
# hosted runner provides; a job was carried here for a self-hosted box gated on
# vars.GUI_SMOKE and, with that variable never set, ran zero times while the release
# inherited its skip as a pass. It stays as the pre-push gate docs/CLIENT.md
# already makes it.
# Doc-only changes skip CI. See docs/TESTING.md for the full strategy.

on:
  # A pull request into staging, where its results are the required checks; and
  # the push that lands on staging, whose run saves the caches every pull request
  # then restores (a cache is visible to a pull request from its base branch, not
  # from another feature branch). Not main: it reaches CI through release.yml's
  # workflow_call, and running it standalone as well puts two runs in the same
  # concurrency group, so one cancels the other.
  pull_request:
    branches: [staging]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  push:
    branches: [staging]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  # Lets the release workflow gate on these exact jobs rather than re-implement
  # them. A release that ran a weaker suite than CI would be worse than no gate,
  # because it would look like one. Same arrangement the control-plane repo's
  # deploys use.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        run: |
          # A stalled Ubuntu mirror must fail over, not hang. Set as
          # apt config, not per-command flags: it has to cover `install`, which
          # fetches from the same mirror, and not just `update`.
          # azure.archive.ubuntu.com is the Azure-local Ubuntu mirror the hosted
          # runners point at, and it stalls. Retries and timeouts are
          # not enough on their own: apt gives up on azure, falls back to
          # archive.ubuntu.com for InRelease, then wedges on the Packages fetch
          # and sits there until the job timeout. Measured on ubuntu-24.04 --
          # every noble entry came back Ign: and the step hung 20 minutes.
          # Point apt at archive.ubuntu.com so the broken mirror is never tried.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          sudo apt-get update
          # bzip2 for the vendored mbedTLS
          # tarball that `make test` builds via scripts/build_mbedtls.sh; nasm
          # for libvpx's assembly (scripts/build_libvpx.sh). gdb so that a test
          # binary that crashes prints every thread's stack (tests/main.c).
          sudo apt-get install -y --no-install-recommends bzip2 nasm gdb
      # Read-aloud's engine and model (ARCH-111): ONNX Runtime built minimal and
      # static from source (about 20 minutes), the converted voice model, and
      # voice input's recognizer files (ARCH-112). All are pure functions of the
      # files in the key, so a hit skips the build and a change to any of them
      # rebuilds. The timeout allows for a miss.
      - name: Restore the speech engine and models
        uses: actions/cache@v6
        with:
          path: |
            third_party/onnxruntime-1.30.0
            build/kitten
            build/moonshine
          key: tts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_onnxruntime.sh', 'daemon/ort.ops.config', 'scripts/build_kitten.sh', 'scripts/tts_convert.c', 'scripts/build_moonshine.sh') }}
      # The vendored native libraries: each script builds only what is missing,
      # so a hit skips the download and the build. Keyed by the scripts, which pin
      # the versions and checksums, and by the compiler that builds them.
      - name: Restore the vendored libraries
        uses: actions/cache@v6
        with:
          path: |
            third_party/mbedtls-3.6.2
            third_party/libvpx-1.17.0
            third_party/opus-1.6.1
            third_party/speexdsp-1.2.1
            third_party/llamacpp-0.5.0
          key: vendor-ubuntu-22.04-${{ runner.arch }}-gcc-${{ hashFiles('scripts/build_mbedtls.sh', 'scripts/build_libvpx.sh', 'scripts/build_opus.sh', 'scripts/build_speexdsp.sh', 'scripts/build_llamacpp.sh') }}
      # The web client's toolchain (docs/WEB.md): the daemon is never built
      # without the client it serves -- the page and loader are compiled into it
      # (daemon/webapp.h), so `make` needs emcc. The two wasm libraries are built
      # once by their scripts and cached, keyed by the scripts and the emsdk.
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache
      - name: Restore the wasm libraries
        uses: actions/cache@v6
        with:
          path: |
            build/wasm/mbedtls
            build/wasm/sdl3
            build/wasm/libvpx
            build/wasm/opus
            build/wasm/speexdsp
          key: wasm-emsdk6.0.8-${{ hashFiles('scripts/build_mbedtls_wasm.sh', 'scripts/build_sdl3_wasm.sh', 'scripts/build_media_wasm.sh', 'scripts/build_libvpx.sh', 'scripts/build_opus.sh', 'scripts/build_speexdsp.sh') }}
      - name: Build the daemon and the e2e client
        run: make && make build/e2e_client
      # Only the C runtime may be dynamic. ONNX Runtime, llama.cpp, their C++
      # runtime, mbedTLS, libopus and SQLite are all inside the binary, so anything else
      # appearing here is a dependency that crept back in.
      - name: The daemon links statically
        run: |
          ldd openchimed
          if ldd openchimed | grep -vE 'linux-vdso|libc\.so|libm\.so|ld-linux'; then
            echo "::error::openchimed has a dynamic dependency beyond libc and libm"; exit 1
          fi
      # The built binary, started from its environment as a deployment starts
      # it: the one thing the in-process suites cannot show, since they link the
      # daemon's code without its main(). Start, assert, stop in ONE step -- a
      # backgrounded daemon does not outlive the step that launched it.
      - name: End-to-end (healthz, then the protocol vertical over TLS)
        env:
          OPENCHIME_DB_PATH: ${{ runner.temp }}/itest/openchime.db
          OPENCHIME_BLOB_DIR: ${{ runner.temp }}/itest/blobs
          OPENCHIME_TLS_CERT: ${{ runner.temp }}/itest/cert.pem
          OPENCHIME_TLS_KEY: ${{ runner.temp }}/itest/key.pem
          OPENCHIME_HEALTH_PORT: '8080'
          OPENCHIME_PROTO_PORT: '8443'
          OPENCHIME_BOOTSTRAP_USERS: 'e2e-alice:e2e-pw:owner,e2e-bob:e2e-pw:member'
          # The e2e client signs in by password, in a frame (AUTH.md §8.10).
          OPENCHIME_TEST_PASSWORD_AUTH: '1'
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/itest/blobs"
          log="${{ runner.temp }}/daemon.log"
          ./openchimed >"$log" 2>&1 &
          dpid=$!
          trap 'kill "$dpid" 2>/dev/null || true' EXIT
          ok=
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz >/dev/null 2>&1; then ok=1; break; fi
            kill -0 "$dpid" 2>/dev/null || break
            sleep 1
          done
          if [ -z "$ok" ]; then echo "::error::daemon did not become healthy"; cat "$log"; exit 1; fi
          ./build/e2e_client 127.0.0.1 8443
      # The release compiles with zig's clang against glibc 2.34, and a newer
      # clang refuses things gcc accepts: a C11 typedef repetition and a
      # declaration after a label each passed gcc and broke a release. Every
      # Linux translation unit -- the daemon's, the client's and the tests' --
      # goes through that exact compiler under -Werror, which is the tree's
      # second-compiler check too. Zig is cached under the home directory.
      - name: Restore the release's compiler
        uses: actions/cache@v6
        with:
          path: ~/zig
          key: zig-0.13.0-linux-x86_64
      - name: Everything compiles with the release's compiler
        env:
          ZIG_VERSION: '0.13.0'
          ZIG_SHA: d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/zig/zig" ]; then
            curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
            echo "${ZIG_SHA}  /tmp/zig.tar.xz" | sha256sum -c -
            mkdir -p "$HOME/zig" && tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          fi
          make check-release-cc RELEASE_CC="$HOME/zig/zig cc -target x86_64-linux-gnu.2.34"
      # The suites that run no threads; the others run under the sanitizer in
      # its own job. check-opcodes and check-refs are its prerequisites.
      - name: Run the suites the sanitizer does not
        run: make test-ci PART=plain

  thread-sanitizer:
    name: thread sanitizer
    # The daemon is threads -- the event loop, its I/O threads, the writer, the
    # readers and the auth pool, the worker pools -- and so are the client, its
    # call engine and its recorder. `make test-ci PART=threads` runs the suites whose code
    # runs threads (the Makefile's TSAN_SUITES) under ThreadSanitizer, and a data
    # race between our threads fails it (tests/tsan.supp). This is those
    # suites' only run in CI.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install build deps
        run: |
          set -euo pipefail
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          sudo apt-get update
          # ffmpeg only for ffprobe, which the media suite runs over a recorded
          # file as an independent validator -- nothing links it. gdb so that a
          # crash prints every thread's stack (tests/main.c).
          sudo apt-get install -y --no-install-recommends bzip2 nasm ffmpeg gdb
      # The vendored native libraries: each script builds only what is missing,
      # so a hit skips the download and the build. Keyed by the scripts, which pin
      # the versions and checksums, and by the compiler that builds them.
      - name: Restore the vendored libraries
        uses: actions/cache@v6
        with:
          path: |
            third_party/mbedtls-3.6.2
            third_party/libvpx-1.17.0
            third_party/opus-1.6.1
            third_party/speexdsp-1.2.1
          key: vendor-ubuntu-22.04-${{ runner.arch }}-gcc-${{ hashFiles('scripts/build_mbedtls.sh', 'scripts/build_libvpx.sh', 'scripts/build_opus.sh', 'scripts/build_speexdsp.sh') }}
      # The web client's toolchain (docs/WEB.md): the daemon is never built
      # without the client it serves -- the page and loader are compiled into it
      # (daemon/webapp.h), so `make` needs emcc. The two wasm libraries are built
      # once by their scripts and cached, keyed by the scripts and the emsdk.
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache
      - name: Restore the wasm libraries
        uses: actions/cache@v6
        with:
          path: |
            build/wasm/mbedtls
            build/wasm/sdl3
            build/wasm/libvpx
            build/wasm/opus
            build/wasm/speexdsp
          key: wasm-emsdk6.0.8-${{ hashFiles('scripts/build_mbedtls_wasm.sh', 'scripts/build_sdl3_wasm.sh', 'scripts/build_media_wasm.sh', 'scripts/build_libvpx.sh', 'scripts/build_opus.sh', 'scripts/build_speexdsp.sh') }}
      - name: Test under ThreadSanitizer
        run: make test-ci PART=threads

  windows:
    name: windows cross-compile (TUI + GUI)
    # 24.04, not 22.04: the older runner's mingw-w64 headers declare
    # IRawElementProviderSimple but not the fragment/text interfaces, so the UIA
    # provider (ARCH-99) compiled to its stub and CI proved nothing about the
    # code that actually ships.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # mingw-w64 for the cross-compile; bzip2 + curl for the vendored mbedTLS
      # tarball that build_mbedtls_windows.sh fetches and cross-builds.
      - name: Install cross toolchain
        run: |
          # A stalled Ubuntu mirror must fail over, not hang. Set as
          # apt config, not per-command flags: it has to cover `install`, which
          # fetches from the same mirror, and not just `update`.
          # azure.archive.ubuntu.com is the Azure-local Ubuntu mirror the hosted
          # runners point at, and it stalls. Retries and timeouts are
          # not enough on their own: apt gives up on azure, falls back to
          # archive.ubuntu.com for InRelease, then wedges on the Packages fetch
          # and sits there until the job timeout. Measured on ubuntu-24.04 --
          # every noble entry came back Ign: and the step hung 20 minutes.
          # Point apt at archive.ubuntu.com so the broken mirror is never tried.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          sudo apt-get update
          # g++-mingw-w64-x86-64 solely for the SDL3 cross-build: SDL's
          # Windows branch enables CXX unconditionally (see
          # scripts/build_sdl3_windows.sh). Nothing of ours compiles as C++.
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 bzip2 curl nasm
      # The cross-built libraries and SDL3, cached like the native ones: each
      # script builds only what is missing.
      - name: Restore the vendored Windows libraries
        uses: actions/cache@v6
        with:
          path: |
            third_party/mbedtls-3.6.2-win
            third_party/libvpx-1.17.0-win
            third_party/opus-1.6.1-win
            third_party/speexdsp-1.2.1-win
            third_party/sdl3-3.4.14-win
            third_party/mbedtls-3.6.2
          key: vendor-win-ubuntu-24.04-${{ hashFiles('scripts/build_mbedtls.sh', 'scripts/build_mbedtls_windows.sh', 'scripts/build_libvpx.sh', 'scripts/build_opus.sh', 'scripts/build_speexdsp.sh', 'scripts/build_sdl3_windows.sh') }}
      - name: Cross-build the vendored Windows mbedTLS
        run: scripts/build_mbedtls_windows.sh
      # libvpx and libopus for the Win32 client's video messages (ARCH-110).
      # speexdsp for voice input's echo canceller (ARCH-112).
      - name: Cross-build the vendored Windows libvpx, libopus and speexdsp
        run: scripts/build_libvpx.sh windows && scripts/build_opus.sh windows && scripts/build_speexdsp.sh windows
      # cmake is preinstalled on the hosted runners; SDL's own build is CMake,
      # invoked by the fetch script (VENDORS.md §2).
      - name: Cross-build the vendored Windows SDL3
        run: scripts/build_sdl3_windows.sh
      # Both Windows front-ends share the app-core + shared wire code; a clean
      # link proves the pure-C Win32 (incl. Direct2D/DirectWrite-from-C, ARCH-82)
      # builds under mingw.
      - name: Compile the Windows front-ends
        run: make windows-tui windows-gui
      # This runner's gcc is newer than the build job's, and at -O2 it raises
      # warnings (format-truncation among them) that gcc 11 and clang do not,
      # so the Linux terminal client is built here too.
      - name: The terminal client builds with this runner's gcc
        run: gcc --version | head -1 && make tui
