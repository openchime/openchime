name: ci

# Runs on pushes to main and on every PR targeting main. Three jobs:
#   - build:       native gcc build of the daemon, plus unit tests (make test),
#                  which include the headless client app-core test.
#   - integration: the durability path end-to-end on the Docker Compose stack —
#                  replication reaching MinIO (ARCH-23) and restore-on-boot
#                  (ARCH-24), automating the README's "Verify" steps.
#   - core:        standalone compile check of the client app-core (ARCH-74).
# Doc-only changes skip CI. See docs/TESTING.md for the full strategy.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          # libsqlite3-dev for the daemon; bzip2 for the vendored mbedTLS
          # tarball that `make test` builds via scripts/build_mbedtls.sh.
          sudo apt-get install -y --no-install-recommends libsqlite3-dev bzip2
      - name: Build daemon
        run: make
      - name: Run unit tests
        run: |
          if ls tests/*.c >/dev/null 2>&1; then
            make test
          else
            echo "no unit tests yet — skipping (see docs/TESTING.md §2)"
          fi

  integration:
    name: end-to-end (compose)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          # bzip2 for the vendored mbedTLS tarball that the e2e client builds.
          sudo apt-get install -y --no-install-recommends bzip2

      # The whole harness — healthz, replication, protocol vertical over TLS,
      # and restore-on-boot — lives in one script so it runs identically here
      # and locally (`make integration`). See docs/TESTING.md §3.
      - name: Run integration harness
        run: Scripts/test-integration.sh

      - name: Tear down
        if: always()
        run: COMPOSE_PROJECT_NAME=openchime docker compose down -v

  core:
    name: client app-core (compile check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The client app-core (ARCH-74) is frontend-agnostic C linking the shared
      # wire code; `make core` proves it compiles standalone. Its behaviour is
      # driven end-to-end by the headless test in the build job's `make test`
      # (tests/test_client_core.c). bzip2 for the vendored mbedTLS tarball.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bzip2
      - name: Compile the app-core
        run: make core
