name: ci

# Runs on every pull request into staging and every push to staging -- the
# checks staging's branch protection requires before a merge. The push's run is
# the gate release-candidate.yml waits for (release.yml does not run it again).
# Three jobs, on three machines at once, and nothing checked twice:
#   - build:       the daemon built and started for real (health check plus the
#                  protocol vertical over TLS), static linking, every Linux
#                  translation unit through the release's clang (the second
#                  compiler), and the suites that run no threads.
#   - thread-sanitizer: the suites whose code runs threads, under
#                  ThreadSanitizer -- their one run in CI.
#   - windows:     the Windows front-ends (TUI + the SDL3/sdltext GUI,
#                  ARCH-80/106/107) cross-compiled with the pinned llvm-mingw.
#                  Build breaks only.
#
# Each suite runs once: the threaded ones under the sanitizer, the rest plainly
# (the Makefile's TSAN_SUITES). Every vendored library and toolchain is fetched
# pinned by the script that builds it (mk/toolchains.mk) and cached by that
# script's hash; nothing is installed from a package the day decides. One
# runner image everywhere, ubuntu-24.04, the same one the release builds on.
# What the release checks itself -- read-aloud and voice input on the stripped
# binary and the installed package -- is not repeated here.
#
# There is deliberately no GUI job. scripts/gui/smoke.sh needs a Windows host for
# the client and a Linux one for the epoll-based daemon at the same time, which no
# hosted runner provides; a job was carried here for a self-hosted box gated on
# vars.GUI_SMOKE and, with that variable never set, ran zero times while the release
# inherited its skip as a pass. It stays as the pre-push gate docs/CLIENT.md
# already makes it.
# CI runs on every pull request and push, so its required checks always report.
# A change that touches only documentation (*.md, .gitignore, .claude/) skips
# the three jobs below, which GitHub counts as passed. See docs/TESTING.md for the full strategy.
#
# Each change is tested once, not once on its pull request and again when it
# lands. Each job of a pull request's run, as its last step and only when
# everything before it passed, uploads a record named for the tree it tested
# (tested-<tree>-build, -tsan, -windows; the tree of refs/pull/N/merge). On
# the push that lands on staging, `changes` asks scripts/release/tested_tree.sh
# whether the merged pull request's own head has a successful run holding all
# three records for the pushed tree; a squash merge onto an unmoved staging
# yields exactly that tree. A job is then skipped only if, in addition, every
# cache it saves already exists on staging (looked up, not restored), since
# the push's run is the one that saves the caches pull requests restore. If
# staging moved, a record expired, a lookup failed or a cache is missing, the
# job runs in full. The checks staging requires are the pull request's, which
# are never skipped this way; the push's run still concludes success for
# wait_checks.sh. The lookup never runs on a call from another workflow.
#
# Each cache's path and key is written once, as a YAML anchor on its lookup in
# `changes`, and the job that restores and saves it uses the alias, so the
# lookup cannot drift from the save.

on:
  # A pull request into staging, where its results are the required checks; and
  # the push that lands on staging, whose run saves the caches every pull request
  # then restores (a cache is visible to a pull request from its base branch, not
  # from another feature branch) and skips what its pull request already tested
  # (the header). Not main: nothing reaches main but a release of a staging
  # commit, which CI already ran.
  #
  # No path filter on either: a filtered-out pull request never reports the
  # checks its merge requires, and on a force-push the filter skipped the one
  # run a release-candidate waits on. `changes` decides instead.
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  # Lets the release workflow gate on these exact jobs rather than re-implement
  # them. A release that ran a weaker suite than CI would be worse than no gate,
  # because it would look like one. Same arrangement the control-plane repo's
  # deploys use.
  workflow_call:

# Grouped by the calling workflow as well as the ref: when release.yml calls
# this one, github.workflow is "release", so a push to staging (its own CI run)
# no longer cancels the gate of a dry run rehearsing on staging, which it did
# the first time one ran alongside a merge. Two runs of one workflow on one
# ref still cancel the older, which is the point.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs read the tree and nothing else. `changes` also reads
# the runs, artifacts and pull requests its lookup needs. A workflow calling
# this one must grant at least that much, or GitHub refuses to start the call.
permissions:
  contents: read

jobs:
  # Documentation only, or code? Everything else in this workflow runs only for
  # code. Compared against the pull request's base, or the push's previous tip;
  # a push with no previous tip here (a new branch, a force-push to a new root)
  # and a call from another workflow count as code.
  #
  # On a push to staging that is code, it also decides which jobs the merged
  # pull request already ran on this tree (the header): skip_build, skip_tsan
  # and skip_windows are 'true' only for a job whose tree was tested and whose
  # caches all exist. On a pull request, and on a call from another workflow
  # (whose github context is the caller's, so its event may be a push too),
  # nothing is looked up and nothing is skipped.
  changes:
    name: classify the change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read          # the runs and their artifacts
      pull-requests: read    # the pull request a commit merged
    outputs:
      code: ${{ steps.classify.outputs.code }}
      promotable: ${{ steps.classify.outputs.promotable }}
      tree: ${{ steps.classify.outputs.tree }}
      skip_build: ${{ steps.decide.outputs.skip_build }}
      skip_tsan: ${{ steps.decide.outputs.skip_tsan }}
      skip_windows: ${{ steps.decide.outputs.skip_windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # On this workflow's own push to staging, the checks of what the squash
      # committed, as steps of this job rather than workflows of their own (each
      # would bill a whole minute for seconds of work): the commit policy and the
      # attribution scan. Either failing fails ci.
      - name: Commit policy
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/staging'
          && startsWith(github.workflow_ref, format('{0}/.github/workflows/ci.yml@', github.repository))
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/release/commit_policy.sh
      - name: Attribution scan
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/staging'
          && startsWith(github.workflow_ref, format('{0}/.github/workflows/ci.yml@', github.repository))
        env:
          EVENT: push
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF: ${{ github.ref }}
          BASE_REF: ""
        run: scripts/release/attribution_scan.sh
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          code=true
          files=""
          case "$EVENT" in
            # What the branch changed since it left its base (three dots).
            pull_request) files=$(git diff --name-only "${BASE}...${HEAD}") || files="" ;;
            push)
              if [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
                 && git cat-file -e "$BEFORE" 2>/dev/null \
                 && git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA"; then
                files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA") || files=""
              fi ;;
          esac
          # A workflow but this one builds nothing these jobs test, so a change
          # to one alone runs none of them; a change to this file tests itself.
          # Promotable: documentation and workflows only, what promote.yml moves
          # main for without a release.
          promotable=false
          if [ -n "$files" ]; then
            code=false
            promotable=true
            while IFS= read -r f; do
              case "$f" in
                *.md|.gitignore|.claude/*) ;;
                .github/workflows/ci.yml) code=true; echo "code: $f" ;;
                .github/*) ;;
                *) code=true; promotable=false; echo "code: $f"; break ;;
              esac
            done <<<"$files"
          fi
          [ "$code" = false ] && echo "documentation and other workflows only: the build and test jobs are skipped"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "promotable=$promotable" >> "$GITHUB_OUTPUT"
          # The tree the jobs test: on a pull request, that of its merge
          # into staging (refs/pull/N/merge), which the records are named for.
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # Only on this workflow's own push run to staging, never on a call from
      # another workflow (github.workflow_ref is then the caller's). It never
      # fails: any doubt reads as untested.
      - name: Did the merged pull request test this tree?
        id: tested
        if: >-
          steps.classify.outputs.code == 'true'
          && github.event_name == 'push' && github.ref == 'refs/heads/staging'
          && startsWith(github.workflow_ref, format('{0}/.github/workflows/ci.yml@', github.repository))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.classify.outputs.tree }}
        run: |
          scripts/release/tested_tree.sh "$TREE" "$GITHUB_SHA" \
            >>"$GITHUB_OUTPUT" 2>"$RUNNER_TEMP/tested_tree.log" || true
          cat "$RUNNER_TEMP/tested_tree.log"
      # Whether each cache the job would save already exists, looked up
      # without downloading. Each path and key is anchored here and aliased
      # where the job restores and saves it, so the two cannot differ. Asked
      # only for a job whose tree was tested.
      - name: Look up the toolchains cache
        id: cache_toolchains
        if: steps.tested.outputs.build == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: &toolchains_path |
            third_party/zig-0.13.0
            third_party/emsdk-6.0.8
          key: &toolchains_key toolchains-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/zig.sh', 'scripts/build/emsdk.sh') }}
      - name: Look up the speech engine and models cache
        id: cache_tts
        if: steps.tested.outputs.build == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: &tts_path |
            third_party/onnxruntime-1.30.0
            build/kitten
            build/moonshine
          key: &tts_key tts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/onnxruntime.sh', 'daemon/ort.ops.config', 'scripts/build/kitten.sh', 'scripts/build/tts_convert.c', 'scripts/build/moonshine.sh') }}
      - name: Look up the vendored libraries cache
        id: cache_vendor
        if: steps.tested.outputs.build == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: &vendor_path |
            third_party/mbedtls-3.6.2
            third_party/libvpx-1.17.0
            third_party/opus-1.6.1
            third_party/speexdsp-1.2.1
            third_party/llamacpp-0.5.0
          key: &vendor_key vendor-${{ runner.os }}-24.04-${{ runner.arch }}-gcc-${{ hashFiles('scripts/build/mbedtls.sh', 'scripts/build/libvpx.sh', 'scripts/build/opus.sh', 'scripts/build/speexdsp.sh', 'scripts/build/llamacpp.sh') }}
      - name: Look up the wasm libraries cache
        id: cache_wasm
        if: steps.tested.outputs.build == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: &wasm_path |
            build/wasm/mbedtls
            build/wasm/sdl3
            build/wasm/libvpx
            build/wasm/opus
            build/wasm/speexdsp
          key: &wasm_key wasm-emsdk6.0.8-${{ hashFiles('scripts/build/mbedtls_wasm.sh', 'scripts/build/sdl3_wasm.sh', 'scripts/build/media_wasm.sh', 'scripts/build/libvpx.sh', 'scripts/build/opus.sh', 'scripts/build/speexdsp.sh') }}
      - name: Look up the sanitizer's vendored libraries cache
        id: cache_vendor_tsan
        if: steps.tested.outputs.tsan == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: &vendor_tsan_path |
            third_party/mbedtls-3.6.2
            third_party/libvpx-1.17.0
            third_party/opus-1.6.1
            third_party/speexdsp-1.2.1
          key: &vendor_tsan_key vendor-${{ runner.os }}-24.04-${{ runner.arch }}-gcc-${{ hashFiles('scripts/build/mbedtls.sh', 'scripts/build/libvpx.sh', 'scripts/build/opus.sh', 'scripts/build/speexdsp.sh') }}
      - name: Look up the mingw toolchain cache
        id: cache_mingw
        if: steps.tested.outputs.windows == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: &mingw_path third_party/llvm-mingw-20261006
          key: &mingw_key toolchain-mingw-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/llvm_mingw.sh') }}
      - name: Look up the vendored Windows libraries cache
        id: cache_vendor_win
        if: steps.tested.outputs.windows == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: &vendor_win_path |
            third_party/mbedtls-3.6.2-win
            third_party/libvpx-1.17.0-win
            third_party/opus-1.6.1-win
            third_party/speexdsp-1.2.1-win
            third_party/sdl3-3.4.14-win
            third_party/mbedtls-3.6.2
          key: &vendor_win_key vendor-win-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/llvm_mingw.sh', 'scripts/build/mbedtls.sh', 'scripts/build/mbedtls_windows.sh', 'scripts/build/libvpx.sh', 'scripts/build/opus.sh', 'scripts/build/speexdsp.sh', 'scripts/build/sdl3_windows.sh') }}
      # A job is skipped only when its tree was tested AND every cache it
      # saves hit; anything else, including a step above that did not run,
      # leaves it to run in full.
      - name: Decide what runs
        id: decide
        env:
          LOOKED: ${{ steps.tested.conclusion == 'success' }}
          RUN: ${{ steps.tested.outputs.run }}
          T_BUILD: ${{ steps.tested.outputs.build }}
          T_TSAN: ${{ steps.tested.outputs.tsan }}
          T_WINDOWS: ${{ steps.tested.outputs.windows }}
          HIT_TOOLCHAINS: ${{ steps.cache_toolchains.outputs.cache-hit }}
          HIT_TTS: ${{ steps.cache_tts.outputs.cache-hit }}
          HIT_VENDOR: ${{ steps.cache_vendor.outputs.cache-hit }}
          HIT_WASM: ${{ steps.cache_wasm.outputs.cache-hit }}
          HIT_VENDOR_TSAN: ${{ steps.cache_vendor_tsan.outputs.cache-hit }}
          HIT_MINGW: ${{ steps.cache_mingw.outputs.cache-hit }}
          HIT_VENDOR_WIN: ${{ steps.cache_vendor_win.outputs.cache-hit }}
        run: |
          set -uo pipefail
          if [ "$LOOKED" != true ]; then
            printf 'skip_%s=false\n' build tsan windows >> "$GITHUB_OUTPUT"
            echo "nothing looked up (not this workflow's own push of code to staging): nothing is skipped"
            exit 0
          fi
          # decide <job> <tested> <cache-name=hit>...: prints the line and
          # writes skip_<job>.
          decide() {
            local job="$1" tested="$2" skip=true why="" c; shift 2
            if [ "$tested" != true ]; then
              skip=false; why="its tree was not tested by the merged pull request"
            else
              for c in "$@"; do
                [ "${c#*=}" = true ] || { skip=false; why="${why:+$why, }the ${c%%=*} cache is missing"; }
              done
            fi
            echo "skip_${job}=${skip}" >> "$GITHUB_OUTPUT"
            if [ "$skip" = true ]; then
              echo "- **${job}**: skipped, tested by the merged pull request and its caches all exist"
            else
              echo "- **${job}**: runs (${why})"
            fi
          }
          {
            decide build "$T_BUILD" toolchains="$HIT_TOOLCHAINS" tts="$HIT_TTS" vendor="$HIT_VENDOR" wasm="$HIT_WASM"
            decide tsan "$T_TSAN" vendor-tsan="$HIT_VENDOR_TSAN"
            decide windows "$T_WINDOWS" mingw="$HIT_MINGW" vendor-win="$HIT_VENDOR_WIN"
          } > "$RUNNER_TEMP/decision.md"
          cat "$RUNNER_TEMP/decision.md"
          {
            echo "## What this push runs"
            if [ -n "$RUN" ]; then
              echo "Tree tested by run [${RUN}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN}) of the merged pull request."
            else
              echo "Nothing reused: $(tail -n 1 "$RUNNER_TEMP/tested_tree.log" 2>/dev/null | sed 's/^tested_tree: //')."
            fi
            echo
            cat "$RUNNER_TEMP/decision.md"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build + unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.skip_build != 'true'
    runs-on: ubuntu-24.04
    env:
      TESTED_AS: build   # the record's suffix (its last two steps)
    timeout-minutes: 90   # a cold cache builds the vendored libraries: ~44 min
    steps:
      # Every CPU the runner has, for every make below and the makes they
      # start (the Makefile is safe under -j; locally nothing changes).
      - name: Use every CPU for make
        run: echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Install build deps
        timeout-minutes: 20
        run: |
          # scripts/build/apt.sh: the mirror rewritten, each apt-get bounded
          # and retried, so a stall fails the step instead of holding the job.
          # bzip2 for the vendored mbedTLS tarball that `make` builds via
          # scripts/build/mbedtls.sh; nasm for libvpx's assembly
          # (scripts/build/libvpx.sh); xz-utils for the toolchain tarballs. gdb
          # so that a test binary that crashes prints every thread's stack
          # (tests/main.c). cmake, curl, git and python3 are on the image.
          scripts/build/apt.sh bzip2 nasm gdb xz-utils
      # The toolchains make fetches pinned (mk/toolchains.mk): zig for the
      # release-compiler pass, Emscripten for the web client the daemon embeds.
      # Keyed by the scripts, which pin the versions and the checksums.
      - name: Restore the toolchains
        uses: actions/cache@v6
        with:
          path: *toolchains_path
          key: *toolchains_key
      # Read-aloud's engine and model (ARCH-111): ONNX Runtime built minimal and
      # static from source (about 20 minutes), the converted voice model, and
      # voice input's recognizer files (ARCH-112). All are pure functions of the
      # files in the key, so a hit skips the build and a change to any of them
      # rebuilds. The timeout allows for a miss.
      - name: Restore the speech engine and models
        uses: actions/cache@v6
        with:
          path: *tts_path
          key: *tts_key
      # The vendored native libraries: each script builds only what is missing,
      # so a hit skips the download and the build. Keyed by the scripts, which pin
      # the versions and checksums, and by the compiler that builds them.
      - name: Restore the vendored libraries
        uses: actions/cache@v6
        with:
          path: *vendor_path
          key: *vendor_key
      # The web client's libraries (docs/WEB.md): the release daemon carries the
      # client (WEB=1), so this job builds it too. Built once by their scripts
      # and cached, keyed by the scripts and the pinned Emscripten.
      - name: Restore the wasm libraries
        uses: actions/cache@v6
        with:
          path: *wasm_path
          key: *wasm_key
      # The daemon as the release builds it (every feature, the web client in),
      # the e2e client the step below drives, and the Linux terminal client: one
      # make, so the web client's link overlaps the other compiles.
      - name: Build the daemon, the e2e client and the terminal client
        run: make TTS=1 STT=1 SUM=1 WEB=1 all build/e2e_client linux
      # Only the C runtime may be dynamic. ONNX Runtime, llama.cpp, their C++
      # runtime, mbedTLS, libopus and SQLite are all inside the binary, so anything else
      # appearing here is a dependency that crept back in.
      - name: The daemon links statically
        run: |
          ldd openchimed
          if ldd openchimed | grep -vE 'linux-vdso|libc\.so|libm\.so|ld-linux'; then
            echo "::error::openchimed has a dynamic dependency beyond libc and libm"; exit 1
          fi
      # The built binary, started from its environment as a deployment starts
      # it: the one thing the in-process suites cannot show, since they link the
      # daemon's code without its main(). Start, assert, stop in ONE step -- a
      # backgrounded daemon does not outlive the step that launched it.
      - name: End-to-end (healthz, then the protocol vertical over TLS)
        env:
          OPENCHIME_DATA_DIR: ${{ runner.temp }}/itest
          OPENCHIME_HEALTH_PORT: '8080'
          OPENCHIME_PORT: '8443'
          # Development mode: the step bootstraps its users, which only that
          # mode reads (CONFIG.md "Mode"). The e2e client signs in on the
          # daemon's page, as a person does (AUTH.md §8.10, tests/testsignin.h).
          OPENCHIME_MODE: development
          OPENCHIME_DEV_USERS: 'e2e-alice:e2e-pw:owner,e2e-bob:e2e-pw:member'
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/itest"
          log="${{ runner.temp }}/daemon.log"
          ./openchimed >"$log" 2>&1 &
          dpid=$!
          trap 'kill "$dpid" 2>/dev/null || true' EXIT
          ok=
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz >/dev/null 2>&1; then ok=1; break; fi
            kill -0 "$dpid" 2>/dev/null || break
            sleep 1
          done
          if [ -z "$ok" ]; then echo "::error::daemon did not become healthy"; cat "$log"; exit 1; fi
          ./build/e2e_client 127.0.0.1 8443
      # The release compiles with zig's clang against glibc 2.34, and a newer
      # clang refuses things gcc accepts: a C11 typedef repetition and a
      # declaration after a label each passed gcc and broke a release. Every
      # Linux translation unit -- the daemon's, the client's and the tests' --
      # goes through that exact compiler under -Werror, which is the tree's
      # second-compiler check too. make fetches the pinned zig.
      - name: Everything compiles with the release's compiler
        run: make check-release-cc
      # The suites that run no threads; the others run under the sanitizer in
      # its own job. Its recipe runs the five source checks first (mk/tests.mk's
      # SOURCE_CHECKS: opcodes, issue references, make targets, the configuration
      # registry, release lint).
      - name: Run the suites the sanitizer does not
        run: make test-ci PART=plain
      # The record that this job passed on this tree, read by the push that
      # lands it (the header, scripts/release/tested_tree.sh). Last, so it
      # exists only if every step above passed; only on this workflow's own
      # pull-request run. Written once here and aliased by the other jobs.
      - &record_write
        name: Write the record of the tested tree
        if: >-
          success() && github.event_name == 'pull_request'
          && startsWith(github.workflow_ref, format('{0}/.github/workflows/ci.yml@', github.repository))
        env:
          TREE: ${{ needs.changes.outputs.tree }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '{"tree":"%s","sha":"%s","merge":"%s","run_id":"%s","run_attempt":"%s"}\n' \
            "$TREE" "$HEAD_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/tested.json"
          cat "$RUNNER_TEMP/tested.json"
      - &record_upload
        name: Upload the record of the tested tree
        if: >-
          success() && github.event_name == 'pull_request'
          && startsWith(github.workflow_ref, format('{0}/.github/workflows/ci.yml@', github.repository))
        uses: actions/upload-artifact@v7
        with:
          name: tested-${{ needs.changes.outputs.tree }}-${{ env.TESTED_AS }}
          path: ${{ runner.temp }}/tested.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  thread-sanitizer:
    name: thread sanitizer
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.skip_tsan != 'true'
    # The daemon is threads -- the event loop, its I/O threads, the writer, the
    # readers and the auth pool, the worker pools -- and so are the client, its
    # call engine and its recorder. `make test-ci PART=threads` runs the suites whose code
    # runs threads (the Makefile's TSAN_SUITES) under ThreadSanitizer, and a data
    # race between our threads fails it (tests/tsan.supp). This is those
    # suites' only run in CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TESTED_AS: tsan
    steps:
      # Every CPU the runner has, for every make below and the makes they
      # start (the Makefile is safe under -j; locally nothing changes).
      - name: Use every CPU for make
        run: echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Install build deps
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # ffmpeg only for ffprobe, which the media suite runs over a recorded
          # file as an independent validator -- nothing links it. gdb so that a
          # crash prints every thread's stack (tests/main.c).
          scripts/build/apt.sh bzip2 nasm ffmpeg gdb
      # The vendored native libraries: each script builds only what is missing,
      # so a hit skips the download and the build. Keyed by the scripts, which pin
      # the versions and checksums, and by the compiler that builds them.
      - name: Restore the vendored libraries
        uses: actions/cache@v6
        with:
          path: *vendor_tsan_path
          key: *vendor_tsan_key
      # The test binary needs no Emscripten: the web client's page is embedded
      # from source and its loader only into a daemon built with WEB=1.
      - name: Test under ThreadSanitizer
        run: make test-ci PART=threads
      # The record that this job passed on this tree (see the build job).
      - *record_write
      - *record_upload

  windows:
    name: windows cross-compile (TUI + GUI)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.skip_windows != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TESTED_AS: windows
    steps:
      # Every CPU the runner has, for every make below and the makes they
      # start (the Makefile is safe under -j; locally nothing changes).
      - name: Use every CPU for make
        run: echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Install build deps
        timeout-minutes: 20
        run: |
          # bzip2 for the mbedTLS tarball, nasm for libvpx's assembly, xz-utils
          # for the toolchain tarball. The compiler is not a package: make
          # fetches the pinned llvm-mingw (scripts/build/llvm_mingw.sh).
          scripts/build/apt.sh bzip2 nasm xz-utils
      - name: Restore the toolchain
        uses: actions/cache@v6
        with:
          path: *mingw_path
          key: *mingw_key
      # The cross-built libraries and SDL3, cached like the native ones: each
      # script builds only what is missing, and make runs each from its rule.
      - name: Restore the vendored Windows libraries
        uses: actions/cache@v6
        with:
          path: *vendor_win_path
          key: *vendor_win_key
      # Both Windows front-ends share the app-core + shared wire code; a clean
      # link proves the pure-C Win32 (incl. Direct2D/DirectWrite-from-C, ARCH-82)
      # builds under clang's mingw. The two Windows test programs are built
      # too (a Windows host runs them, docs/TESTING.md).
      - name: Compile the Windows front-ends and test programs
        run: make windows build/sdltext_test.exe build/gfx_test.exe
      # The record that this job passed on this tree (see the build job).
      - *record_write
      - *record_upload

  # promote, started once this push's checks passed, when it changed only
  # documentation and workflows: a dispatch, so no runner waits on this run,
  # and on a push of code this job does not start at all. Its own job, so no
  # step that runs the repository's code holds `actions: write`.
  promote:
    name: hand off to promote
    needs: [changes, build, thread-sanitizer, windows]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/staging' && !cancelled()
      && startsWith(github.workflow_ref, format('{0}/.github/workflows/ci.yml@', github.repository))
      && needs.changes.result == 'success' && needs.changes.outputs.promotable == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.thread-sanitizer.result == 'success' || needs.thread-sanitizer.result == 'skipped')
      && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote.yml -R "$GITHUB_REPOSITORY" --ref staging
