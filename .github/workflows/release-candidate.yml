# The release-candidate (ARCH-20): the staging tip, built as a release ships
# it, run through the full suite, stored by commit and published as
# release-N-rcK, in one run.
#
# Dispatched by hand on staging, once the tip has been graded and approved:
#
#   gh workflow run release-candidate.yml --ref staging
#
# Three jobs, each its steps in sequence on one runner: GitHub bills every job
# rounded up to a whole minute plus its set-up, so a job is added only where
# the environment changes. It takes the staging tip, in this order:
#   1. `test` (test-all.yml, called; no secrets): the gate -- the run is on
#      staging's tip, in the repository RELEASE_REPO names; main can take the
#      commit as its next release (scripts/release/main_next.sh); it is not
#      already released, nor already a release-candidate; then the commit
#      checks over <last release>..tip, the attribution scan, which refuses,
#      and the commit policy, which only warns, so one bad subject already on
#      staging does not stop every later release-candidate -- and then the
#      full suite's code tests (`make build-all` and `make test-all`,
#      PART=plain then threads; docs/TESTING.md);
#   2. `stage` (the `release` environment), only when they pass: the release
#      credentials reported; everything a release ships -- both daemons with
#      their data and their packages, the container images, the Windows
#      clients and their installers -- with `make build-all` PART=packages,
#      image and windows, each checked by `make test-all` with the same PART,
#      stamped with the BUILD ID, the short commit; then stored by that id:
#      the trees and binaries in the mirror bucket (DIST_MIRROR_BUCKET, which
#      holds the apt/dnf mirror and the stored builds) under candidates/<id>/
#      with a signed manifest, the images in the build repository
#      (IMAGE_REPO_BUILD) as :build-<id>;
#   3. `publish` (the `release` environment): read back from the bucket and
#      verified (scripts/release/verify_candidate.sh), the commit tagged
#      release-N-rcK (N the number the next release would take, K counting
#      the release-candidates for it), the image tagged :N-rcK and, when it is
#      the newest for N, :rc, and a prerelease of the tag made with the stored
#      files; last, the commit, the tag and the prerelease copied to the
#      repository the PUBLIC_REPO variable names, a convenience nothing here
#      depends on.
# A release (release.yml) takes exactly one release-candidate, assigns it
# release-N, packages the same binaries under N and publishes them: no
# compiler runs after this workflow, and what was verified here is what ships.
#
# ONE BINARY PER ARCHITECTURE feeds the .deb, the .rpm, the tarball and the
# image. It is built with `zig cc` targeting glibc 2.34, the oldest supported
# target, on a bare ubuntu-24.04 runner with toolchains make fetches pinned
# (mk/toolchains.mk); the arm64 daemon is cross-built on the same runner;
# the images are the packaged tree laid onto a glibc base with buildah (no
# compile inside, so no emulation); the Windows clients cross-compile with
# llvm-mingw. NOTHING HERE USES DOCKER. The Linux packages are built under the
# number a release of this build takes, and the release publishes them as
# they are; the Windows installers under a placeholder version, which a
# release makes again under its number, signed.
name: release-candidate

on:
  workflow_dispatch:

# One run per commit at a time, never cancelled half way: a second dispatch of
# the same commit waits, then is refused by the gate if the first made its
# release-candidate. The number is taken inside the `release` group
# (publish), shared with release.yml.
concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

# Every deployment-specific value is a repository variable or secret.
env:
  # Every bash step, and every script it runs, retries what fails in a call to
  # GitHub's network and gives up on a dead connection (.github/net-retry.bash).
  BASH_ENV: ${{ github.workspace }}/.github/net-retry.bash
  # The build's images: the repository they are pushed to, and the registry's
  # login (basic auth: the user below, IMAGE_REGISTRY_TOKEN_BUILD as password).
  # The registry is the repository's first path segment (${BUILD_IMAGE%%/*}).
  BUILD_IMAGE: ${{ vars.IMAGE_REPO_BUILD }}
  IMAGE_REGISTRY_USER: ${{ vars.IMAGE_REGISTRY_USER }}
  DIST_S3_REGION: ${{ vars.DIST_S3_REGION || 'auto' }}

jobs:
  # The gate and the full suite's code tests, before anything a release ships
  # is built: a failure here costs the tests' minutes, not the build's.
  # test-all.yml is called rather than copied: its end-to-end and web checks
  # run the daemon in development mode, which keeps them out of this file
  # (scripts/test/fast/release_lint.sh). It hands on the build id and the run
  # number.
  test:
    name: test
    uses: ./.github/workflows/test-all.yml
    permissions:
      contents: read

  # Everything a release ships, built, checked and stored, in one job: the
  # release credentials reported; the amd64 and then the arm64 daemon with
  # their packages; the two images and the manifest list that indexes them;
  # the Windows clients and their installers; and the build stored by its id.
  # In the `release` environment for the registry token and the signing key;
  # each secret is mapped into the one step that uses it.
  stage:
    name: stage
    needs: test
    runs-on: ubuntu-24.04
    # A warm run takes about 15 minutes; a cold speech cache compiles ONNX
    # Runtime, about 25 minutes for each architecture.
    timeout-minutes: 75
    environment: release
    permissions:
      contents: read
    env:
      BUILD_ID: ${{ needs.test.outputs.build_id }}
      OC_BUILD_ID: ${{ needs.test.outputs.build_id }}
      # The offset run number from test-all.yml, which the Windows binaries
      # carry and the release checks them against; not GITHUB_RUN_NUMBER.
      BUILD_NUM: ${{ needs.test.outputs.run_number }}
      RUN_NUMBER: ${{ needs.test.outputs.run_number }}
      DIST_S3_ENDPOINT: ${{ vars.DIST_S3_ENDPOINT }}
      DIST_MIRROR_BUCKET: ${{ vars.DIST_MIRROR_BUCKET }}
      # The web client the test job built under this build id, taken as it is
      # (mk/web.mk): stage compiles no wasm and needs no Emscripten.
      WEB_PREBUILT: ${{ github.workspace }}/prebuilt/web
    steps:
      # --- The release credentials ------------------------------------------------
      # Reported first, in seconds, so a release-candidate says whether a
      # release of it could publish. They REPORT and never fail: what a
      # release needs beyond what this run itself uses is the release's to
      # have, and the gap is what the summary says.
      - name: required credentials
        env:
          # Mapped in rather than read inline: a secret cannot be tested in an
          # `if:`, and mapping makes the required set one readable list.
          DIST_S3_ACCESS_KEY: ${{ secrets.DIST_S3_ACCESS_KEY }}
          DIST_S3_SECRET_KEY: ${{ secrets.DIST_S3_SECRET_KEY }}
          DIST_BUCKET:        ${{ vars.DIST_BUCKET }}
          DIST_S3_MIRROR_ACCESS_KEY: ${{ secrets.DIST_S3_MIRROR_ACCESS_KEY }}
          DIST_S3_MIRROR_SECRET_KEY: ${{ secrets.DIST_S3_MIRROR_SECRET_KEY }}
          REPO_SIGNING_KEY:   ${{ secrets.REPO_SIGNING_KEY }}
          IMAGE_REPO_BUILD:   ${{ vars.IMAGE_REPO_BUILD }}
          IMAGE_REGISTRY_TOKEN_BUILD: ${{ secrets.IMAGE_REGISTRY_TOKEN_BUILD }}
          TS_ENDPOINT:        ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT:         ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TS_PROFILE:         ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          AZ_TENANT:          ${{ secrets.AZURE_TENANT_ID }}
          AZ_CLIENT:          ${{ secrets.AZURE_CLIENT_ID }}
          AZ_SECRET:          ${{ secrets.AZURE_CLIENT_SECRET }}
          DIST_BASE_URL: ${{ vars.DIST_BASE_URL }}
          DIST_VERIFY_URL: ${{ vars.DIST_VERIFY_URL }}
        run: |
          set -u
          missing=""
          for v in DIST_S3_ACCESS_KEY DIST_S3_SECRET_KEY DIST_S3_ENDPOINT \
                   DIST_BUCKET DIST_S3_MIRROR_ACCESS_KEY DIST_S3_MIRROR_SECRET_KEY \
                   DIST_MIRROR_BUCKET REPO_SIGNING_KEY DIST_BASE_URL DIST_VERIFY_URL \
                   IMAGE_REGISTRY_USER IMAGE_REPO_BUILD IMAGE_REGISTRY_TOKEN_BUILD; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || missing="$missing $v"
          done

          # Authenticode signing is OPTIONAL by design: without it
          # the release ships an unsigned installer and says so. But the six
          # values -- the three naming the signing profile and the three Azure
          # values proving the caller may use it -- are all-or-nothing, since
          # `SIGN` requires all six, so a PARTIAL set is the dangerous state: it
          # reads as configured and silently ships unsigned. Named separately
          # for that reason.
          ts_set=0
          for v in TS_ENDPOINT TS_ACCOUNT TS_PROFILE AZ_TENANT AZ_CLIENT AZ_SECRET; do
            eval "val=\${$v:-}"
            [ -n "$val" ] && ts_set=$((ts_set + 1))
          done

          {
            echo "### Release credentials"
            echo
            if [ -n "$missing" ]; then
              echo "**Missing (required):**"
              for m in $missing; do echo "- \`$m\`"; done
            else
              echo "All required credentials are present."
            fi
            echo
            case "$ts_set" in
              6) echo "Authenticode signing: configured." ;;
              0) echo "Authenticode signing: not configured — the installer ships unsigned, as designed." ;;
              *) echo "Authenticode signing: **PARTIALLY configured ($ts_set of 6)** — signing will be skipped and the installer will ship unsigned. Set all six or none." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ts_set" != 0 ] && [ "$ts_set" != 6 ]; then
            echo "::warning::Authenticode signing is partially configured ($ts_set of 6); the installer will ship unsigned."
          fi

          if [ -z "$missing" ]; then
            echo "all required release credentials present"
            exit 0
          fi

          # A release-candidate REPORTS and continues: it is made whether or
          # not a release could follow.
          echo "::warning::missing release credentials:$missing (a release-candidate reports them and goes on)"
          exit 0

      # The release closes the OC issues it shipped on openchime/openchime with
      # PUBLIC_TOKEN. A token that cannot is found out here, not as a warning
      # after the packages are live: an empty update of an issue changes nothing
      # and adds nothing to its timeline, but is refused without Issues write.
      - name: public tracker
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_TOKEN }}
        run: |
          set -uo pipefail
          r=openchime/openchime
          if [ -n "$GH_TOKEN" ] && n=$(gh api "repos/${r}/issues?state=all&per_page=1" --jq '.[0].number' 2>&1) \
             && out=$(echo '{}' | gh api -X PATCH "repos/${r}/issues/${n}" --input - --jq .number 2>&1); then
            echo "PUBLIC_TOKEN can write issues on openchime/openchime"
            exit 0
          fi
          msg="PUBLIC_TOKEN cannot write issues on openchime/openchime: ${out:-${n:-not set}}"
          # A release-candidate closes nothing: reported, and it goes on.
          echo "::warning::${msg}"

      # The repository is verified at DIST_VERIFY_URL, which is served from the
      # bucket outside this workflow. Nothing in this repository can make that
      # true -- so this REPORTS and never fails: a release is publishable
      # without it, only unreachable at the public URL.
      - name: probe the published base URL
        timeout-minutes: 15
        env:
          DIST_VERIFY_URL: ${{ vars.DIST_VERIFY_URL }}
        run: |
          set -u
          if curl -fsI --max-time 20 "$DIST_VERIFY_URL/openchime-archive-keyring.gpg" >/dev/null 2>&1; then
            echo "verification URL serves: $DIST_VERIFY_URL"
            echo "Verification URL (\`$DIST_VERIFY_URL\`): serving." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$DIST_VERIFY_URL does not serve the archive keyring -- \
          a release would publish, and its smoke would fail."
            {
              echo
              echo "**Verification URL (\`$DIST_VERIFY_URL\`): NOT serving.**"
              echo
              echo "A release would publish, and its smoke would fail."
              echo "The URL is served outside this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # --- The tools and the shared caches -----------------------------------------
      # Every CPU the runner has, for every make below and the makes they
      # start (the Makefile is safe under -j; locally nothing changes).
      - name: Use every CPU for make
        run: echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the release-* tags: the number below, and the prune at the end
      # The number a release of this build takes, from the release-* tags
      # (scripts/release/version.sh), as publish numbers the release-candidate.
      # The packages are wrapped under it here, once, and the release publishes
      # them as they are; prepare and publish refuse a build whose number is not
      # the one they find. Kept beside the packages as candidate/number.
      - id: number
        name: The release number
        timeout-minutes: 3
        run: |
          set -euo pipefail
          n=$(scripts/release/version.sh next)
          mkdir -p candidate
          echo "$n" > candidate/number
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "the packages are wrapped for release-${n}"
      - name: Install build dependencies
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # scripts/build/apt.sh: the mirror rewritten, each apt-get bounded
          # and retried, so a stall fails the step instead of holding the job.
          # bzip2 for the mbedTLS tarball; nasm for libvpx's assembly; xz-utils
          # for the toolchain tarballs; rpm supplies rpmbuild; nsis and
          # python3-pefile for the Windows installer and its check; buildah for
          # the images; gnupg to sign the build. apt.sh fetches only what the
          # runner lacks; rclone, to store the build, comes pinned.
          # apt: nasm, nsis and python3-pefile are not on the runner image
          scripts/build/apt.sh bzip2 rpm nasm xz-utils nsis python3-pefile buildah gnupg
          scripts/build/rclone.sh
          buildah version

      # Every cache is restored once and saved, only when it missed, as soon
      # as the step that builds it has run: a cache saved at the end of the
      # job would be lost to any later failure.
      #
      # The toolchain make fetches pinned (mk/toolchains.mk): zig, whose
      # bundled clang ships glibc stub libraries for every version back to 2.17
      # and links against whichever one it is asked for, regardless of the
      # host's own glibc -- so a 2.34 binary comes off a runner carrying 2.39
      # with no container in the picture, and an arm64 one off an x86 runner.
      # Keyed by the script, which pins the version and the checksum. No
      # Emscripten: the web client the daemon embeds is the test job's
      # (WEB_PREBUILT, above).
      - id: c-toolchains
        name: Restore the toolchains
        uses: actions/cache/restore@v6
        with:
          path: &toolchains-path |
            third_party/zig-0.17.1
          key: &toolchains-key zig-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/zig.sh') }}
      - uses: actions/download-artifact@v8
        with:
          name: web-client
          path: prebuilt/web
      # --- The amd64 daemon and its packages ----------------------------------------
      # Read-aloud's engine and model (ARCH-111), built by make with the same
      # toolchain and glibc target as the daemon: ONNX Runtime compiled from
      # source as one minimal static archive, per architecture; the voice model
      # converted; and voice input's recognizer files, fetched as published
      # (ARCH-112). Functions of the files in the key, so a hit skips about 25
      # minutes and a change rebuilds. One cache per architecture, both with
      # the same path list (a cache's path list is part of its version): what
      # an architecture never builds is simply absent from what it saves.
      - id: c-tts-amd64
        name: Restore the amd64 speech engine and models
        uses: actions/cache/restore@v6
        with:
          path: &tts-release-path |
            third_party/onnxruntime-1.30.0
            third_party/onnxruntime-1.30.0-aarch64
            third_party/onnxruntime-1.30.0-build/out/MinSizeRel/_deps/protobuf-build/protoc*
            third_party/llamacpp-0.5.0
            third_party/llamacpp-0.5.0-aarch64
            build/kitten
            build/moonshine
          key: &tts-amd64-key tts-release-amd64-zig0.17.1-${{ hashFiles('scripts/build/onnxruntime.sh', 'scripts/build/llamacpp.sh', 'scripts/release/zig_cc.sh', 'daemon/ort.ops.config', 'scripts/build/kitten.sh', 'scripts/build/tts_convert.c', 'scripts/build/moonshine.sh') }}
      # mbedTLS and libopus as the release builds them: with zig's clang
      # against glibc 2.34 for the binary that ships. CI's copies are
      # gcc-built for the host and cannot stand in, so these have caches of
      # their own, one per library and architecture, keyed by the version, the
      # script that builds it and the compiler wrapper and toolchain it builds
      # with. A hit is a no-op build: each script returns at once when its
      # archive already exists.
      - id: c-mbedtls-amd64
        name: Restore the amd64 release's mbedTLS
        uses: actions/cache/restore@v6
        with:
          path: &mbedtls-amd64-path third_party/mbedtls-3.6.2
          key: &mbedtls-amd64-key mbedtls-3.6.2-release-amd64-zig0.17.1-${{ hashFiles('scripts/build/mbedtls.sh', 'scripts/release/zig_cc.sh', 'scripts/build/zig.sh') }}
      - id: c-opus-amd64
        name: Restore the amd64 release's opus
        uses: actions/cache/restore@v6
        with:
          path: &opus-amd64-path third_party/opus-1.6.1
          key: &opus-amd64-key opus-1.6.1-release-amd64-zig0.17.1-${{ hashFiles('scripts/build/opus.sh', 'scripts/release/zig_cc.sh', 'scripts/build/zig.sh') }}
      # RELEASE=1: zig's clang against glibc 2.34 for the host's architecture,
      # every vendored library built the same way, the binary stripped at the
      # link. No header comes from the host: libc's are zig's (the runner's
      # glibc 2.39 headers would redirect strtol to __isoc23_strtol, a 2.38
      # symbol the 2.34 stubs do not have), and SQLite is vendored. One binary
      # per architecture; everything downstream consumes this exact file,
      # copied with its read-aloud and voice-input data and the web client's
      # wasm into DIST, and packaged there: the .rpm, the .deb and the tarball,
      # under the release number above, which the release publishes as they are
      # (release.yml).
      - id: build-amd64
        name: make build-all PART=packages (amd64)
        env:
          VERSION: ${{ steps.number.outputs.n }}
          DIST: dist/linux-amd64
        run: make build-all PART=packages ARCH=x86_64 DIST="$DIST" PKG_VERSION="$VERSION" OC_BUILD_ID="$BUILD_ID"
      # Saved as soon as the build has run, whether or not the job goes on to
      # pass: every run that failed downstream of the engine build used to
      # pay the twenty minutes again. The scripts leave a half-made archive or
      # model in a .new directory, never under these paths, so what is saved
      # is whole.
      - name: Save the amd64 speech engine and models
        if: always() && steps.build-amd64.outcome != 'skipped' && steps.c-tts-amd64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *tts-release-path
          key: *tts-amd64-key
      - name: Save the amd64 release's mbedTLS
        if: steps.c-mbedtls-amd64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *mbedtls-amd64-path
          key: *mbedtls-amd64-key
      - name: Save the amd64 release's opus
        if: steps.c-opus-amd64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *opus-amd64-path
          key: *opus-amd64-key
      - name: Save the toolchains
        if: steps.c-toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *toolchains-path
          key: *toolchains-key
      # What the release ships, checked (scripts/test/full/, docs/TESTING.md):
      # the glibc floor, one binary in all three packages, speech on the
      # release binary, the .deb installed and speaking, and its unit file.
      - name: make test-all PART=packages (amd64)
        env:
          VERSION: ${{ steps.number.outputs.n }}
          DIST: dist/linux-amd64
        run: make test-all PART=packages ARCH=x86_64 DIST="$DIST" PKG_VERSION="$VERSION"
      # What the build keeps: the binary and the data beside it, as one
      # tree under a directory named for the build, which is what the image
      # is laid from (packaging/image-context.sh) and what a release packages
      # under its number. The placeholder packages above are not kept. The
      # licence file is assembled here, where the vendored texts are
      # (packaging/licenses.sh); the release packages from this tree on a
      # runner that has none.
      - name: Keep the built tree (amd64)
        env:
          DIST: dist/linux-amd64
          PLATFORM: linux-amd64
        run: |
          set -euo pipefail
          name="openchimed-build-${BUILD_ID}-${PLATFORM}"
          mkdir -p "tree/$name"
          cp -r "$DIST/openchimed" "$DIST/tts" "$DIST/stt" "$DIST/web" "tree/$name/"
          packaging/licenses.sh third_party/mbedtls-3.6.2 > "tree/$name/copyright"
          mkdir -p "candidate/$PLATFORM"
          tar -C tree --sort=name --owner=0 --group=0 --numeric-owner --mtime="@0" \
            -czf "candidate/$PLATFORM/$name.tar.gz" "$name"
          # The packages, wrapped under the release number and tested above:
          # what the release publishes, as they are.
          mkdir -p "candidate/$PLATFORM/packages"
          cp "$DIST"/*.deb "$DIST"/*.rpm "$DIST"/*.tar.gz "$DIST"/*.sha256 "candidate/$PLATFORM/packages/"
          ls -l "candidate/$PLATFORM" "candidate/$PLATFORM/packages"

      # --- The arm64 daemon and its packages ----------------------------------------
      # Cross-built with zig on this x86 runner (make ARCH=aarch64), into
      # directories of its own (third_party/<name>-aarch64, build/aarch64).
      # Build only: the binary is packaged and shipped, never run here; what
      # runs (the render, the install) runs for amd64 alone. It writes its data
      # manifests with a featureless HOST daemon, built with the runner's gcc
      # (mk/daemon.mk), which links the host's mbedTLS from
      # third_party/mbedtls-3.6.2 -- where the amd64 release's zig-built copy
      # is now. So the amd64 release's own libraries are set aside first, and
      # the gcc-built host mbedTLS restored in their place, from the cache
      # test-all.yml saves under the same key: the arm64 build then sees
      # exactly what it saw on a runner of its own, and the arm64 speech cache
      # saves only what is its own.
      - name: Set the amd64 release's libraries aside
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amd64"
          for d in mbedtls-3.6.2 onnxruntime-1.30.0 llamacpp-0.5.0; do
            if [ -e "third_party/$d" ]; then mv "third_party/$d" "$RUNNER_TEMP/amd64/"; fi
          done
      - id: c-tts-arm64
        name: Restore the arm64 speech engine and models
        uses: actions/cache/restore@v6
        with:
          path: *tts-release-path
          key: &tts-arm64-key tts-release-arm64-zig0.17.1-${{ hashFiles('scripts/build/onnxruntime.sh', 'scripts/build/llamacpp.sh', 'scripts/release/zig_cc.sh', 'daemon/ort.ops.config', 'scripts/build/kitten.sh', 'scripts/build/tts_convert.c', 'scripts/build/moonshine.sh') }}
      - id: c-mbedtls-arm64
        name: Restore the arm64 release's mbedTLS
        uses: actions/cache/restore@v6
        with:
          path: &mbedtls-arm64-path third_party/mbedtls-3.6.2-aarch64
          key: &mbedtls-arm64-key mbedtls-3.6.2-release-arm64-zig0.17.1-${{ hashFiles('scripts/build/mbedtls.sh', 'scripts/release/zig_cc.sh', 'scripts/build/zig.sh') }}
      - id: c-opus-arm64
        name: Restore the arm64 release's opus
        uses: actions/cache/restore@v6
        with:
          path: &opus-arm64-path third_party/opus-1.6.1-aarch64
          key: &opus-arm64-key opus-1.6.1-release-arm64-zig0.17.1-${{ hashFiles('scripts/build/opus.sh', 'scripts/release/zig_cc.sh', 'scripts/build/zig.sh') }}
      - id: c-mbedtls-host
        name: Restore the host's mbedTLS
        uses: actions/cache/restore@v6
        with:
          path: &mbedtls-host-path third_party/mbedtls-3.6.2
          key: &mbedtls-host-key mbedtls-3.6.2-${{ runner.os }}-24.04-${{ runner.arch }}-gcc-${{ hashFiles('scripts/build/mbedtls.sh') }}
      - id: build-arm64
        name: make build-all PART=packages (arm64)
        env:
          VERSION: ${{ steps.number.outputs.n }}
          DIST: dist/linux-arm64
          # What the vendored-library scripts call the architecture, for the
          # licence file assembled outside make (packaging/licenses.sh).
          OC_ARCH: aarch64
        run: make build-all PART=packages ARCH=aarch64 DIST="$DIST" PKG_VERSION="$VERSION" OC_BUILD_ID="$BUILD_ID" MANIFEST_HOST_BIN="$PWD/dist/linux-amd64/openchimed"
      - name: Save the arm64 speech engine and models
        if: always() && steps.build-arm64.outcome != 'skipped' && steps.c-tts-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *tts-release-path
          key: *tts-arm64-key
      - name: Save the arm64 release's mbedTLS
        if: steps.c-mbedtls-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *mbedtls-arm64-path
          key: *mbedtls-arm64-key
      - name: Save the arm64 release's opus
        if: steps.c-opus-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *opus-arm64-path
          key: *opus-arm64-key
      - name: Save the host's mbedTLS
        if: steps.c-mbedtls-host.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *mbedtls-host-path
          key: *mbedtls-host-key
      # On arm64, built on this x86 runner, the checks that run the binary say
      # so and skip.
      - name: make test-all PART=packages (arm64)
        env:
          VERSION: ${{ steps.number.outputs.n }}
          DIST: dist/linux-arm64
          OC_ARCH: aarch64
        run: make test-all PART=packages ARCH=aarch64 DIST="$DIST" PKG_VERSION="$VERSION"
      # The licence file from the arm64 build's own copies of the vendored
      # texts (OC_ARCH).
      - name: Keep the built tree (arm64)
        env:
          DIST: dist/linux-arm64
          PLATFORM: linux-arm64
          OC_ARCH: aarch64
        run: |
          set -euo pipefail
          name="openchimed-build-${BUILD_ID}-${PLATFORM}"
          mkdir -p "tree/$name"
          cp -r "$DIST/openchimed" "$DIST/tts" "$DIST/stt" "$DIST/web" "tree/$name/"
          packaging/licenses.sh third_party/mbedtls-3.6.2 > "tree/$name/copyright"
          mkdir -p "candidate/$PLATFORM"
          tar -C tree --sort=name --owner=0 --group=0 --numeric-owner --mtime="@0" \
            -czf "candidate/$PLATFORM/$name.tar.gz" "$name"
          # The packages, wrapped under the release number and tested above:
          # what the release publishes, as they are.
          mkdir -p "candidate/$PLATFORM/packages"
          cp "$DIST"/*.deb "$DIST"/*.rpm "$DIST"/*.tar.gz "$DIST"/*.sha256 "candidate/$PLATFORM/packages/"
          ls -l "candidate/$PLATFORM" "candidate/$PLATFORM/packages"

      # --- The images ---------------------------------------------------------------
      # Built with buildah, not docker, from each kept tree: the image is the
      # released binary and its data laid onto a glibc base (Dockerfile), with
      # no compile and no RUN step inside it, so the arm64 image comes off the
      # x86 runner with `--arch arm64` and no emulation (`make build-all
      # PART=image`, mk/full.mk). The context is the extracted tarball plus the
      # entrypoint -- exactly what an operator extracting the release would
      # have -- and the pinned Litestream for the architecture, checked against
      # its published digest (packaging/image-context.sh, ARCH-3); the
      # entrypoint writes its configuration at boot. The per-architecture tags
      # are an implementation detail, and nothing is tagged as a release until
      # a release copies the manifest list to :N (release.yml). Pushed under
      # the build id to the build repository, IMAGE_REPO_BUILD, every time: a
      # build is complete only with its image there. The registry takes basic
      # auth, the IMAGE_REGISTRY_USER variable and IMAGE_REGISTRY_TOKEN_BUILD
      # in the `release` environment. The image starts and answers /healthz,
      # and its database replicates and restores (scripts/test/full/image.sh,
      # db_restore.sh); the arm64 image is not for this runner, and the checks
      # say so and skip. Each digest is buildah's own report of what it pushed
      # (--digestfile): nothing reads the tag back, since a registry does not
      # always serve a tag the moment its push finishes.
      - name: Log in to the build repository
        timeout-minutes: 15
        env:
          TOKEN: ${{ secrets.IMAGE_REGISTRY_TOKEN_BUILD }}
        run: |
          set -euo pipefail
          [ -n "$BUILD_IMAGE" ] || { echo "::error::the IMAGE_REPO_BUILD variable is not set"; exit 1; }
          [ -n "$TOKEN" ] || { echo "::error::IMAGE_REGISTRY_TOKEN_BUILD is not set in the release environment"; exit 1; }
          printf '%s' "$TOKEN" | buildah login -u "$IMAGE_REGISTRY_USER" --password-stdin "${BUILD_IMAGE%%/*}"
      - name: make build-all PART=image (amd64)
        env:
          ARCH: amd64
        run: |
          set -euo pipefail
          make build-all PART=image PKG_ARCH="$ARCH" IMAGE="${BUILD_IMAGE}:build-${BUILD_ID}-${ARCH}" \
            IMAGE_TREE="candidate/linux-${ARCH}/openchimed-build-${BUILD_ID}-linux-${ARCH}.tar.gz"
      - name: make test-all PART=image (amd64)
        run: make test-all PART=image IMAGE="${BUILD_IMAGE}:build-${BUILD_ID}-amd64"
      - name: Push the amd64 image
        timeout-minutes: 15
        env:
          ARCH: amd64
        run: &push-image |
          set -euo pipefail
          mkdir -p image-digest
          buildah push --digestfile "image-digest/${ARCH}" "${BUILD_IMAGE}:build-${BUILD_ID}-${ARCH}"
          d=$(tr -d '[:space:]' < "image-digest/${ARCH}")
          [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::buildah reported no digest for ${ARCH} (${d:-nothing})"; exit 1; }
          echo "pushed ${BUILD_IMAGE}:build-${BUILD_ID}-${ARCH}: ${d}"
      - name: make build-all PART=image (arm64)
        env:
          ARCH: arm64
        run: |
          set -euo pipefail
          make build-all PART=image PKG_ARCH="$ARCH" IMAGE="${BUILD_IMAGE}:build-${BUILD_ID}-${ARCH}" \
            IMAGE_TREE="candidate/linux-${ARCH}/openchimed-build-${BUILD_ID}-linux-${ARCH}.tar.gz"
      - name: make test-all PART=image (arm64)
        run: make test-all PART=image IMAGE="${BUILD_IMAGE}:build-${BUILD_ID}-arm64"
      - name: Push the arm64 image
        timeout-minutes: 15
        env:
          ARCH: arm64
        run: *push-image
      # :build-<id> only; a release copies it to :N and moves :latest, in the
      # build repository and the optional second one (release.yml). Each
      # architecture by the digest its push reported, never by the tag it just
      # wrote; the list's own digest is buildah's report of what it pushed.
      - timeout-minutes: 15
        id: manifest
        name: Publish the manifest list
        run: |
          set -euo pipefail
          buildah manifest create "${BUILD_IMAGE}:build-${BUILD_ID}"
          for a in amd64 arm64; do
            d=$(tr -d '[:space:]' < "image-digest/${a}")
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no pushed digest for ${a} (${d:-nothing})"; exit 1; }
            buildah manifest add "${BUILD_IMAGE}:build-${BUILD_ID}" "docker://${BUILD_IMAGE}@${d}"
            echo "${a}=${d}" >> "$GITHUB_OUTPUT"
          done
          buildah manifest push --all --digestfile list.digest "${BUILD_IMAGE}:build-${BUILD_ID}" "docker://${BUILD_IMAGE}:build-${BUILD_ID}"
          list=$(tr -d '[:space:]' < list.digest)
          [[ "$list" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::buildah reported no digest for the manifest list (${list:-nothing})"; exit 1; }
          echo "pushed ${BUILD_IMAGE}:build-${BUILD_ID}: ${list}"
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      # --- The Windows clients ------------------------------------------------------
      # The Windows client (ARCH-80/81). It carries the same build id as the
      # daemon even though it is a separate program, so a support question only
      # ever needs one identifier. The binaries cross-compile on Linux with the
      # pinned llvm-mingw make fetches (mk/toolchains.mk); the installer and the
      # MSIX are built from them, on Linux too (NSIS and makemsix,
      # packaging/build-windows.sh), unsigned, under a placeholder version, and
      # not kept: they are built only to prove they build and carry what they
      # should. A release signs the same binaries and wraps them under its
      # number (release.yml), since the installer embeds the signed files. The
      # Windows libraries have a cache each, keyed by the version, the script
      # that builds it and the toolchain.
      - id: c-mingw
        name: Restore the Windows toolchain
        uses: actions/cache/restore@v6
        with:
          path: &mingw-path third_party/llvm-mingw-20261020
          key: &mingw-key toolchain-mingw-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/llvm_mingw.sh') }}
      - id: c-win-mbedtls
        name: Restore mbedTLS for Windows
        uses: actions/cache/restore@v6
        with:
          path: &win-mbedtls-path third_party/mbedtls-3.6.2-win
          key: &win-mbedtls-key mbedtls-3.6.2-win-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/mbedtls_windows.sh', 'scripts/build/llvm_mingw.sh') }}
      - id: c-win-libvpx
        name: Restore libvpx for Windows
        uses: actions/cache/restore@v6
        with:
          path: &win-libvpx-path third_party/libvpx-1.17.0-win
          key: &win-libvpx-key libvpx-1.17.0-win-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/libvpx.sh', 'scripts/build/llvm_mingw.sh') }}
      - id: c-win-opus
        name: Restore opus for Windows
        uses: actions/cache/restore@v6
        with:
          path: &win-opus-path third_party/opus-1.6.1-win
          key: &win-opus-key opus-1.6.1-win-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/opus.sh', 'scripts/build/llvm_mingw.sh') }}
      - id: c-win-speexdsp
        name: Restore speexdsp for Windows
        uses: actions/cache/restore@v6
        with:
          path: &win-speexdsp-path third_party/speexdsp-1.2.1-win
          key: &win-speexdsp-key speexdsp-1.2.1-win-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/speexdsp.sh', 'scripts/build/llvm_mingw.sh') }}
      - id: c-win-sdl3
        name: Restore SDL3 for Windows
        uses: actions/cache/restore@v6
        with:
          path: &win-sdl3-path third_party/sdl3-3.4.14-win
          key: &win-sdl3-key sdl3-3.4.14-win-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/sdl3_windows.sh', 'scripts/build/llvm_mingw.sh') }}
      # makemsix is built from pinned source on first use (scripts/build/
      # makemsix.sh), and kept by that script's hash; release.yml restores it
      # under the same key.
      - id: c-makemsix
        name: Restore makemsix
        uses: actions/cache/restore@v6
        with:
          path: &makemsix-path third_party/makemsix-*
          key: &makemsix-key makemsix-${{ runner.os }}-24.04-${{ hashFiles('scripts/build/makemsix.sh') }}
      - name: make build-all PART=windows
        env:
          DIST: dist/windows-x64
        run: make build-all PART=windows OC_BUILD_ID="$BUILD_ID" OC_BUILD_NUM="$BUILD_NUM" PKG_VERSION=0 WIN_DIST="$DIST"
      - name: Save the Windows toolchain
        if: steps.c-mingw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *mingw-path
          key: *mingw-key
      - name: Save mbedTLS for Windows
        if: steps.c-win-mbedtls.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *win-mbedtls-path
          key: *win-mbedtls-key
      - name: Save libvpx for Windows
        if: steps.c-win-libvpx.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *win-libvpx-path
          key: *win-libvpx-key
      - name: Save opus for Windows
        if: steps.c-win-opus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *win-opus-path
          key: *win-opus-key
      - name: Save speexdsp for Windows
        if: steps.c-win-speexdsp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *win-speexdsp-path
          key: *win-speexdsp-key
      - name: Save SDL3 for Windows
        if: steps.c-win-sdl3.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *win-sdl3-path
          key: *win-sdl3-key
      - name: Save makemsix
        if: steps.c-makemsix.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *makemsix-path
          key: *makemsix-key
      # The binaries name this build (BUILD_ID and BUILD_NUM, above), and the
      # installer and the MSIX are what ships (scripts/test/full/windows.sh).
      - name: make test-all PART=windows
        env:
          DIST: dist/windows-x64
        run: make test-all PART=windows PKG_VERSION=0 WIN_DIST="$DIST"
      # The unpackaged compiler outputs, beside the Linux trees for the store
      # below; never a release artifact.
      - name: Keep the Windows binaries
        run: |
          set -euo pipefail
          mkdir -p candidate/windows-x64
          cp build/openchime.exe build/openchime-tui.exe build/openchime.debug candidate/windows-x64/
          ls -l candidate/windows-x64

      # --- The build, stored ----------------------------------------------------------
      # The build, stored by its build id: every tree and binary under
      # candidates/<id>/ in the mirror bucket, with a manifest naming each
      # file's sha256 and the images' digests, signed with the repository
      # signing key. The manifest exists only once every step above passed, so
      # a stored manifest is a build that passed the full suite: publish reads
      # it back before it tags anything, and a release fetches this directory
      # and verifies it before it packages anything
      # (scripts/release/verify_candidate.sh). The bucket is the one copy; no
      # workflow artifact of it is kept, so nothing about a build expires with
      # a run. A second run of the same commit -- only possible when an
      # earlier one stopped before its release-candidate was tagged, which the
      # gate checks -- stores its build again over the first's.
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::REPO_SIGNING_KEY is not set; a build cannot be signed"; exit 1; }
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Configure rclone for the mirror bucket
        timeout-minutes: 5
        env:
          DIST_S3_MIRROR_ACCESS_KEY: ${{ secrets.DIST_S3_MIRROR_ACCESS_KEY }}
          DIST_S3_MIRROR_SECRET_KEY: ${{ secrets.DIST_S3_MIRROR_SECRET_KEY }}
        run: |
          set -euo pipefail
          for v in DIST_S3_ENDPOINT DIST_S3_MIRROR_ACCESS_KEY DIST_S3_MIRROR_SECRET_KEY DIST_MIRROR_BUCKET; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [dist-mirror]
          type = s3
          provider = Other
          access_key_id = ${DIST_S3_MIRROR_ACCESS_KEY}
          secret_access_key = ${DIST_S3_MIRROR_SECRET_KEY}
          endpoint = ${DIST_S3_ENDPOINT}
          region = ${DIST_S3_REGION}
          EOF
      # The images' digests are the ones their pushes reported, not read back
      # from the tags those pushes wrote.
      - name: Write and sign the manifest
        timeout-minutes: 5
        env:
          AMD64: ${{ steps.manifest.outputs.amd64 }}
          ARM64: ${{ steps.manifest.outputs.arm64 }}
          LIST: ${{ steps.manifest.outputs.list }}
        run: |
          set -euo pipefail
          for d in "$AMD64" "$ARM64" "$LIST"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::an image digest is missing from the manifest list step (${d:-nothing})"; exit 1; }
          done
          find candidate -type f | sort
          images="build-${BUILD_ID}-amd64=${AMD64} build-${BUILD_ID}-arm64=${ARM64} build-${BUILD_ID}=${LIST}"
          scripts/release/candidate_manifest.sh write candidate "$BUILD_ID" "$GITHUB_SHA" "$RUN_NUMBER" "$GITHUB_RUN_ID" $images
          scripts/release/candidate_manifest.sh sign candidate
          scripts/release/candidate_manifest.sh verify candidate "$BUILD_ID"
      - name: Store the build
        timeout-minutes: 15
        run: |
          set -euo pipefail
          dest="dist-mirror:${DIST_MIRROR_BUCKET}/candidates/${BUILD_ID}"
          # The manifest last, its signature just before it: a store cut off
          # part way leaves files and no manifest, which nothing reads as a
          # build, never a manifest naming files that are not there.
          rclone copy candidate "$dest" --fast-list --exclude '/manifest.json*'
          rclone copyto candidate/manifest.json.asc "${dest}/manifest.json.asc"
          rclone copyto candidate/manifest.json "${dest}/manifest.json"
          echo "stored candidates/${BUILD_ID} in ${DIST_MIRROR_BUCKET}"
          {
            echo "### Build \`${BUILD_ID}\`"
            echo
            echo "- commit \`${GITHUB_SHA}\`, run ${RUN_NUMBER}"
            echo "- \`candidates/${BUILD_ID}/\` in \`${DIST_MIRROR_BUCKET}\`"
            echo "- image \`${BUILD_IMAGE}:build-${BUILD_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # Builds stored more than thirty days ago that no release-* tag names are
      # deleted; the tags say which build ids were released, or are standing
      # release-candidates, and those stay. The age is the manifest's own
      # `created`, never the bucket's idea of a directory's time, which an
      # object store does not keep. The build this run stored is never pruned,
      # and a directory with no manifest (a store still running, or one that
      # stopped half way) is left alone. A failure here is a warning: the
      # build is stored either way.
      - name: Prune old builds
        timeout-minutes: 15
        id: prune
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          released=$(git tag -l 'release-*' | while read -r t; do git rev-parse "${t}^{commit}" | cut -c1-7; done | sort -u)
          rm -rf "$RUNNER_TEMP/manifests"
          rclone copy "dist-mirror:${DIST_MIRROR_BUCKET}/candidates" "$RUNNER_TEMP/manifests" \
            --include '/*/manifest.json' --fast-list
          python3 -I - "$RUNNER_TEMP/manifests" "$BUILD_ID" > "$RUNNER_TEMP/old.txt" <<'PY'
          import datetime, json, os, sys
          root, current = sys.argv[1:]
          now = datetime.datetime.now(datetime.timezone.utc)
          for name in sorted(os.listdir(root)):
              if name == current:
                  continue
              try:
                  m = json.load(open(os.path.join(root, name, "manifest.json")))
                  t = datetime.datetime.strptime(m["created"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc)
              except (OSError, ValueError, KeyError) as e:
                  print(f"prune: {name}: unreadable manifest ({e}); left alone", file=sys.stderr)
                  continue
              if (now - t).days > 30:
                  print(name)
          PY
          while read -r id; do
            [ -n "$id" ] || continue
            if grep -qxF -- "$id" <<<"$released"; then echo "keeping released $id"; continue; fi
            echo "pruning build $id"
            rclone purge "dist-mirror:${DIST_MIRROR_BUCKET}/candidates/${id}"
          done < "$RUNNER_TEMP/old.txt"
          echo "pruned"
      - name: Report a failed prune
        if: steps.prune.outcome == 'failure'
        run: echo "::warning::old builds were not pruned; the build is stored. The next release-candidate prunes again."

  # The release-candidate, published in this repository: this run's build,
  # read back from the mirror bucket and verified, then its commit tagged
  # release-N-rcK and a prerelease of that tag made with the build's files: the
  # Linux trees, the Windows binaries and the GUI's debug symbols, exactly as
  # stored. N is the number the next release would take
  # (scripts/release/version.sh, which counts release-N tags only); K is one
  # past the highest release-candidate already tagged for N. The tag is pushed
  # with the deploy key and the prerelease made with the job's own token. Last,
  # the copy to the public repository, as steps of the same job.
  #
  # Serialised with release.yml, whose runs share the `release` group: a
  # release removes the release-candidates of its number when it finishes, so
  # one tagged for that number while it ran would go with them; and two
  # release-candidates numbered at once would both take the same K. The
  # commit is asked again inside the group, so a release that finished while
  # this run built is seen.
  publish:
    name: publish
    needs: [test, stage]
    runs-on: ubuntu-24.04
    environment: release
    # About 3 minutes.
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      SHA: ${{ github.sha }}
      BUILD_ID: ${{ needs.test.outputs.build_id }}
      DIST_S3_ENDPOINT:          ${{ vars.DIST_S3_ENDPOINT }}
      DIST_MIRROR_BUCKET:        ${{ vars.DIST_MIRROR_BUCKET }}
      PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Tags are pushed with the deploy key: a tag ruleset lets only the deploy
      # key create, move or delete a release-* tag.
      - name: Push with the deploy key
        timeout-minutes: 10
        env:
          KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::error::RELEASE_SSH_KEY is not set in the release environment"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/release_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
      # On the runner image already, so apt.sh fetches nothing; rclone pinned.
      - name: Install tooling
        timeout-minutes: 5
        run: |
          # apt: a check only; gnupg and skopeo are on the runner image
          scripts/build/apt.sh gnupg skopeo
          scripts/build/rclone.sh
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::REPO_SIGNING_KEY is not set; the build cannot be verified"; exit 1; }
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Configure rclone for the mirror bucket
        timeout-minutes: 5
        env:
          DIST_S3_MIRROR_ACCESS_KEY: ${{ secrets.DIST_S3_MIRROR_ACCESS_KEY }}
          DIST_S3_MIRROR_SECRET_KEY: ${{ secrets.DIST_S3_MIRROR_SECRET_KEY }}
        run: |
          set -euo pipefail
          for v in DIST_S3_ENDPOINT DIST_S3_MIRROR_ACCESS_KEY DIST_S3_MIRROR_SECRET_KEY DIST_MIRROR_BUCKET; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [dist-mirror]
          type = s3
          provider = Other
          access_key_id = ${DIST_S3_MIRROR_ACCESS_KEY}
          secret_access_key = ${DIST_S3_MIRROR_SECRET_KEY}
          endpoint = ${DIST_S3_ENDPOINT}
          region = ${DIST_S3_REGION}
          EOF

      # The commit, asked again now that the number is this run's to take: not
      # released, and one main can take as its next release
      # (scripts/release/main_next.sh); still on staging, though staging may
      # have moved on while this run built. Then the build this run stored,
      # read back from the bucket and verified as release.yml will verify it
      # (scripts/release/verify_candidate.sh): the manifest's signature and
      # every file, the commit it records, the build id the daemon reports,
      # and the image's digest.
      - name: Verify the commit and the stored build
        timeout-minutes: 10
        env:
          IMAGE_REGISTRY_TOKEN_BUILD: ${{ secrets.IMAGE_REGISTRY_TOKEN_BUILD }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/staging:refs/remotes/origin/staging"
          git merge-base --is-ancestor "$SHA" origin/staging || {
            echo "::error::${SHA:0:7} is no longer on staging"; exit 1; }
          released=$(git tag --points-at "$SHA" | grep -E '^release-[0-9]+$' || true)
          [ -z "$released" ] || { echo "::error::${SHA:0:7} is already ${released}"; exit 1; }
          rc=0; scripts/release/main_next.sh release "$SHA" "$(scripts/release/version.sh next)" >/dev/null || rc=$?
          [ "$rc" -eq 0 ] || {
            echo "::error::main cannot take ${SHA:0:7} as its next release (above)"; exit 1; }
          scripts/release/verify_candidate.sh "$BUILD_ID" "$SHA" rc

      # A release-candidate tag already on this commit is reused, so re-running
      # this job after a failure finishes that release-candidate instead of
      # numbering the same commit twice.
      - name: Number the release-candidate
        timeout-minutes: 5
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          N=$(scripts/release/version.sh next)
          # The packages were wrapped under stage's number; a release that
          # landed since would make them name another release.
          [ "$(cat rc/number)" = "$N" ] || {
            echo "::error::the build's packages are for release-$(cat rc/number), but the next release is ${N}; make a new release-candidate"; exit 1; }
          rcs=$( { git tag -l "release-${N}-rc*" | grep -E "^release-${N}-rc[0-9]+$" || true; } \
                 | sed "s/^release-${N}-rc//" | sort -n)
          K=""
          for k in $rcs; do
            if [ "$(git rev-parse "release-${N}-rc${k}^{commit}")" = "$SHA" ]; then K="$k"; fi
          done
          if [ -n "$K" ]; then
            echo "release-${N}-rc${K} is already on ${SHA:0:7}; finishing it"
          else
            K=$(( $(printf '%s\n' $rcs | tail -1 | grep -E '^[0-9]+$' || echo 0) + 1 ))
          fi
          TAG="release-${N}-rc${K}"
          echo "number=$N" >> "$GITHUB_OUTPUT"
          echo "k=$K" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "this release-candidate is ${TAG}: build ${BUILD_ID} (${SHA})"

      - name: Tag the commit
        timeout-minutes: 5
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} is already tagged"
          else
            git tag -f "$TAG" "$SHA"
            git push origin "refs/tags/${TAG}"
          fi
          echo "${TAG} is ${SHA:0:7}"

      # The image the build's manifest records, copied by digest to :N-rcK and,
      # unless a later release-candidate for N already exists, to :rc. A re-run
      # of an older release-candidate therefore never moves :rc back. Build
      # repository only; nothing reads back a tag just written
      # (scripts/release/copy_image.sh).
      - name: Tag the image as the release-candidate
        timeout-minutes: 10
        env:
          N: ${{ steps.tag.outputs.number }}
          K: ${{ steps.tag.outputs.k }}
          IMAGE_REGISTRY_TOKEN_BUILD: ${{ secrets.IMAGE_REGISTRY_TOKEN_BUILD }}
        run: |
          set -euo pipefail
          creds="${IMAGE_REGISTRY_USER}:${IMAGE_REGISTRY_TOKEN_BUILD}"
          want=$(python3 -c 'import json,sys; print(json.load(open("rc/manifest.json"))["images"]["build-'"$BUILD_ID"'"])')
          scripts/release/copy_image.sh "$creds" "${BUILD_IMAGE}@${want}" "$creds" "${BUILD_IMAGE}:${N}-rc${K}" >/dev/null
          echo "${BUILD_IMAGE}:${N}-rc${K} -> ${want}"
          newest=$( { git tag -l "release-${N}-rc*" | grep -E "^release-${N}-rc[0-9]+$" || true; } \
                    | sed "s/^release-${N}-rc//" | sort -n | tail -1)
          if [ "${newest:-0}" -gt "$K" ]; then
            echo "release-${N}-rc${newest} is newer: :rc stays where it is"
          else
            scripts/release/copy_image.sh "$creds" "${BUILD_IMAGE}@${want}" "$creds" "${BUILD_IMAGE}:rc" >/dev/null
            echo "${BUILD_IMAGE}:rc -> ${want}"
          fi

      - name: Publish the release-candidate's files
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          N: ${{ steps.tag.outputs.number }}
          K: ${{ steps.tag.outputs.k }}
        run: |
          set -euo pipefail
          find rc -type f | sort
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "${TAG} is already published"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "$TAG" \
              --notes "Release-candidate ${K} for release-${N}: build ${BUILD_ID}, commit ${SHA}. If it is released, release-${N} carries these same files." \
              rc/linux-*/*.tar.gz rc/windows-x64/*.exe rc/windows-x64/openchime.debug
          fi
          # The earlier release-candidates for this number stay, named as
          # superseded, until release-N removes them all.
          for t in $( { git tag -l "release-${N}-rc*" | grep -E "^release-${N}-rc[0-9]+$" || true; } | grep -vx "$TAG" || true); do
            gh release edit "$t" -R "$GITHUB_REPOSITORY" --title "$t (superseded by $TAG)" >/dev/null \
              || echo "::warning::could not mark ${t} superseded"
          done

      - name: Summary
        timeout-minutes: 5
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### Release-candidate \`${TAG}\`"
            echo
            echo "- build \`${BUILD_ID}\`, commit \`${SHA}\`"
            echo "- image \`${BUILD_IMAGE}:${TAG#release-}\`, and \`:rc\` unless a later release-candidate holds it"
            echo "- to release it: \`gh workflow run release.yml --ref ${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- The copy to the public repository ------------------------------------------
      # The release-candidate, copied to the public repository (the PUBLIC_REPO
      # variable; skipped when it is unset): the commit to its staging, the
      # tag, and a prerelease with the same files, title and notes, read back
      # from the prerelease just made here (`gh release download`). A copy and
      # nothing more: nothing here or in release.yml reads it back, so a
      # failure is a warning, never a failed run (continue-on-error on each
      # step, each step only after the one before it succeeded). It reads
      # nothing from that repository but whether the tag and the release are
      # already there, so a re-run completes it. The staging push is plain,
      # never forced: a push that is not a fast-forward is refused. Pushes use
      # PUBLIC_DEPLOY_KEY, a write deploy key there; the release is made with
      # PUBLIC_TOKEN (contents write there). Both are in the `release`
      # environment.
      - timeout-minutes: 10
        id: pub-key
        name: Set up the public deploy key
        if: env.PUBLIC_REPO != ''
        continue-on-error: true
        env:
          KEY: ${{ secrets.PUBLIC_DEPLOY_KEY }}
          TOKEN: ${{ secrets.PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::warning::PUBLIC_DEPLOY_KEY is not set in the release environment; nothing copied to ${PUBLIC_REPO}"; exit 1; }
          [ -n "$TOKEN" ] || { echo "::warning::PUBLIC_TOKEN is not set in the release environment; nothing copied to ${PUBLIC_REPO}"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/public_key
          chmod 600 ~/.ssh/public_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/public_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - timeout-minutes: 5
        id: pub-push
        name: Push the commit to staging and the tag there
        if: steps.pub-key.outcome == 'success'
        continue-on-error: true
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          remote="git@github.com:${PUBLIC_REPO}.git"
          git push "$remote" "${SHA}:refs/heads/staging" || {
            echo "::warning::could not push ${SHA:0:7} to staging on ${PUBLIC_REPO} (not a fast-forward?)"; exit 1; }
          if git ls-remote --exit-code --tags "$remote" "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} is already there"
          else
            git fetch --force --quiet origin "refs/tags/${TAG}:refs/tags/${TAG}"
            git push "$remote" "refs/tags/${TAG}" || {
              echo "::warning::could not push ${TAG} to ${PUBLIC_REPO}"; exit 1; }
          fi
          echo "${PUBLIC_REPO}: staging and ${TAG} are ${SHA:0:7}"

      - timeout-minutes: 10
        id: pub-release
        name: Copy the prerelease
        if: steps.pub-push.outcome == 'success'
        continue-on-error: true
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          # The files, title and notes of the prerelease here, exactly.
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D files
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name --jq .name > title.txt
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          ls -l files
          # One an earlier attempt left part way is completed in place: every
          # file is uploaded again, replacing what is there.
          if GH_TOKEN="$PUBLIC_TOKEN" gh release view "$TAG" -R "$PUBLIC_REPO" >/dev/null 2>&1; then
            GH_TOKEN="$PUBLIC_TOKEN" gh release upload "$TAG" -R "$PUBLIC_REPO" --clobber files/* || {
              echo "::warning::could not complete ${TAG} on ${PUBLIC_REPO}"; exit 1; }
            echo "${TAG} was on ${PUBLIC_REPO}; its files are now complete"
            exit 0
          fi
          GH_TOKEN="$PUBLIC_TOKEN" gh release create "$TAG" -R "$PUBLIC_REPO" --verify-tag --prerelease \
            --title "$(cat title.txt)" --notes-file notes.md files/* || {
            echo "::warning::could not publish ${TAG} on ${PUBLIC_REPO}"; exit 1; }
          echo "${TAG} published on ${PUBLIC_REPO}"

      - name: Report a failed copy
        if: steps.pub-key.outcome == 'failure' || steps.pub-push.outcome == 'failure' || steps.pub-release.outcome == 'failure'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: echo "::warning::the copy to ${PUBLIC_REPO} did not complete; ${TAG} is published here regardless. Re-run this job to finish it."
