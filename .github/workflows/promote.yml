# Move main to staging without a release, when everything waiting is
# documentation or workflows (docs/RELEASING.md "Promotion").
#
# A release is what moves main, and it takes a number. A change to *.md,
# .gitignore, .github/ or .claude/ changes nothing in the packages, so when
# every commit in main..staging touches only those, this fast-forwards main to
# staging, copies main and staging to openchime/openchime, and closes the OC
# issues the commits name. No tag, no number, no packages.
#
# When code is waiting on staging it does nothing: main moves with the next
# release, which carries the documentation with it. Nothing is rewritten:
# main only fast-forwards, so the hashes stay the same everywhere.
#
# Runs after every push to staging, a merged pull request; dispatching it on
# staging runs it again.
name: promote

on:
  push:
    branches: [staging]
  workflow_dispatch:

# One at a time, and never cancelled half way: a later push waits, then finds
# main already moved, or moves it further.
concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify:
    name: documentation and workflows only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      promote: ${{ steps.classify.outputs.promote }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/staging" ] || {
            echo "::error::promote runs on staging only (this run is on ${GITHUB_REF})"; exit 1; }
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          promote=false
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "main already is ${GITHUB_SHA:0:7}"
          elif ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "::warning::main ($(git rev-parse --short origin/main)) is not an ancestor of ${GITHUB_SHA:0:7}; nothing promoted"
          else
            promote=true
            for c in $(git rev-list origin/main.."$GITHUB_SHA"); do
              while IFS= read -r f; do
                case "$f" in
                  *.md|.gitignore|.github/*|.claude/*) ;;
                  *) promote=false
                     echo "code waiting: $(git log -1 --format='%h %s' "$c") changes ${f}" ;;
                esac
              done < <(git diff-tree --no-commit-id --name-only -r --root "$c")
            done
            if [ "$promote" = true ]; then
              echo "main moves to ${GITHUB_SHA:0:7}:"
              git log --format='  %h %s' origin/main.."$GITHUB_SHA"
            else
              echo "code is waiting on staging: main moves with the next release"
            fi
          fi
          echo "promote=$promote" >> "$GITHUB_OUTPUT"

  promote:
    name: fast-forward main
    needs: classify
    if: needs.classify.outputs.promote == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The same three checks a release-candidate waits for.
      - name: Wait for the push checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/wait_checks.sh "$GITHUB_SHA"

      # RELEASE_SSH_KEY is the one actor main's ruleset lets through. A plain
      # push: if main moved meanwhile, it is refused and nothing else happens.
      - name: Fast-forward main
        env:
          KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::error::RELEASE_SSH_KEY is not set in the release environment"; exit 1; }
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          echo "FROM=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/release_key -o IdentitiesOnly=yes" \
            git push "git@github.com:${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}:refs/heads/main"
          echo "main fast-forwarded to ${GITHUB_SHA:0:7}"

      # As a release's copy: plain pushes with PUBLIC_DEPLOY_KEY. A failure is
      # a warning; main here has moved, and a re-run completes the copy.
      - name: Copy main and staging to openchime/openchime
        continue-on-error: true
        env:
          KEY: ${{ secrets.PUBLIC_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::warning::PUBLIC_DEPLOY_KEY is not set in the release environment; nothing copied"; exit 1; }
          printf '%s\n' "$KEY" > ~/.ssh/public_key
          chmod 600 ~/.ssh/public_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/public_key -o IdentitiesOnly=yes"
          remote=git@github.com:openchime/openchime.git
          git push "$remote" "${GITHUB_SHA}:refs/heads/main" || {
            echo "::warning::could not fast-forward main on openchime/openchime to ${GITHUB_SHA:0:7}"; exit 1; }
          git push "$remote" "${GITHUB_SHA}:refs/heads/staging" || {
            echo "::warning::could not push ${GITHUB_SHA:0:7} to staging on openchime/openchime"; exit 1; }
          echo "openchime/openchime: main and staging are ${GITHUB_SHA:0:7}"

      - name: Close the issues main now has
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::warning::PUBLIC_TOKEN is not set in the release environment; closed nothing"; exit 0; }
          scripts/release/close_shipped_issues.sh --range "${FROM}..${GITHUB_SHA}"
