version: 2
updates:
  # This repository was stranded on actions/checkout@v4, setup-dotnet@v4 and
  # upload-artifact@v4 while every game repo had moved to @v7/@v8, because
  # nothing was watching. Batched weekly, so action bumps arrive as one PR that
  # has to pass the full CI matrix before it can merge.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
