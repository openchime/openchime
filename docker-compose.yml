services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-openchime-dev}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 1; done &&
      mc mb -p local/\"$$LITESTREAM_BUCKET\" || true
      "

  daemon:
    build: .
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      OPENCHIME_DB_PATH: /data/openchime.db
      OPENCHIME_HEALTH_PORT: 8080
      # Local accounts provisioned at boot (AUTH.md §2); the e2e client logs in
      # as these. Idempotent — re-running never clobbers an existing password.
      OC_BOOTSTRAP_USERS: "e2e-alice:e2e-pw:owner,e2e-bob:e2e-pw:member"
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-openchime-dev}
      LITESTREAM_ENDPOINT: http://minio:9000
      LITESTREAM_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LITESTREAM_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8080:8080"   # /healthz
      - "8443:8443"   # binary protocol (TLS)
    volumes:
      - daemon-data:/data
    # Approximates Fly.io's smallest instance (shared-cpu-1x / 256MB, per
    # ARCH-4 and REQ-210). Docker's cgroup limits don't reproduce Fly's
    # actual shared-vCPU throttling behavior exactly.
    mem_limit: 256m
    cpus: "1"

volumes:
  minio-data:
  daemon-data:
