services:
  # MinIO is the local S3-compatible store. It currently has no consumer: the
  # daemon's S3 blob backend (ARCH-70) defaults to the local filesystem and is
  # not wired up here. Kept for the pending object-storage decision.
  minio:
    # Pinned by digest, resolved from Docker Hub 2026-08-02. Re-resolve with:
    #   docker manifest inspect minio/minio:latest
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    # Pinned by digest, resolved from Docker Hub 2026-08-02.
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OPENCHIME_BUCKET: ${OPENCHIME_BUCKET:-openchime-dev}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 1; done &&
      mc mb -p local/\"$$OPENCHIME_BUCKET\" || true
      "

  daemon:
    build: .
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      OPENCHIME_DB_PATH: /data/openchime.db
      OPENCHIME_HEALTH_PORT: 8080
      # Local accounts provisioned at boot (AUTH.md §2); the e2e client logs in
      # as these. Idempotent — re-running never clobbers an existing password.
      OC_BOOTSTRAP_USERS: "e2e-alice:e2e-pw:owner,e2e-bob:e2e-pw:member"
    ports:
      - "8080:8080"   # /healthz
      - "8443:8443"   # binary protocol (TLS)
    volumes:
      - daemon-data:/data
    # Approximates Fly.io's smallest instance (shared-cpu-1x / 256MB, per
    # ARCH-4 and REQ-210). Docker's cgroup limits don't reproduce Fly's
    # actual shared-vCPU throttling behavior exactly.
    mem_limit: 256m
    cpus: "1"

volumes:
  minio-data:
  daemon-data:
